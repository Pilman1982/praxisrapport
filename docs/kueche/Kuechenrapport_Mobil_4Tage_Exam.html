<style>
:root{
  --navy:#001436; --petrol:#005779; --sage:#919388; --terra:#B6633F;
  --cyan:#5EC7F0; --grey:#E3E3E1;
  --bg:#F4F4F2; --surf:#FFFFFF; --surf2:#FAFAF8;
  --ink:#141A24; --ink2:#3C4553; --ink3:#6A7383;
  --line:#DCDCD6; --plus:#2E6B4E; --minus:#A4402F;
  --r:14px; --tap:52px;
  --f-disp:"Domaine Display","Newsreader",Georgia,serif;
  --f-body:"Hurme Geometric Sans 1",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --sal:env(safe-area-inset-left); --sar:env(safe-area-inset-right);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A101C; --surf:#131B29; --surf2:#0F1724;
    --ink:#EDF0F4; --ink2:#C2CAD6; --ink3:#8D97A6;
    --line:#26303F; --grey:#26303F;
    --plus:#5FBE8D; --minus:#E08874;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;
}
input,select,textarea,button{font-family:inherit;font-size:16px}
.hide{display:none !important}

/* ---------- Kopf ---------- */
header{
  position:sticky; top:0; z-index:40;
  background:var(--navy); color:#fff;
  padding:calc(var(--sat) + 10px) calc(var(--sar) + 14px) 10px calc(var(--sal) + 14px);
  box-shadow:0 1px 0 rgba(0,0,0,.18);
}
.hrow{display:flex;align-items:center;gap:10px}
.hrow img{height:16px;width:auto;max-width:104px;flex:0 0 auto;filter:brightness(0) invert(1)}
.htitle{font-family:var(--f-disp);font-size:15.5px;font-weight:600;line-height:1.2;
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsub{font-size:11.5px;color:#9FB0C6;letter-spacing:.04em;text-transform:uppercase;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbtn{margin-left:auto;background:rgba(255,255,255,.12);border:0;color:#fff;
      width:38px;height:38px;border-radius:10px;font-size:18px;line-height:1;flex:0 0 auto}
.hbtn:active{background:rgba(255,255,255,.26)}
.hbtn+.hbtn{margin-left:6px}

/* ---------- Tagesleiste ---------- */
.slots{
  display:flex;gap:7px;overflow-x:auto;padding:9px calc(var(--sar) + 14px) 9px calc(var(--sal) + 14px);
  background:var(--surf);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:30;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.slots::-webkit-scrollbar{display:none}
.slot{
  flex:0 0 auto;min-width:74px;min-height:46px;padding:5px 12px;border-radius:11px;
  border:1px solid var(--line);background:var(--surf2);color:var(--ink2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
}
.slot .sd{font-size:13.5px;font-weight:600;line-height:1.1}
.slot .sw{font-size:10px;color:var(--ink3);letter-spacing:.03em}
.slot[aria-current="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.slot[aria-current="true"] .sw{color:#9FB0C6}
.slot.filled{border-color:var(--petrol)}
.slot.filled .sd::after{content:" •";color:var(--petrol)}
.slot[aria-current="true"].filled .sd::after{color:var(--cyan)}
.slot.exam{border-color:var(--terra)}
.slot.exam .sd{color:var(--terra)}
.slot.exam[aria-current="true"] .sd{color:#fff}

main{padding:14px calc(var(--sar) + 12px) 120px calc(var(--sal) + 12px);max-width:760px;margin:0 auto}

/* ---------- Karten und Listen ---------- */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card.pad{padding:14px}
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);font-weight:600}
.muted{color:var(--ink3);font-size:13px}
h2.sec{font-family:var(--f-disp);font-size:18px;margin:18px 0 8px;font-weight:600}

.slist{list-style:none;margin:0;padding:0}
.slist li{border-bottom:1px solid var(--line)}
.slist li:last-child{border-bottom:0}
.srow{
  display:flex;align-items:center;gap:11px;width:100%;
  min-height:62px;padding:9px 13px;background:transparent;border:0;text-align:left;color:var(--ink);
}
.srow:active{background:var(--surf2)}
.ava{border-radius:50%;object-fit:cover;flex:0 0 auto;background:#ddd;vertical-align:middle}
.ava.ini{display:inline-flex;align-items:center;justify-content:center;background:#e3e3e1;color:#005779;font-weight:700;letter-spacing:.02em}
.gpill{flex:0 0 auto;font-weight:700;font-size:13.5px;padding:5px 9px;border-radius:999px;background:var(--surf2,#eee);margin-left:6px;font-variant-numeric:tabular-nums}
.gpill.big{font-size:12px;padding:2px 8px;margin:0 0 0 4px;white-space:nowrap;display:inline-block}
.gpill.g-ok{background:#dff1e5;color:#1d5c34}.gpill.g-mid{background:#eceef2;color:#1a1f2b}.gpill.g-bad{background:#f8dcd7;color:#8a2416}
.gpill.strong{outline:2px solid currentColor}
.srow.grow{flex-wrap:wrap;row-gap:8px}
.fbtext{width:100%;min-height:52vh;border:1px solid var(--line,#d9d9d5);border-radius:12px;padding:12px;font-size:15px;line-height:1.5;background:var(--card,#fff);color:inherit;resize:vertical}
.fbopts{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:0 0 10px;font-size:14px}
.fbopts select{font-size:15px;padding:6px 8px;border-radius:8px}
.srow .fbbtn{flex:1 1 100%;margin-top:2px;padding:9px 12px;font-size:14px}
.srow .fbbtn.done{opacity:.75}

.gbox{display:grid;grid-template-rows:auto auto;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px 8px;justify-items:center;flex:1 1 100%}
.gbox .gl{font-size:11px;color:var(--ink3,#777);text-align:center}
.gbox .gpill{margin-left:0}
.critbar .cg{font-size:11px;opacity:.75;margin-left:5px;font-variant-numeric:tabular-nums}
.srow .nm{flex:1;min-width:0;font-size:16.5px;font-weight:600;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .sub{font-size:12.5px;color:var(--ink3);font-weight:400;margin-top:1px;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .chev{color:var(--ink3);font-size:19px;flex:0 0 auto}
.dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;background:var(--grey)}
.dot.present{background:var(--plus)}
.dot.late{background:var(--terra)}
.dot.excused{background:var(--sage)}
.dot.unexcused{background:var(--minus)}
.dot.tm{background:var(--petrol)}
.pill{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);
      color:var(--ink3);flex:0 0 auto;white-space:nowrap}
.pill.on{border-color:var(--petrol);color:var(--petrol)}

/* ---------- Buttons ---------- */
.btn{
  min-height:var(--tap);padding:12px 16px;border-radius:12px;border:1px solid var(--line);
  background:var(--surf);color:var(--ink);font-size:15.5px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:active{background:var(--surf2)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:active{background:#00224f}
.btn.wide{width:100%}
.btn.sm{min-height:42px;padding:8px 13px;font-size:14px;font-weight:500}
.btn.danger{border-color:var(--minus);color:var(--minus)}
.row{display:flex;gap:9px;flex-wrap:wrap}

/* ---------- Anwesenheit ---------- */
.att{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.att button{
  min-height:58px;border-radius:12px;border:1.5px solid var(--line);background:var(--surf2);
  color:var(--ink2);font-size:14px;font-weight:600;padding:6px 4px;line-height:1.2;
}
.att button:nth-child(4){grid-column:span 1}
.att button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.att button.warn[aria-pressed="true"]{background:var(--terra);border-color:var(--terra)}
.att button.bad[aria-pressed="true"]{background:var(--minus);border-color:var(--minus)}
.att button.tm[aria-pressed="true"]{background:var(--petrol);border-color:var(--petrol)}

/* ---------- Bausteine ---------- */
/* Alle Kriterien auf einen Blick, ohne seitliches Scrollen (Rückmeldung Pilot 08.10.2026) */
.critbar{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:7px;padding:2px 0 12px}
.critbar button{
  min-height:42px;padding:7px 11px;border-radius:12px;text-align:left;
  display:flex;align-items:center;flex-wrap:wrap;gap:0 4px;line-height:1.2;
  border:1px solid var(--line);background:var(--surf2);color:var(--ink2);font-size:14px;font-weight:600;
}
.critbar button[aria-current="true"]{background:var(--petrol);border-color:var(--petrol);color:#fff}
.critbar button .n{font-size:11px;opacity:.8;margin-left:4px}

.chips{display:flex;flex-direction:column;gap:8px}
.chip{
  display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
  min-height:var(--tap);padding:11px 13px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--surf2);color:var(--ink);font-size:15px;line-height:1.3;
}
.chip .sg{flex:0 0 auto;width:22px;height:22px;border-radius:6px;display:flex;
          align-items:center;justify-content:center;font-size:14px;font-weight:700;margin-top:1px}
.chip.pos .sg{background:rgba(46,107,78,.13);color:var(--plus)}
.chip.neg .sg{background:rgba(164,64,47,.13);color:var(--minus)}
.chip .tx{flex:1;min-width:0}
.chip .w{font-size:11px;color:var(--ink3);margin-top:2px;letter-spacing:.03em}
.chip[aria-pressed="true"].pos{border-color:var(--plus);background:rgba(46,107,78,.10)}
.chip[aria-pressed="true"].neg{border-color:var(--minus);background:rgba(164,64,47,.10)}
.chip[aria-pressed="true"] .tx{font-weight:600}
.chip.ko .w{color:var(--minus);font-weight:600}
.morebtn{width:100%;min-height:46px;border-radius:12px;border:1px dashed var(--line);
         background:transparent;color:var(--ink3);font-size:14px;font-weight:600}

/* ---------- Felder ---------- */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);font-weight:600}
.field input,.field select,.field textarea{
  background:var(--surf2);border:1px solid var(--line);border-radius:10px;
  padding:12px 12px;font-size:16px;width:100%;color:var(--ink);min-height:48px;
}
.field textarea{min-height:110px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}

/* ---------- Vollbild-Erfassung ---------- */
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.sheet-h{
  background:var(--navy);color:#fff;
  padding:calc(var(--sat) + 10px) calc(var(--sar) + 12px) 10px calc(var(--sal) + 12px);
  display:flex;align-items:center;gap:10px;
}
.sheet-h .nm{flex:1;min-width:0;font-family:var(--f-disp);font-size:18px;font-weight:600;
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-h .sb{font-size:11.5px;color:#9FB0C6}
.sheet-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
         padding:14px calc(var(--sar) + 12px) 28px calc(var(--sal) + 12px)}
.sheet-f{
  background:var(--surf);border-top:1px solid var(--line);
  padding:10px calc(var(--sar) + 12px) calc(var(--sab) + 10px) calc(var(--sal) + 12px);
  display:flex;gap:9px;
}
.sheet-f .btn{flex:1}

/* ---------- Fussleiste ---------- */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surf);
  border-top:1px solid var(--line);
  padding:9px calc(var(--sar) + 12px) calc(var(--sab) + 9px) calc(var(--sal) + 12px);
  display:flex;gap:9px;
}
.bar .btn{flex:1;min-height:50px;font-size:15px;white-space:nowrap}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--sab) + 84px);z-index:90;
  background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;
  font-size:14.5px;max-width:88vw;text-align:center;box-shadow:0 8px 26px rgba(0,0,0,.28);
  opacity:0;pointer-events:none;transition:opacity .18s;
}
#toast.on{opacity:1}
.banner{
  background:rgba(182,99,63,.13);border:1px solid rgba(182,99,63,.4);
  border-radius:12px;padding:11px 13px;font-size:13.5px;color:var(--ink2);margin-bottom:14px;
}
.banner.bad{background:rgba(190,40,40,.12);border-color:rgba(190,40,40,.55);color:var(--ink);font-weight:600}

/* ---------- Daily Grades (08.10.2026) ---------- */
.dgm{width:30px;height:30px;flex:0 0 auto;color:#fff;display:block}
.dgm svg{width:30px;height:30px;display:block}
.happ{font-size:11px;color:#9FB0C6;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.hbtn{display:grid;place-items:center;text-decoration:none}
@media (max-width:440px){#btnSwitch,.happ2{display:none}}
.spill{display:inline-block;font:700 11.5px/1 var(--f-text,inherit);letter-spacing:.02em;border:1px solid var(--line);border-radius:6px;padding:2px 5px;margin:0 6px 0 0;vertical-align:1px;color:var(--ink2);background:var(--surf2)}
.spill.oc{background:var(--petrol);border-color:var(--petrol);color:#fff}
.nickbtn{background:transparent;border:1px solid var(--line);color:inherit;border-radius:8px;font-size:14px;line-height:1;padding:4px 7px;margin-left:8px;vertical-align:2px}
.nickbox{background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:14px}
.nickbox input{flex:1;min-width:0;font-size:16px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surf);color:var(--ink)}
.sumcard{border:2px solid var(--petrol)}
</style>
</head>

{i:"sel-n2",c:"sel",d:-1,w:W.m,t:{de:"Braucht durchgehend Anleitung",en:"Needs continuous guidance",th:"ต้องมีคนคอยบอกตลอดเวลา",zh:"全程需要他人指导"},a:{de:"Arbeitsschritte notieren und beim nächsten Mal selbständig starten.",en:"Note the work steps and start on your own next time.",th:"จดขั้นตอนงานไว้ และเริ่มเองในครั้งถัดไป",zh:"记下工作步骤，下次独立开始"}},
{i:"sel-n3",c:"sel",d:-1,w:W.m,t:{de:"Absprache im Team fehlt",en:"Fails to coordinate with the team",th:"ไม่ประสานงานกับทีม",zh:"缺少与团队的沟通协调"},a:{de:"Vor dem Start kurz abgleichen, wer was übernimmt.",en:"Agree briefly who does what before starting.",th:"ตกลงกันสั้น ๆ ก่อนเริ่มว่าใครทำอะไร",zh:"开工前简短商定谁负责什么"}},
{i:"sel-n4",c:"sel",d:-1,w:W.l,t:{de:"Erkennt anstehende Arbeiten nicht",en:"Does not recognise upcoming work",th:"มองไม่ออกว่างานถัดไปคืออะไร",zh:"看不出接下来要做的工作"},a:{de:"Am Ende jeder Aufgabe bewusst umschauen, was als Nächstes ansteht.",en:"At the end of each task, look around for what comes next.",th:"เมื่อจบแต่ละงาน ให้มองรอบ ๆ ว่ามีงานอะไรต่อ",zh:"每完成一项任务，有意识地环顾下一步该做什么"}},
{i:"sel-p1",c:"sel",d:1,w:W.l,t:{de:"Stellt gezielte, weiterführende Fragen",en:"Asks precise, forward-looking questions",th:"ตั้งคำถามตรงประเด็นและต่อยอดได้",zh:"能提出有针对性且有深度的问题"}},
{i:"sel-p2",c:"sel",d:1,w:W.m,t:{de:"Arbeitet eigenverantwortlich ohne Nachfragen",en:"Works responsibly without needing prompts",th:"ทำงานรับผิดชอบได้เองโดยไม่ต้องเตือน",zh:"无需催促即可自主负责地工作"}},
{i:"sel-p3",c:"sel",d:1,w:W.m,t:{de:"Probleme früh erkannt und gehandelt",en:"Spotted problems early and acted",th:"เห็นปัญหาแต่เนิ่น ๆ และลงมือแก้",zh:"及早发现问题并采取行动"}},
{i:"sel-p4",c:"sel",d:1,w:W.m,t:{de:"Verantwortung für einen Posten übernommen",en:"Took charge of a station",th:"รับผิดชอบดูแลสถานีงานหนึ่ง",zh:"独立负责了一个岗位"}},
/* FACHLICHE KENNTNISSE */
{i:"fac-n1",c:"fac",d:-1,w:W.m,t:{de:"Schnittarten nicht normgerecht",en:"Cuts not to standard",th:"การหั่นไม่ได้มาตรฐาน",zh:"刀工不符合规范"},a:{de:"Schnittarten nach Pauli repetieren und mit Rüstabfall üben.",en:"Revise the cuts per Pauli and practise on trimmings.",th:"ทบทวนวิธีหั่นตามตำรา Pauli และฝึกกับเศษวัตถุดิบ",zh:"按 Pauli 教材复习刀工，并用边角料练习"}},
{i:"fac-n2",c:"fac",d:-1,w:W.m,t:{de:"Garmethode falsch gewählt oder angewendet",en:"Cooking method wrongly chosen or applied",th:"เลือกหรือใช้วิธีปรุงไม่ถูกต้อง",zh:"烹调方法选择或运用错误"},a:{de:"Vor dem Garen kurz überlegen: Produkt, Ziel, passende Methode.",en:"Before cooking, think it through: product, goal, matching method.",th:"ก่อนปรุงให้คิดสั้น ๆ: วัตถุดิบ เป้าหมาย วิธีที่เหมาะสม",zh:"烹调前想清楚：食材、目标、合适的方法"}},
{i:"fac-n3",c:"fac",d:-1,w:W.m,t:{de:"Abschmecken ungenügend",en:"Seasoning insufficient",th:"ปรุงรสไม่เพียงพอ",zh:"调味不到位"},a:{de:"Regelmässig abschmecken und in Etappen würzen, nicht erst am Schluss.",en:"Taste regularly and season in stages, not only at the end.",th:"ชิมบ่อย ๆ และปรุงเป็นช่วง ไม่ใช่ตอนท้ายอย่างเดียว",zh:"经常试味，分阶段调味，不要只在最后调"}},
{i:"fac-n4",c:"fac",d:-1,w:W.s,t:{de:"Allergene oder spezielle Ernährungsform nicht korrekt umgesetzt",en:"Allergens or special diet not handled correctly",th:"จัดการสารก่อภูมิแพ้หรืออาหารเฉพาะไม่ถูกต้อง",zh:"过敏原或特殊膳食处理不正确"},a:{de:"Allergenliste vor Produktionsbeginn prüfen und Arbeitsplatz trennen.",en:"Check the allergen list before production and separate the workstation.",th:"ตรวจรายการสารก่อภูมิแพ้ก่อนเริ่ม และแยกจุดทำงาน",zh:"生产前核对过敏原清单，并分开工作区域"}},
{i:"fac-n5",c:"fac",d:-1,w:W.m,t:{de:"Gerätschaften unsachgemäss eingesetzt",en:"Equipment used improperly",th:"ใช้อุปกรณ์ไม่ถูกวิธี",zh:"设备使用不当"},a:{de:"Vor dem Einsatz Bedienung und Sicherheitsregeln des Geräts klären.",en:"Clarify operation and safety rules before using the equipment.",th:"ศึกษาวิธีใช้และกฎความปลอดภัยของอุปกรณ์ก่อนใช้งาน",zh:"使用前弄清设备的操作方法和安全规定"}},
{i:"fac-n6",c:"fac",d:-1,w:W.m,t:{de:"Theorie nicht in die Praxis übertragen",en:"Theory not transferred into practice",th:"ไม่นำทฤษฎีมาใช้ในทางปฏิบัติ",zh:"未将理论应用于实践"},a:{de:"Unterrichtsnotizen zum Thema vor dem nächsten Einsatz durchlesen.",en:"Re-read your class notes on the topic before the next shift.",th:"อ่านโน้ตในชั้นเรียนเรื่องนั้นก่อนเข้างานครั้งถัดไป",zh:"下次上岗前重读相关课堂笔记"}},
{i:"fac-p1",c:"fac",d:1,w:W.m,t:{de:"Schnittarten sauber und normgerecht",en:"Cuts clean and to standard",th:"หั่นได้เรียบร้อยและได้มาตรฐาน",zh:"刀工干净且符合规范"}},
{i:"fac-p2",c:"fac",d:1,w:W.m,t:{de:"Garmethode korrekt gewählt und begründet",en:"Cooking method correctly chosen and justified",th:"เลือกวิธีปรุงถูกต้องและอธิบายเหตุผลได้",zh:"烹调方法选择正确并能说明理由"}},
{i:"fac-p3",c:"fac",d:1,w:W.m,t:{de:"Präzises Abschmecken",en:"Precise seasoning",th:"ปรุงรสได้แม่นยำ",zh:"调味精准"}},
{i:"fac-p4",c:"fac",d:1,w:W.m,t:{de:"Allergene sicher umgesetzt",en:"Allergens handled reliably",th:"จัดการสารก่อภูมิแพ้ได้อย่างปลอดภัย",zh:"过敏原处理稳妥可靠"}},
{i:"fac-p5",c:"fac",d:1,w:W.m,t:{de:"Theoriewissen sichtbar angewendet",en:"Visibly applied theoretical knowledge",th:"นำความรู้ทางทฤษฎีมาใช้อย่างเห็นได้ชัด",zh:"明显运用了理论知识"}},
/* MOTIVATION */
{i:"mot-n1",c:"mot",d:-1,w:W.m,t:{de:"Beschäftigt sich mit dem Handy statt zu arbeiten",en:"Busy with the phone instead of working",th:"เล่นโทรศัพท์แทนการทำงาน",zh:"只顾看手机而不干活"},a:{de:"Handy bleibt während des Dienstes in der Garderobe.",en:"The phone stays in the locker room during the shift.",th:"เก็บโทรศัพท์ไว้ในห้องเปลี่ยนเสื้อผ้าตลอดเวลาปฏิบัติงาน",zh:"上岗期间请将手机放在更衣室。"}},
{i:"mot-n2",c:"mot",d:-1,w:W.m,t:{de:"Entzieht sich der Arbeit und ist nicht auffindbar",en:"Avoids work and cannot be found",th:"หลบงานและหาตัวไม่พบ",zh:"躲避工作，找不到人"},a:{de:"Sichtbar am Posten bleiben und sich abmelden, wenn Sie den Posten verlassen.",en:"Stay visible at your station and say so when you leave it.",th:"อยู่ที่สถานีงานให้เห็นได้ และแจ้งทุกครั้งเมื่อจะออกจากจุดงาน",zh:"留在岗位上让人看得见，离开岗位时要打招呼。"}},
{i:"mot-n3",c:"mot",d:-1,w:W.m,t:{de:"Schaut anderen beim Arbeiten zu, statt mitzuarbeiten",en:"Watches others work instead of joining in",th:"ยืนดูคนอื่นทำงานแทนที่จะลงมือช่วย",zh:"站着看别人干活，而不动手参与"},a:{de:"Mit anpacken statt zusehen; fragen Sie nach, wo Sie übernehmen können.",en:"Lend a hand instead of watching; ask where you can take over.",th:"ลงมือช่วยแทนการยืนดู และถามว่าจะรับงานส่วนใดได้",zh:"动手参与而不是旁观，主动问可以接手哪一部分。"}},
{i:"mot-n4",c:"mot",d:-1,w:W.m,t:{de:"Unterhält sich, ohne dabei weiterzuarbeiten",en:"Chats without carrying on with the work",th:"คุยกันโดยไม่ทำงานต่อ",zh:"只顾聊天，手上的活停下来"},a:{de:"Gespräche in die Pause verlegen, im Dienst konzentriert weiterarbeiten.",en:"Keep conversations for the break and stay focused during the shift.",th:"เก็บการพูดคุยไว้ช่วงพัก และตั้งใจทำงานระหว่างปฏิบัติงาน",zh:"把闲聊留到休息时间，上岗时专注手上的工作。"}},
{i:"mot-p1",c:"mot",d:1,w:W.m,t:{de:"Macht von sich aus mit",en:"Joins in on their own initiative",th:"ลงมือร่วมทำงานด้วยตนเอง",zh:"主动参与"}},
{i:"mot-p2",c:"mot",d:1,w:W.m,t:{de:"Durchgehend aktiv und mit Einsatz dabei",en:"Consistently active and committed",th:"กระตือรือร้นและทุ่มเทตลอดเวลา",zh:"全程积极投入"}},
{i:"mot-p3",c:"mot",d:1,w:W.l,t:{de:"Fragt von sich aus, was zu tun ist",en:"Asks on their own what needs doing",th:"ถามเองว่ามีอะไรให้ทำ",zh:"主动询问接下来该做什么"}},
{i:"mot-p4",c:"mot",d:1,w:W.m,t:{de:"Unterstützt andere im Team von sich aus",en:"Supports others in the team unprompted",th:"ช่วยเหลือเพื่อนร่วมทีมด้วยความสมัครใจ",zh:"主动帮助团队中的其他人"}},
{i:"mot-p5",c:"mot",d:1,w:W.m,t:{de:"Sieht die Arbeit selbst und packt an",en:"Sees the work and gets on with it",th:"มองเห็นงานเองและลงมือทำ",zh:"自己看得到活并主动去做"}}
];

   Gruppe: "Gruppe 1", "Team 2", auch "Grp 1" oder "Group 1".               */
function erkenneKlasse(v){
  const m = String(v || "").trim().match(/^hf\s*([a-z])\s*(\d?)$/i);
  return m ? ("HF" + m[1] + m[2]).toUpperCase() : "";
}
function erkenneGruppe(v){
  const s = String(v || "").trim();
  /* EHL-Einteilung: "Gruppe 1 Team A", auch "Gruppe 1A", "Gr1 A" */
  const e = s.match(/^(?:gruppe|grp|gr|group)\s*(\d+)\s*(?:team\s*)?([a-z])$/i);
  if(e) return "Gruppe " + e[1] + " Team " + e[2].toUpperCase();
  const m = s.match(/^(gruppe|grp|group|team)\s*(\d+)$/i);
  return m ? ((/^t/i.test(m[1]) ? "Team " : "Gruppe ") + m[2]) : "";
}

function parseStudentLine(line){
  const parts = line.split(/[;\t]/).map(x=>x.trim());
  let mail="", lang="", klasse="", gruppe="";
  const rest = [];
  parts.forEach(v=>{
    if(!mail && v.indexOf("@") >= 0){ mail = v; return; }
    if(!lang && /^(de|en|zh)$/i.test(v)){ lang = v.toLowerCase(); return; }
    if(!klasse && erkenneKlasse(v)){ klasse = erkenneKlasse(v); return; }
    if(!gruppe && erkenneGruppe(v)){ gruppe = erkenneGruppe(v); return; }
    rest.push(v);
  });
  let last = rest[0] || "", first = rest[1] || "", nick = rest[2] || "";
  if(last && !first && /\s/.test(last)){
    const q = last.split(/\s+/); last = q.shift(); first = q.join(" ");
  }
  return {last, first, nick, mail, lang, klasse, gruppe};
}

/* ---------- Hilfen ---------- */
function el(tag, attrs, kids){
  const n = document.createElement(tag);
  for(const k in (attrs||{})){
    const v = attrs[k];
    /* false und null: Attribut gar nicht setzen. setAttribute("selected", false) wuerde
       "selected=false" schreiben, das gilt als gesetzt; dann zeigte jedes Auswahlfeld
       den letzten Eintrag an (Fehler "Turnus startet am" immer Donnerstag). */
    if(v === undefined || v === null || v === false) continue;
    if(k === "text") n.textContent = v;
    else if(k === "html") n.innerHTML = v;
    else if(k.slice(0,2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  (Array.isArray(kids) ? kids : (kids ? [kids] : [])).forEach(c=>c && n.appendChild(c));
  return n;
}

  const text = [subj, "", t("absMail") + ":"].concat(abs.length ? abs.map(x => "- " + x) : [t("absNone")])
    .concat(["", t("dayMailTo") + " " + ABS_MAIL]).join("\n");
  try{
    const file = new File([blob], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:subj, text});
      toast(t("shared")); return;
    }
  }catch(e){ if(e && e.name === "AbortError") return; }
  downloadBlob(blob, name);
}
/* Noten 2.0: eigene Sicherung in «Dateien» (iPad) bzw. Downloads (Laptop) */
async function backupSave(){
  const name = t("backupPrefix") + "_" + fileStem() + ".json";
  const blob = jsonBlob();
  try{
    const file = new File([blob], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      toast(t("backupTip"));
      await navigator.share({files:[file], title:name});
      return;
    }
  }catch(e){ if(e && e.name === "AbortError") return; }
  downloadBlob(blob, name);
}
function downloadBlob(blob, name){
  try{
    const url = URL.createObjectURL(blob);
    const a = el("a",{href:url, download:name, style:"display:none"});
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 6000);
    toast(t("saved") + ": " + name);
  }catch(e){ toast(name); }
}
function absenceList(id){
  const d = S.days[id] || {}; const out = [];
  S.students.forEach(st=>{
    const r = d[st.id]; if(!r) return;
    const a = attOf(r);
    if(a === "late" || a === "excused" || a === "unexcused"){
      const kg = [klasseOf(st), gruppeOf(st)].filter(Boolean).join(" \u00b7 ");
      out.push(longName(st) + (kg ? "   \u00b7   " + kg : "") + "   \u2014   " + t(a));
    }
  });
  return out;
}
function absenceMail(){

let sheetCrit = "hyg", sheetAll = false;
function openSheet(student){
  const host = document.getElementById("sheetHost");
  sheetCrit = "hyg"; sheetAll = false;
  let nickOpen = false;
  /* Vor dem Schliessen das aktive Feld verlassen und speichern: Freitext geht nie verloren, egal wo man schliesst */
  const sichern = ()=>{ try{ const a = document.activeElement; if(a && a.blur) a.blur(); }catch(e){} persist(); };
  const close = ()=>{ sichern(); host.innerHTML = ""; document.body.style.overflow = ""; render(); };
  document.body.style.overflow = "hidden";
  const sh = el("div",{class:"sheet"});
  const hd = el("div",{class:"sheet-h"});
  { const av0 = avatar(student, 44); if(av0) hd.appendChild(av0); }
  hd.appendChild(el("div",{style:"min-width:0;flex:1"},[
    el("div",{class:"nm"},[document.createTextNode(dispName(student) + nickTag(student)),
      el("button",{class:"nickbtn",id:"nickBtn",title:n2x("nick"),"aria-label":n2x("nick"),text:"✎",onclick:()=>{ nickOpen = !nickOpen; draw(); }})]),
    el("div",{class:"sb"},[document.createTextNode(slotLabel(slotById(curSlot)) + "  "), schichtPill(student, curSlot), el("span",{id:"n2grade",class:"gpill big"})])
  ]));
  hd.appendChild(el("button",{class:"hbtn",text:"✕","aria-label":t("done"),onclick:close}));
  sh.appendChild(hd);
  const body = el("div",{class:"sheet-b"});
  sh.appendChild(body);
  const ft = el("div",{class:"sheet-f"});
  const ix = S.students.findIndex(x=>x.id===student.id);
  if(ix > 0) ft.appendChild(el("button",{class:"btn",text:"‹",
    onclick:()=>{ sichern(); host.innerHTML=""; document.body.style.overflow=""; openSheet(S.students[ix-1]); }}));
  ft.appendChild(el("button",{class:"btn pri",text:t("done"),onclick:close}));
  if(ix < S.students.length-1) ft.appendChild(el("button",{class:"btn",text:"›",
    onclick:()=>{ sichern(); host.innerHTML=""; document.body.style.overflow=""; openSheet(S.students[ix+1]); }}));
  sh.appendChild(ft);
  host.innerHTML = ""; host.appendChild(sh);

  function draw(){
    body.innerHTML = "";
    const r = dayRec(curSlot, student.id);
    n2ShowHead(student.id);
    const n2cg = n2Crit(curSlot, student.id);

    if(nickOpen) body.appendChild(n2NickBox(student, ()=>{ nickOpen = false; const nm0 = sh.querySelector(".sheet-h .nm");
      if(nm0 && nm0.firstChild) nm0.firstChild.textContent = dispName(student) + nickTag(student); draw(); }));
    /* Anwesenheit */
    body.appendChild(el("span",{class:"eyebrow",style:"display:block;margin-bottom:7px",text:t("attendance")}));
    const att = el("div",{class:"att"});
    [["present",""],["late","warn"],["excused",""],["unexcused","bad"],["teamMarket","tm"]]
      .forEach(([k,cls],i)=>{
        const val = (k === "teamMarket") ? "tm" : k;
        att.appendChild(el("button",{class:cls,"aria-pressed":String(attOf(r)===val),
          text:t(k), onclick:()=>{ r.att = val; persist(); draw(); }}));
      });
    body.appendChild(att);
    if(attOf(r) === "late") body.appendChild(el("div",{class:"banner",style:"margin-top:9px",text:n2x("lateDay")}));
    if(attOf(r) === "tm" && planSchicht(student, curSlot).toUpperCase() === "OC") body.appendChild(el("div",{class:"banner",style:"margin-top:9px",text:n2x("ocDay")}));

    /* Kriterien */
    body.appendChild(el("span",{class:"eyebrow",style:"display:block;margin:18px 0 7px",text:t("obs")}));
    const bar = el("div",{class:"critbar"});
    CRITS.forEach(c=>{
      const n = obsOf(r).filter(id=>CHIP[id] && CHIP[id].c === c.k).length;
      const b = el("button",{"aria-current":String(sheetCrit===c.k),
        onclick:()=>{ sheetCrit = c.k; sheetAll = false; draw(); }});
      b.appendChild(el("span",{text:critName(c.k)}));
      if(n2cg) b.appendChild(el("span",{class:"cg",text:n2cg[c.k].toFixed(2)}));
      if(n) b.appendChild(el("span",{class:"n",text:"("+n+")"}));
      bar.appendChild(b);
    });
    bar.appendChild(el("button",{"aria-current":String(sheetCrit==="__note"),
      onclick:()=>{ sheetCrit = "__note"; draw(); }, text:"✎ "+t("note")}));
    body.appendChild(bar);

    if(sheetCrit === "__note"){
      const nt = r.note || {txt:""};
      const f = el("div",{class:"field"});
      const ta = el("textarea",{placeholder:t("notePh"),
        oninput:e=>{ r.note = {txt:e.target.value, crit:"", dir:0, w:0}; persist(); const ok = document.getElementById("noteOk"); if(ok) ok.textContent = n2x("saved"); },
        onblur:()=>persist()});
      ta.value = nt.txt || "";
      f.appendChild(ta);
      body.appendChild(f);
      body.appendChild(el("p",{class:"muted",style:"margin:0",text:t("noteHint")}));
      body.appendChild(el("p",{class:"muted",id:"noteOk",style:"margin:6px 0 0;font-size:13px;color:var(--plus,#2f7d4f)",text:""}));
      return;
    }

    const set = new Set(obsOf(r));
    const quick = QUICK[sheetCrit] || [];
    const list = CHIPS.filter(c=>c.c === sheetCrit);
    const shown = sheetAll ? list
      : list.filter(c=>quick.indexOf(c.i) >= 0 || set.has(c.i));
    const order = c => (quick.indexOf(c.i) >= 0 ? quick.indexOf(c.i) : 90) + (c.d > 0 ? 0 : -0.5);
    shown.sort((a,b)=>order(a)-order(b));

    const box = el("div",{class:"chips"});
    shown.forEach(c=>{
      const on = set.has(c.i);
      const wtxt = c.ko ? t("ko") : (c.w === W.l ? t("light") : (c.w === W.s ? t("heavy") : t("medium")));
      const b = el("button",{class:"chip "+(c.d>0?"pos":"neg")+(c.ko?" ko":""),
        "aria-pressed":String(on),
        onclick:()=>{
          const s2 = new Set(obsOf(r));
          if(s2.has(c.i)) s2.delete(c.i); else s2.add(c.i);
          r.obs = [...s2]; persist(); draw();
        }});
      b.appendChild(el("span",{class:"sg",text: on ? "✓" : (c.d>0 ? "+" : "−")}));
      b.appendChild(el("span",{class:"tx"},[
        document.createTextNode(chipT(c)),
        el("div",{class:"w",text:(c.d>0?"+ ":"− ")+wtxt+"  \u00b7  "+n2Effect(c)})
      ]));
      box.appendChild(b);
    });
    body.appendChild(box);
    if(list.length > shown.length || sheetAll)
      body.appendChild(el("button",{class:"morebtn",style:"margin-top:9px",
        text: sheetAll ? t("showLess") : t("showAll")+" ("+list.length+")",
        onclick:()=>{ sheetAll = !sheetAll; draw(); }}));
  }
  draw();
}

async function onLoadBackup(e){
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!f) return;
  try{
    const o = JSON.parse(await f.text());
    if(o && o.format === "praxisrapport-semesterpaket"){ toast(t("loadSem")); return; }
    if(!o || !o.settings || !Array.isArray(o.students)) throw new Error("format");
    const other = o.variant && o.variant !== MVARIANT;
    S = {settings:{...DEF, ...o.settings, variant:MVARIANT},
         students:o.students.filter(x=>x && typeof x.name === "string"),
         days: other ? {} : sanitizeDays(o.days),
         dayMeta: other ? {} : ((o.dayMeta && typeof o.dayMeta === "object") ? o.dayMeta : {})};
    delete S.settings.isSample;
    normalizeSettings(); normalizeStudents(); pruneOrphans();
    L = (T[S.settings.uiLang] ? S.settings.uiLang : "de");
    persist();
    curSlot = slots()[0].id;
    view = "day"; render();
    toast(other ? t("loadPartial")
                : (t("loadDone") + ": " + S.students.length + " " + t("students")));
  }catch(err){ toast(t("loadBad")); }
}

function n2Base(){ const b = parseFloat(S.settings.base); return isFinite(b) ? b : 5; }
function n2Obs(r){ return (r && Array.isArray(r.obs)) ? r.obs : []; }
/* Kriteriennoten eines Tages, wie critGradesForDay am Laptop */
function n2Crit(slotId, sid){
  const r = (S.days[slotId] || {})[sid]; if(!r) return null;
  const sl = slots().find(x => x.id === slotId); const isExam = !!(sl && sl.exam);
  const att = ["present","late","excused","unexcused","tm"].indexOf(r.att) >= 0 ? r.att : "present";
  const g = {};
  if(att === "tm"){ CRITS.forEach(c => g[c.k] = 5); return g; }
  if(att === "excused" && !isExam) return null;
  if(att === "unexcused" || (isExam && att === "excused")){ CRITS.forEach(c => g[c.k] = 1); return g; }
  const obs = n2Obs(r).map(i => CHIP[i]).filter(Boolean);
  /* Verspätet (Entscheid 08.10.2026): der Tag startet eine Note tiefer, 4.00 statt 5.00. */
  const b0 = n2Base() - (att === "late" ? 1 : 0);
  const nt = r.note;
  CRITS.forEach(c => {
    const mine = obs.filter(o => o.c === c.k);
    if(mine.some(o => o.ko)){ g[c.k] = 1; return; }
    let d = 0; mine.forEach(o => { d += o.d * o.w; });
    if(nt && nt.crit === c.k && nt.dir && nt.w) d += nt.dir * nt.w;
    d = Math.max(CAP_NEG, Math.min(CAP_POS, d));
    g[c.k] = Math.max(1, Math.min(6, b0 + d));
  });
  return g;
}
function n2Day(slotId, sid){
  const g = n2Crit(slotId, sid); if(!g) return null;
  let sum = 0, w = 0;
  CRITS.forEach(c => { const ww = (c.k === N2_DOUBLE && S.settings[N2_DOUBLE + "2"] !== false) ? 2 : 1; sum += g[c.k] * ww; w += ww; });
  return sum / w;
}
function n2Praxis(sid){
  const v = slots().filter(s => !s.exam).map(s => n2Day(s.id, sid)).filter(x => x != null);

}
function n2Exam(sid){ const ex = slots().find(s => s.exam); return ex ? n2Day(ex.id, sid) : null; }
function n2Final(sid){ const p = n2Praxis(sid).avg, e = n2Exam(sid); return (p != null && e != null) ? (2 * p + e) / 3 : null; }

function n2Teacher(lg){

/* Auswertung pro Person über alle Tage dieses Pakets */
function n2FbData(sid){
  const tally = {}; let late = 0, unex = 0, days = 0;
  slots().filter(x => !x.exam).forEach(sl => {                    // Exam Day bleibt aus der Mail (noch nicht kommunizierbar)
    const r = (S.days[sl.id] || {})[sid]; if(!r) return;
    const att = r.att || "present";
    if(att === "late") late++;
    if(att === "unexcused") unex++;
    if(att === "excused" || att === "unexcused" || att === "tm") return;
    days++;
    n2Obs(r).forEach(i => { tally[i] = (tally[i] || 0) + 1; });
  });
  const per = {}; CRITS.forEach(c => per[c.k] = []);
  slots().filter(x => !x.exam).forEach(sl => { const g = n2Crit(sl.id, sid); if(g) CRITS.forEach(c => per[c.k].push(g[c.k])); });
  const crit = {}; CRITS.forEach(c => { const v = per[c.k]; crit[c.k] = v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; });
  const list = Object.keys(tally).map(i => ({c: CHIP[i], n: tally[i]})).filter(x => x.c);
  const pos = list.filter(x => x.c.d > 0).sort((a, b) => (b.n * (b.c.w || 1)) - (a.n * (a.c.w || 1)));
  const neg = list.filter(x => x.c.d < 0 && x.c.i !== N2_LATE).sort((a, b) => ((b.c.ko ? 9 : 0) + b.n * (b.c.w || 1)) - ((a.c.ko ? 9 : 0) + a.n * (a.c.w || 1)));
  return {pos, neg, late, unex, days, crit};
}
function n2FbText(s, lg, withGrades){
  const X = N2FB[lg] || N2FB.de, D = n2FbData(s.id);
  const sl = slots().filter(x => x.date && !x.exam), a = sl.length ? dmy(sl[0].date) : "", b = sl.length ? dmy(sl[sl.length - 1].date) : "";
  const outlet = [S.settings.outlet, S.settings.outlet2].filter(Boolean).join(" / ");
  const first = (s.nick || s.first || String(s.name || "").split(/\s+/).slice(1).join(" ") || s.name || "").trim();
  const cn = k => { const c = CRITS.find(x => x.k === k); return c ? (c[lg] || c.de) : k; };
  const ct = c => (c.t && (c.t[lg] || c.t.de)) || "";
  const ca = c => (c.a && (c.a[lg] || c.a.de)) || "";
  const o = [];
  o.push(X.hi + " " + first + ",", "");
  o.push(X.thanks + (outlet ? " (" + outlet + (a ? ", " + X.period.replace("{a}", a).replace("{b}", b) : "") + ")" : (a ? " " + X.period.replace("{a}", a).replace("{b}", b) : "")) + ". " + X.intro, "");
  if(D.pos.length){
    o.push(X.good);
    D.pos.slice(0, 3).forEach(x => o.push("– " + ct(x.c) + (x.n > 1 ? " (" + X.often + ")" : "")));
  } else {
    const best = CRITS.filter(c => D.crit[c.k] != null && D.crit[c.k] >= 5).sort((a, b) => D.crit[b.k] - D.crit[a.k]).map(c => cn(c.k)).slice(0, 3);
    if(best.length) o.push(X.goodNone.replace("{c}", best.join(", ")));
  }
  o.push("");
  if(D.neg.length){
    o.push(X.improve);
    D.neg.slice(0, 3).forEach(x => {
      o.push("– " + cn(x.c.c) + ": " + ct(x.c) + (x.n > 1 ? " (" + X.often + ")" : "") + ".");
      if(ca(x.c)) o.push("  " + X.tip + ": " + ca(x.c));
    });
  } else o.push(X.improveNone);
  o.push("");
  if(D.late) o.push(X.late.replace("{n}", D.late));
  if(D.unex) o.push(X.unex.replace("{n}", D.unex));
  if(D.late || D.unex) o.push("");
  /* Entscheid 06.10.2026: nur die Praxisnote (Einsatztage ohne Exam) darf mitgeteilt werden, auf 0.1 gerundet.
     Exam-Note und Schlussnote werden nie in die Mail geschrieben. */
  const p = n2Praxis(s.id).avg;
  if(withGrades && p != null){ o.push(X.grades.replace("{p}", n2Fmt1(p)) + ".", ""); }
  const g = p == null ? 5 : p;
  o.push(g >= 5.25 ? X.c1 : g >= 4.75 ? X.c2 : g >= 4 ? X.c3 : X.c4);
  o.push(X.wish, "", X.bye, n2Teacher(lg));
  const subj = X.subj + (outlet ? " – " + outlet : "") + (a ? " " + a + "–" + b : "");
  return {subj, body: o.join("\n").replace(/\n{3,}/g, "\n\n")};
}

/* Zusammenfassung an die Kursleitung (nach dem Exam bzw. nach dem letzten Tag) */
const N2_VAR_LABEL = {"10T":"9 Tage + Exam", "4T":"4 Tage + Exam", "5T":"5 Tage"};
function n2SumName(s){
  const n = [s.nachname || s.last || "", s.vorname || s.first || ""].filter(Boolean).join(", ") || s.name || "";
  return n + (s.nick ? " «" + s.nick + "»" : "");
}
function n2SummaryText(){
  const V = MVARIANT, pr = slots().filter(x => !x.exam), hasEx = slots().some(x => x.exam);
  const avgLbl = "Ø " + pr.length + " Tage";
  const st = S.settings || {};
  const dts = slots().map(x => x.date).filter(Boolean);
  const fd = d => d ? String(d).slice(8,10) + "." + String(d).slice(5,7) + "." + String(d).slice(0,4) : "";
  const area = (typeof APP_AREA !== "undefined") ? APP_AREA : "";
  const head = ["Daily Grades · Zusammenfassung " + area,
    [st.outlet, N2_VAR_LABEL[V] || V].filter(Boolean).join(" · ") + (dts.length ? " · " + fd(dts[0]) + " bis " + fd(dts[dts.length - 1]) : ""),
    "Dozent/in: " + (st.teacher || "–"),
    [st.group ? "Klasse " + st.group : "", st.team || ""].filter(Boolean).join(" · "), ""];
  const lines = S.students.map(s => {
    const p = n2Praxis(s.id), e = hasEx ? n2Exam(s.id) : null;
    const cnt = {excused:0, unexcused:0, late:0, tm:0};
    slots().forEach(x => { const r = (S.days[x.id] || {})[s.id]; if(r && cnt[r.att] != null) cnt[r.att]++; });
    const ab = [cnt.excused ? "entsch. " + cnt.excused : "", cnt.unexcused ? "unentsch. " + cnt.unexcused : "",
                cnt.late ? "verspätet " + cnt.late : "", cnt.tm ? "TM/OC " + cnt.tm : ""].filter(Boolean).join(", ");
    const kl = [s.klasse || st.group || "", s.gruppe || st.team || ""].filter(Boolean).join(" · ");
    return n2SumName(s) + (kl ? " · " + kl : "") + "\n   " + avgLbl + ": " + n2Fmt(p.avg) + " (" + p.n + " gewertet)"
      + (hasEx ? " · Exam: " + n2Fmt(e) : "") + (ab ? " · " + ab : "");
  });
  const subj = "Daily Grades · Zusammenfassung · " + [area, st.outlet, V, dts.length ? fd(dts[0]) : ""].filter(Boolean).join(" · ");
  return {subj, body: head.concat(lines).join("\n") + "\n\n" + (hasEx ? avgLbl + " ohne Exam Day. Exam separat. " : "") + "Durchschnitte auf 0.01, ungerundet."};
}
function n2SendSummary(){
  const ex = slots().find(x => x.exam);
  const filled = id => !!(S.days[id] && Object.keys(S.days[id]).length);
  const last = ex || slots()[slots().length - 1];
  if(last && !filled(last.id)){ try{ if(!window.confirm(n2x("sumOpen"))) return; }catch(e){ return; } }
  const T = n2SummaryText();
  const base = "mailto:" + ABS_MAIL + "?subject=" + encodeURIComponent(T.subj);
  let href = base + "&body=" + encodeURIComponent(T.body);
  if(!n2Touch() && href.length > N2_MAILTO_MAX){
    try{ navigator.clipboard.writeText(T.body); }catch(e){}
    href = base + "&body=" + encodeURIComponent(n2x("sumCopy")); toast(n2x("sumCopy"));
  }
  S.settings.sumSent = new Date().toISOString().slice(0, 10); persist();
  location.href = href;
}
function n2SummaryCard(){
  const c = el("div",{class:"card pad sumcard"});
  const V = MVARIANT;
  c.appendChild(el("span",{class:"eyebrow",style:"display:block;margin-bottom:6px",text:n2x("sum")}));
  c.appendChild(el("p",{class:"muted",style:"margin:0 0 10px",text: V === "5T" ? n2x("sumHint5") : n2x("sumHint")}));
  c.appendChild(el("button",{class:"btn pri wide",text:"✉ " + n2x("sum") + (S.settings.sumSent ? " ✓" : ""),onclick:n2SendSummary}));
  if(S.settings.sumSent) c.appendChild(el("p",{class:"muted",style:"margin:8px 0 0;font-size:13px",text:n2x("sumSent") + " " + S.settings.sumSent.split("-").reverse().join(".")}));
  return c;
}

/* Daily Grades (08.10.2026): Schicht-Kürzel und Weg zurück zur Startseite, gemeinsam für alle Fassungen */

const SCHICHT_INFO = {
  S:"Service", SA:"Service Asia (Umami)", SM:"Service «The Market», MeP & Lunch", ST:"Service Tournant", Sv:"Supervisor (Host)",
  BS:"Bar & Service", CS1:"Chef de Service", CS2:"Assistant Chef de Service", CS2W:"Assistant Chef de Service, Wein",
  SW1:"Sommelier", SW2:"Wine Waiter / Assistent", OC:"Office & Daily MeP, Stewarding (zählt wie Team Market)",
  OST:"Office & Daily MeP in Service-Uniform", OTB:"Office, Daily MeP & Buffet Market", OS:"Office & Daily MeP in Service-Uniform",
  KC:"Chef de Cuisine", KS:"Sous-Chef", Sc:"Saucier", E:"Entremetier", G:"Garde-manger", T:"Tournant", TM:"Tournant «The Market»",
  K:"Casserolier", TK:"Tournant / Casserolier", K1:"Entremetier", K2:"Saucier", K3:"Garde-manger",
  A1:"Entremetier Asia", A2:"Saucier Asia", A3:"Garde-manger Asia", TA:"Tournant Asia", P:"Pâtisserie", C:"Küche Campigiana"
};
function planSchicht(s, slotId){
  const sl = slots().find(x => x.id === slotId);
  if(!s || !sl || !Array.isArray(s.schichtPlan)) return "";
  return String(s.schichtPlan[sl.idx - 1] || "").trim();
}
function schichtPill(s, slotId){
  const c = planSchicht(s, slotId); if(!c) return null;
  const info = SCHICHT_INFO[c] || SCHICHT_INFO[c.toUpperCase()] || "";
  return el("span",{class:"spill" + (c.toUpperCase() === "OC" ? " oc" : ""), title: "Schicht · Shift " + c + (info ? ": " + info : ""), text:c});
}

function n2Handoff(load){
  let h = null;
  try{ h = JSON.parse(localStorage.getItem("praxisrapport.handoff") || "null"); }catch(e){ h = null; }
  if(!h || !h.target || !h.paket || !h.paket.settings) return;
  let me = ""; try{ me = decodeURIComponent((location.pathname || "").split("/").pop() || ""); }catch(e){}
  if(String(h.target).split("/").pop() !== me) return;
  try{ localStorage.removeItem("praxisrapport.handoff"); }catch(e){}
  if(Date.now() - (h.at || 0) > 10 * 60 * 1000) return;          // nur frische Übergaben
  const id = String(h.id || "");
  if(h.mode === "switch"){                                          // Wechsel Tablet <-> Laptop: Stand 1:1 übernehmen
    const p = JSON.parse(JSON.stringify(h.paket));
    Promise.resolve(load(p)).then(() => { view = "day"; render(); toast(h.titel || "✓"); });
    return;
  }
  if(id && S.settings.paketId === id && S.students.length){        // dieses Paket ist schon da:
    if(n2Refresh(h.paket.students)) persist();                       // nur Fotos, Nicknames usw. nachführen
    n2GoToday(); view = "day"; render();                              // und den heutigen Einsatztag zeigen
    return;
  }
  const hatDaten = !S.settings.isSample && Object.keys(S.days || {}).some(k => S.days[k] && Object.keys(S.days[k]).length);
  if(hatDaten && S.settings.paketId !== id){
    const lg = (S.settings.uiLang || "de");
    const msg = {
      de: "Neues Paket laden: " + (h.titel || id) + "?\n\nDie bisher in dieser Datei erfassten Tage werden ersetzt. Bitte vorher «Tag senden» oder «Sichern», falls noch nicht geschehen.",
      en: "Load new package: " + (h.titel || id) + "?\n\nThe days recorded so far in this file will be replaced. Please use «Send the day» or «Back up» first if you have not done so.",
      th: "โหลดชุดข้อมูลใหม่: " + (h.titel || id) + "?\n\nวันที่บันทึกไว้ในไฟล์นี้จะถูกแทนที่ กรุณากด «ส่งข้อมูลของวันนี้» ก่อน หากยังไม่ได้ทำ"
    }[lg] || "";
    try{ if(!window.confirm(msg)) return; }catch(e){ return; }
  }
  const p = JSON.parse(JSON.stringify(h.paket));
  p.settings.paketId = id;
  Promise.resolve(load(p)).then(() => { n2GoToday(); view = "day"; render(); if(h.titel) toast("✓ " + h.titel); });
}
/* Heute ein Einsatztag des Pakets? Dann direkt diesen Tag zeigen. */
function n2GoToday(){
  const d = new Date(), td = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const s = slots().find(x => x.date === td); if(s) curSlot = s.id;
  return !!s;
}
/* Gleiches Paket, neuer Stand (z. B. Fotos nachgeliefert): Personendaten ergänzen, erfasste Tage bleiben. */
function n2Refresh(list){
  if(!Array.isArray(list)) return false;
  let ch = false;
  S.students.forEach(s => {
    const n = list.find(x => x && ((s.nr && x.nr && String(x.nr) === String(s.nr)) || (!s.nr && x.id === s.id)));
    if(!n) return;
    ["foto","nick","klasse","gruppe","mail","email","ortPlan","tmTage","schichtPlan"].forEach(k => {
      if(n[k] === undefined || JSON.stringify(n[k]) === JSON.stringify(s[k])) return;
      /* Nickname: ein leeres Feld im Paket löscht keinen Nickname, der auf dem Gerät eingetragen wurde */
      if(k === "nick" && !String(n[k] || "").trim()) return;
      s[k] = n[k]; ch = true;
    });
  });
  /* neu im Plan: Person ergänzen (niemand wird entfernt, damit keine Erfassung verloren geht) */
  list.forEach(n => {
    if(!n || typeof n.name !== "string") return;
    const da = S.students.some(s => (s.nr && n.nr && String(s.nr) === String(n.nr)) || (!n.nr && s.id === n.id));
    if(da) return;
    const x = JSON.parse(JSON.stringify(n));
    if(!x.id || S.students.some(s => s.id === x.id)){ let i = S.students.length + 1; while(S.students.some(s => s.id === "s" + i)) i++; x.id = "s" + i; }
    S.students.push(x); ch = true;
  });
  if(ch && typeof normalizeStudents === "function") normalizeStudents();
  else if(ch && typeof saubereStudierende === "function") S.students = saubereStudierende(S.students);
  return ch;
}
/* Ansicht wechseln: gleiche Variante als Tablet- bzw. Laptop-Fassung öffnen, mit dem aktuellen Stand */
function n2SwitchTarget(){
  let me = ""; try{ me = decodeURIComponent((location.pathname || "").split("/").pop() || ""); }catch(e){}
  if(/_Mobil/.test(me)) return me.replace("_Mobil", "");
  return me.replace(/^(Kuechenrapport|Servicerapport)/, "$1_Mobil");
}
function n2SwitchView(){
  const target = n2SwitchTarget(); if(!target) return;
  const toLaptop = !/_Mobil/.test(target);
  const lg = (S.settings.uiLang || "de");
  const msg = {de:toLaptop ? "Laptop-Ansicht" : "Tablet-Ansicht", en:toLaptop ? "Laptop view" : "Tablet view", th:toLaptop ? "มุมมองแล็ปท็อป" : "มุมมองแท็บเล็ต"}[lg] || "";
  try{
    localStorage.setItem("praxisrapport.handoff", JSON.stringify({target, id:S.settings.paketId || "", titel:"✓ " + msg, at:Date.now(), mode:"switch", paket:snapshot()}));
  }catch(e){ try{ toast("Speicher voll"); }catch(_){} return; }
  location.href = target;
}
