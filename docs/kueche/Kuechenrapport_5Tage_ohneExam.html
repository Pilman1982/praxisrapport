<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#001436">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Küchenrapport 5 Tage · ohne Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<style>
/* ===== EHL Hotelfachschule Passugg — Markenfarben aus der offiziellen Vorlage =====
   Navy #001436 (Primär) · Navy hell #1B365F · Petrol #005779 · Salbei #919388
   Terracotta #B6633F · Hellgrau #E3E3E1 · Cyan #5EC7F0
   Schriften laut Vorlage: Domaine Display Semibold (Titel), Hurme Geometric Sans 1 (Text).
   Beide sind lizenzpflichtig; sie stehen zuerst im Stack und werden benutzt, wenn sie
   auf dem Gerät installiert sind. Sonst Newsreader bzw. Jost als nächste Verwandte. */
:root{
  --navy:#001436; --navy2:#1B365F; --petrol:#005779; --sage:#919388;
  --terra:#B6633F; --pale:#E3E3E1; --cyan:#5EC7F0;
  --ink:#001436; --ink2:#3B4657; --ink3:#6C7684;
  --ground:#F2F2F0; --surf:#FFFFFF; --surf2:#F8F8F6; --surf3:#EDEDEA;
  --line:#DCDCD6; --line2:#C0C0B8;
  --acc:#001436; --accInk:#FFFFFF; --accSoft:#E2E6EE;
  --plus:#2E6B4E; --plusSoft:#E1EDE6; --plusLine:#A2C5B1;
  --minus:#A4402F; --minusSoft:#F6E4DF; --minusLine:#DCAD9D;
  --warn:#A2572F; --warnSoft:#F5E8DD; --warnLine:#DBB294;
  --logoFilter:none;
  --shadow:0 1px 2px rgba(0,20,54,.07), 0 8px 20px -12px rgba(0,20,54,.32);
  --r:8px;
  --f-disp:"Domaine Display Semibold","Domaine Display",Newsreader,"IBM Plex Sans Thai","Noto Sans SC","Microsoft YaHei",Georgia,serif;
  --f-body:"Hurme Geometric Sans 1",Jost,"IBM Plex Sans Thai","Noto Sans SC","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E7EBF1; --ink2:#A8B2C0; --ink3:#7C8798;
    --ground:#070D18; --surf:#0F1726; --surf2:#141D2E; --surf3:#1C2739;
    --line:#253043; --line2:#374558;
    --acc:#5EC7F0; --accInk:#001436; --accSoft:#122839;
    --plus:#6FBF92; --plusSoft:#12291E; --plusLine:#2C5741;
    --minus:#E28C79; --minusSoft:#33201B; --minusLine:#6A3E32;
    --warn:#D89A6E; --warnSoft:#2E2217; --warnLine:#5A432B;
    --logoFilter:brightness(0) invert(1);
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ink:#E7EBF1; --ink2:#A8B2C0; --ink3:#7C8798;
  --ground:#070D18; --surf:#0F1726; --surf2:#141D2E; --surf3:#1C2739;
  --line:#253043; --line2:#374558;
  --acc:#5EC7F0; --accInk:#001436; --accSoft:#122839;
  --plus:#6FBF92; --plusSoft:#12291E; --plusLine:#2C5741;
  --minus:#E28C79; --minusSoft:#33201B; --minusLine:#6A3E32;
  --warn:#D89A6E; --warnSoft:#2E2217; --warnLine:#5A432B;
  --logoFilter:brightness(0) invert(1);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-disp);font-weight:600;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

header.top{position:sticky;top:0;z-index:40;background:var(--surf);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0;flex-wrap:wrap}
.brand img{height:21px;width:auto;max-width:min(46vw,210px);filter:var(--logoFilter);flex:0 0 auto}
.brand .sep{width:1px;height:22px;background:var(--line2);flex:0 0 auto}
.brand .txt{min-width:0}
.brand b{font-family:var(--f-disp);font-weight:600;font-size:16px;letter-spacing:-.005em;display:block;line-height:1.15}
.brand .sub{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.vbadge{flex:0 0 auto;font-size:10.5px;font-weight:600;letter-spacing:.05em;color:var(--petrol);
  border:1px solid var(--petrol);border-radius:999px;padding:2px 9px;white-space:nowrap}
/* Schmale Fenster: Logo und Variantenpille duerfen die Seite nicht breiter machen. */
@media (max-width:560px){
  .top-in{padding:9px 12px;gap:8px 10px}
  .brand{gap:8px}
  .brand img{height:17px}
  .brand .sep{display:none}
  .vbadge{order:3;flex:0 0 auto;margin-top:2px}
  main{padding-left:12px;padding-right:12px}
}
.langs{display:flex;gap:6px;align-items:center}
.langs label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}
select.mini{background:var(--surf2);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12.5px}
nav.tabs{max-width:980px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:2.5px solid transparent;padding:9px 10px;font-size:13.5px;font-weight:500;color:var(--ink3);white-space:nowrap}
nav.tabs button[aria-current="true"]{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
main{max-width:980px;margin:0 auto;padding-block:18px 96px;padding-left:16px;padding-right:16px}
section[hidden]{display:none!important}

.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r)}
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink3);font-weight:600}
.muted{color:var(--ink3);font-size:13px}
.btn{background:var(--surf);border:1px solid var(--line2);border-radius:6px;padding:8px 13px;font-size:13.5px;font-weight:500;text-decoration:none;display:inline-block;color:var(--ink)}
.btn:hover{background:var(--surf2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accInk);font-weight:600}
.btn.pri:hover{filter:brightness(1.15)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.banner{background:var(--warnSoft);border:1px solid var(--warnLine);color:var(--ink);border-radius:var(--r);padding:10px 13px;font-size:13px;display:flex;gap:9px;align-items:flex-start;margin-bottom:16px}
.banner b{font-family:var(--f-disp)}

.slots{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:thin}
.slot{flex:0 0 auto;background:var(--surf);border:1px solid var(--line);border-radius:7px;padding:6px 11px;min-width:80px;text-align:left;line-height:1.25;color:var(--ink)}
.slot .sd{font-family:var(--f-disp);font-weight:600;font-size:13.5px;display:block;white-space:nowrap}
.slot .sw{font-size:10px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.slot[aria-current="true"]{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.slot[aria-current="true"] .sw{color:var(--accInk);opacity:.82}
.slot.filled{box-shadow:inset 3px 0 0 var(--acc)}
.slot[aria-current="true"].filled{box-shadow:none}
.slot.exam{border-color:var(--petrol);border-style:dashed}
.slot.exam .sd{color:var(--petrol)}
.slot.exam[aria-current="true"]{background:var(--petrol);border-color:var(--petrol);border-style:solid;color:#fff}
.slot.exam[aria-current="true"] .sd{color:#fff}
.slot.exam[aria-current="true"] .sw{color:#fff}

.examnote{background:var(--accSoft);border:1px solid var(--acc);border-radius:var(--r);padding:9px 13px;font-size:13px;margin-bottom:12px;display:flex;gap:9px;align-items:center}
.examnote b{font-family:var(--f-disp)}

.stud{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.stud.absent{background:var(--surf2)}
.stud-h{display:flex;align-items:center;gap:10px;padding:10px 12px}
.ava{border-radius:50%;object-fit:cover;flex:0 0 auto;background:#ddd;vertical-align:middle}
.stud-h .nm{font-family:var(--f-disp);font-weight:600;font-size:15.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grade{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;padding:3px 9px;border-radius:5px;background:var(--surf3);border:1px solid var(--line);min-width:52px;text-align:center}
.grade.g-hi{background:var(--plusSoft);border-color:var(--plusLine);color:var(--plus)}
.grade.g-lo{background:var(--minusSoft);border-color:var(--minusLine);color:var(--minus)}
.grade.g-na{color:var(--ink3);font-size:12.5px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.seg.five{grid-template-columns:repeat(5,1fr)}
@media(max-width:600px){.seg.five{grid-template-columns:repeat(3,1fr)}
  .seg.five button:nth-child(3){border-right:0}
  .seg.five button:nth-child(-n+3){border-bottom:1px solid var(--line)}
  .seg.five button:nth-child(5){grid-column:span 2;border-right:0}}
.seg button{background:var(--surf2);border:0;border-right:1px solid var(--line);padding:7px 4px;font-size:11.5px;font-weight:500;color:var(--ink3);line-height:1.25}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--accInk);font-weight:600}
.seg button.v-late[aria-pressed="true"]{background:var(--warn);color:#fff}
.seg button.v-exc[aria-pressed="true"]{background:var(--sage);color:#fff}
.seg button.v-unx[aria-pressed="true"]{background:var(--minus);color:#fff}
.seg button.v-tm[aria-pressed="true"]{background:var(--petrol);color:#fff}
.stud-b{padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.obs{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 5px 3px 10px;font-size:12.5px;line-height:1.35;max-width:100%;border:1px solid}
.obs.p{background:var(--plusSoft);border-color:var(--plusLine);color:var(--plus)}
.obs.m{background:var(--minusSoft);border-color:var(--minusLine);color:var(--minus)}
.obs.nt{background:var(--surf3);border-color:var(--line2);color:var(--ink2)}
.obs .x{background:none;border:0;color:inherit;opacity:.6;font-size:15px;line-height:1;padding:0 3px}
.obs .x:hover{opacity:1}
.obs .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46ch}
.addbtn{background:var(--accSoft);border:1px dashed var(--acc);color:var(--acc);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600}
.emptyhint{font-size:12.5px;color:var(--ink3);font-style:italic}

.scrim{position:fixed;inset:0;background:rgba(0,10,26,.55);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surf);border-top:1px solid var(--line2);border-radius:12px 12px 0 0;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
@media(min-width:720px){.sheet{left:50%;transform:translateX(-50%);width:min(700px,94vw);bottom:16px;border-radius:12px;border:1px solid var(--line2)}}
.sheet-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sheet-h h3{font-size:15.5px;font-weight:600;flex:1;min-width:0}
.crittabs{display:flex;gap:4px;overflow-x:auto;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--surf2)}
.crittabs button{background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;white-space:nowrap;color:var(--ink2)}
.crittabs button[aria-current="true"]{background:var(--acc);border-color:var(--acc);color:var(--accInk);font-weight:600}
.crittabs button.note[aria-current="true"]{background:var(--petrol);border-color:var(--petrol);color:#fff}
.sheet-b{overflow-y:auto;padding:12px 14px 18px;display:flex;flex-direction:column;gap:14px}
.grp .eyebrow{margin-bottom:7px;display:block}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:flex-start;gap:9px;text-align:left;width:100%;border-radius:6px;padding:8px 11px;font-size:13.5px;line-height:1.4;border:1px solid;background:var(--surf);color:var(--ink)}
.opt.p{border-color:var(--plusLine)}
.opt.p:hover{background:var(--plusSoft)}
.opt.m{border-color:var(--minusLine)}
.opt.m:hover{background:var(--minusSoft)}
.opt .sig{font-variant-numeric:tabular-nums;font-weight:600;flex-shrink:0;width:2.8em;font-size:12px;padding-top:1px}
.opt.p .sig{color:var(--plus)}
.opt.m .sig{color:var(--minus)}
.opt.on{box-shadow:inset 0 0 0 2px var(--acc)}
.opt.ko{border-color:var(--minus);background:var(--minusSoft)}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surf)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{background:var(--surf2);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:600}
thead th.sep,tbody td.sep{border-left:1px solid var(--line2)}
tbody tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;text-align:right}
td.nm{font-weight:500;font-family:var(--f-disp);font-size:13.5px}
.bar{display:inline-block;height:7px;border-radius:2px;background:var(--acc);vertical-align:middle}

.rep{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.rep-h{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.rep-h h3{font-size:17px;font-weight:600;flex:1;min-width:0}
.rep h3{font-size:17px;font-weight:600;margin-bottom:2px}
.rep .meta{font-size:12px;color:var(--ink3);margin-bottom:10px}
.rep pre{white-space:pre-wrap;font-family:var(--f-body);font-size:13.5px;line-height:1.6;margin:0;background:var(--surf2);border:1px solid var(--line);border-radius:6px;padding:12px 13px}
.rep .acts{margin-top:10px}

.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);font-weight:600}
.field input,.field select,.field textarea{background:var(--surf2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:14px;width:100%;font-family:inherit}
.field textarea{min-height:110px;line-height:1.6}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 14px}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0 14px;align-items:start}
.grid5 .field{margin-bottom:10px}
.grid5 .field label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.grid5 .field input,.grid5 .field select{height:38px}
@media(max-width:1000px){.grid5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){.grid5{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:460px){.grid5{grid-template-columns:1fr}}
.pad{padding:14px 16px}
details.exp{border:1px solid var(--line);border-radius:var(--r);background:var(--surf);margin-bottom:12px}
details.exp>summary{padding:11px 14px;font-weight:600;font-size:14.5px;font-family:var(--f-disp);cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center}
details.exp>summary::-webkit-details-marker{display:none}
details.exp>summary::after{content:"+";margin-left:auto;color:var(--ink3)}
details.exp[open]>summary::after{content:"–"}
details.exp>div{padding:0 14px 14px;border-top:1px solid var(--line);padding-top:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:70;background:var(--navy);color:#fff;padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow);max-width:90vw;text-align:center}
:root[data-theme="dark"] .toast,:root:not([data-theme="light"]) .toast{}
.scale{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12.5px}
.scale b{font-variant-numeric:tabular-nums}
.wdays{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0}
.wdays button{background:var(--surf2);border:1px solid var(--line);border-radius:6px;padding:6px 11px;font-size:13px;color:var(--ink)}
.wdays button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--accInk);font-weight:600}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;padding:7px 0;cursor:pointer}
.chk input{width:auto}

.seg.two{grid-template-columns:repeat(2,1fr)}
.alert{background:var(--minusSoft);border:1px solid var(--minus);color:var(--ink);border-radius:var(--r);
  padding:10px 13px;font-size:13px;margin-bottom:16px;display:flex;gap:9px;align-items:flex-start}
.alert b{font-family:var(--f-disp)}

/* ===== Druckansicht im EHL-Briefbild ===== */
#printArea{display:none}
@media print{
  body{background:#fff!important;color:#001436!important}
  body.printing > *:not(#printArea){display:none!important}
  #printArea{display:block!important;font-family:"Hurme Geometric Sans 1",Jost,"IBM Plex Sans Thai","Noto Sans SC","Microsoft YaHei",sans-serif;color:#001436;font-size:10pt;line-height:1.5}
  #printArea .pdoc{page-break-after:always;break-after:page}
  #printArea .pdoc:last-child{page-break-after:auto;break-after:auto}
  #printArea .plogo{height:11mm;width:auto;display:block;margin-bottom:7mm}
  #printArea h2{font-family:"Domaine Display Semibold",Newsreader,Georgia,serif;font-size:17pt;font-weight:600;margin:0 0 1mm;color:#001436}
  #printArea .phead{border-bottom:1.5pt solid #001436;padding-bottom:2.5mm;margin-bottom:4mm}
  #printArea .pmeta{font-size:8.5pt;color:#5A6270;letter-spacing:.02em}
  #printArea .pgrades{display:flex;gap:6mm;margin:0 0 4mm}
  #printArea .pgbox{border:0.75pt solid #C0C0B8;border-top:2.5pt solid #001436;padding:2.5mm 4mm;min-width:38mm}
  #printArea .pgbox .lb{font-size:7.5pt;text-transform:uppercase;letter-spacing:.09em;color:#5A6270}
  #printArea .pgbox .vl{font-size:16pt;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
  #printArea .pgbox .bd{font-size:8.5pt;color:#5A6270}
  #printArea h3{font-family:"Domaine Display Semibold",Newsreader,Georgia,serif;font-size:10.5pt;font-weight:600;margin:4.5mm 0 1.5mm;color:#001436;
    border-bottom:0.5pt solid #DCDCD6;padding-bottom:1mm}
  #printArea .li{margin:0 0 1.2mm 0;padding-left:4.5mm;text-indent:-4.5mm}
  #printArea .pclose{margin:5mm 0 0;padding:2.5mm 3.5mm;background:#F2F2F0;border-left:2pt solid #001436}
  #printArea .pnote{margin:3mm 0 0;font-size:8pt;color:#5A6270}
  #printArea table{width:100%;border-collapse:collapse;font-size:8.5pt;margin:2mm 0 0}
  #printArea th{background:#EDEDEA;border:0.5pt solid #C0C0B8;padding:1.2mm 2mm;text-align:left;font-weight:600;
    text-transform:uppercase;letter-spacing:.05em;font-size:7.5pt;color:#3B4657}
  #printArea td{border:0.5pt solid #C0C0B8;padding:1.2mm 2mm;font-variant-numeric:tabular-nums}
  #printArea .psign{margin-top:10mm;display:flex;gap:14mm;font-size:8.5pt;color:#5A6270}
  #printArea .psign div{flex:1;border-top:0.5pt solid #001436;padding-top:1.5mm}
  #printArea .pfoot{margin-top:6mm;font-size:7.5pt;color:#7A828E;border-top:0.5pt solid #DCDCD6;padding-top:1.5mm}

  /* ===== Erfassungsblaetter fuer die Kueche ===== */
  #printArea .sheet-doc{page-break-after:always;break-after:page;font-size:9pt;line-height:1.35}

{i:"hyg-n3",c:"hyg",d:-1,w:W.s,t:{de:"Degustiert mit Finger oder wiederverwendetem Löffel",en:"Tasted with fingers or a re-used spoon",th:"ชิมอาหารด้วยนิ้วมือหรือใช้ช้อนซ้ำ",zh:"用手指或重复使用的勺子试味"},a:{de:"Immer mit sauberem Löffel degustieren und diesen sofort auswechseln.",en:"Always taste with a clean spoon and swap it immediately after use.",th:"ชิมด้วยช้อนสะอาดเสมอ และเปลี่ยนช้อนทันทีหลังใช้",zh:"始终用干净的勺子试味，用后立即更换"}},
{i:"hyg-n4",c:"hyg",d:-1,w:W.m,t:{de:"Falsches Schneidebrett oder Brett nicht gewechselt",en:"Wrong cutting board, or board not changed",th:"ใช้เขียงผิดสีหรือไม่เปลี่ยนเขียง",zh:"使用了错误的砧板或未更换砧板"},a:{de:"Farbcode der Bretter einhalten und bei Produktwechsel Brett und Messer wechseln.",en:"Follow the board colour code; change board and knife when the product changes.",th:"ใช้เขียงตามรหัสสี และเปลี่ยนเขียงกับมีดทุกครั้งที่เปลี่ยนวัตถุดิบ",zh:"遵守砧板颜色规范，更换食材时同时更换砧板和刀具"}},
{i:"hyg-n5",c:"hyg",d:-1,w:W.m,t:{de:"Arbeitsplatz während des Services nicht sauber gehalten",en:"Workstation not kept clean during service",th:"ไม่รักษาความสะอาดจุดทำงานระหว่างบริการ",zh:"服务期间未保持工作台清洁"},a:{de:"Zwischenreinigung einplanen: nach jedem Arbeitsschritt abräumen und wischen.",en:"Plan clean-as-you-go: clear and wipe after every work step.",th:"ทำความสะอาดระหว่างงาน: เก็บและเช็ดทุกครั้งหลังจบขั้นตอน",zh:"边做边清理：每完成一道工序就收拾并擦拭"}},
{i:"hyg-n6",c:"hyg",d:-1,w:W.m,t:{de:"Reinigungs- oder Temperaturliste nicht geführt",en:"Cleaning or temperature log not maintained",th:"ไม่บันทึกรายการทำความสะอาดหรืออุณหภูมิ",zh:"未填写清洁记录或温度记录"},a:{de:"Listen direkt nach der Messung ausfüllen, Abweichungen sofort melden.",en:"Fill in the log right after measuring; report deviations immediately.",th:"บันทึกทันทีหลังวัด และแจ้งค่าที่ผิดปกติทันที",zh:"测量后立即填写记录，发现偏差马上上报"}},
{i:"hyg-n7",c:"hyg",d:-1,w:W.s,t:{de:"Kühlkette oder Lagertemperatur nicht eingehalten",en:"Cold chain or storage temperature not respected",th:"ไม่รักษาห่วงโซ่ความเย็นหรืออุณหภูมิจัดเก็บ",zh:"未遵守冷链或储存温度要求"},a:{de:"Ware direkt nach Gebrauch zurück in die Kühlung, Temperatur vor dem Verräumen prüfen.",en:"Return goods to refrigeration right after use; check temperature before storing.",th:"เก็บวัตถุดิบเข้าตู้เย็นทันทีหลังใช้ และตรวจอุณหภูมิก่อนจัดเก็บ",zh:"使用后立即将食材放回冷藏，入库前检查温度"}},
{i:"hyg-ko",c:"hyg",d:-1,w:0,ko:true,t:{de:"Grober Hygieneverstoss (Hygiene = 1.0)",en:"Serious hygiene breach (Hygiene = 1.0)",th:"ละเมิดสุขอนามัยร้ายแรง (สุขอนามัย = 1.0)",zh:"严重违反卫生规定（卫生记 1.00）"},a:{de:"Vorfall mit der Kursleitung besprechen und das Hygienekonzept repetieren.",en:"Discuss the incident with the course leader and revise the hygiene concept.",th:"หารือเหตุการณ์กับผู้สอน และทบทวนแผนสุขอนามัย",zh:"与课程负责人讨论该事件，并重温卫生方案"}},
{i:"hyg-p1",c:"hyg",d:1,w:W.l,t:{de:"Uniform und persönliche Hygiene vorbildlich",en:"Uniform and personal hygiene exemplary",th:"ชุดและสุขอนามัยส่วนบุคคลเป็นแบบอย่างที่ดี",zh:"制服与个人卫生堪称典范"}},
{i:"hyg-p2",c:"hyg",d:1,w:W.m,t:{de:"Arbeitsplatz durchgehend sauber und geordnet",en:"Workstation clean and orderly throughout",th:"จุดทำงานสะอาดและเป็นระเบียบตลอดเวลา",zh:"工作台始终整洁有序"}},
{i:"hyg-p3",c:"hyg",d:1,w:W.m,t:{de:"Hygienekonzept selbständig und korrekt angewendet",en:"Applied the hygiene concept correctly and unprompted",th:"ปฏิบัติตามแผนสุขอนามัยได้ถูกต้องด้วยตนเอง",zh:"能独立且正确地执行卫生方案"}},
{i:"hyg-p4",c:"hyg",d:1,w:W.m,t:{de:"Abweichung erkannt und selbständig gemeldet",en:"Spotted a deviation and reported it unprompted",th:"สังเกตเห็นความผิดปกติและรายงานด้วยตนเอง",zh:"主动发现并上报偏差"}},
{i:"hyg-n8",c:"hyg",d:-1,w:W.m,t:{de:"Haare nicht sauber unter dem Kochhut",en:"Hair not properly tucked under the chef's hat",th:"ผมไม่เก็บให้เรียบร้อยใต้หมวกเชฟ",zh:"头发未妥善收进厨师帽内"},a:{de:"Haare vollständig zusammenbinden und unter dem Kochhut verstauen, sonst Haarnetz tragen.",en:"Tie the hair up completely and tuck it under the chef's hat, otherwise wear a hairnet.",th:"รวบผมให้เรียบร้อยและเก็บไว้ใต้หมวกเชฟ มิฉะนั้นให้สวมตาข่ายคลุมผม",zh:"将头发完全扎起并收进厨师帽内，否则请佩戴发网。"}},
{i:"hyg-ko2",c:"hyg",d:-1,w:0,ko:true,t:{de:"Wiederholter vermeidbarer Hygieneverstoss bei der Uniform (Hygiene = 1.0)",en:"Repeated avoidable hygiene breach with the uniform (Hygiene = 1.0)",th:"ละเมิดสุขอนามัยเรื่องชุดยูนิฟอร์มซ้ำโดยหลีกเลี่ยงได้ (สุขอนามัย = 1.0)",zh:"制服方面重复出现本可避免的卫生违规（卫生记 1.00）"},a:{de:"Uniform vor jedem Dienst selbst kontrollieren; bei Wiederholung Gespräch mit der Kursleitung.",en:"Check the uniform yourself before every shift; if it happens again, talk to the course lead.",th:"ตรวจชุดด้วยตนเองก่อนเข้างานทุกครั้ง หากเกิดซ้ำให้พูดคุยกับผู้รับผิดชอบหลักสูตร",zh:"每次上岗前自行检查制服；若再次发生，请与课程负责人面谈。"}},
/* PRODUKTIVITÄT */
{i:"pro-n1",c:"pro",d:-1,w:W.m,t:{de:"Zeitvorgabe nicht eingehalten",en:"Did not meet the time target",th:"ทำงานไม่ทันเวลาที่กำหนด",zh:"未在规定时间内完成"},a:{de:"Vor Arbeitsbeginn einen Zeitplan mit Zwischenzielen festlegen.",en:"Set a schedule with intermediate targets before starting.",th:"วางแผนเวลาและตั้งเป้าหมายย่อยก่อนเริ่มงาน",zh:"开工前制定时间计划并设置阶段目标"}},
{i:"pro-n2",c:"pro",d:-1,w:W.m,t:{de:"Arbeitstempo zu tief für die Aufgabe",en:"Working pace too slow for the task",th:"ทำงานช้าเกินไปสำหรับงานที่ได้รับ",zh:"工作节奏低于任务要求"},a:{de:"Arbeitsschritte vorbereiten, damit weniger Leerlauf entsteht.",en:"Prepare the work steps in advance to cut idle time.",th:"เตรียมขั้นตอนงานล่วงหน้าเพื่อลดเวลาว่างเปล่า",zh:"提前准备各道工序，减少空转时间"}},
{i:"pro-n3",c:"pro",d:-1,w:W.m,t:{de:"Wartet auf Anweisung, statt Arbeit zu suchen",en:"Waits for instructions instead of finding work",th:"รอคำสั่งแทนที่จะหางานทำ",zh:"等待指示而不主动找活干"},a:{de:"Bei Leerlauf aktiv nachfragen oder sichtbare Arbeit übernehmen.",en:"When idle, ask for work or take on a visible task.",th:"เมื่อว่าง ให้ถามหางานหรือรับงานที่เห็นอยู่ตรงหน้า",zh:"空闲时主动询问或承担看得见的工作"}},
{i:"pro-n4",c:"pro",d:-1,w:W.m,t:{de:"Nacharbeit nötig wegen ungenauer Ausführung",en:"Rework needed due to imprecise execution",th:"ต้องแก้งานใหม่เพราะทำไม่ละเอียด",zh:"因操作不细致需要返工"},a:{de:"Lieber einmal richtig: Vorgaben vor dem Start nochmals durchgehen.",en:"Right the first time: re-read the specifications before starting.",th:"ทำให้ถูกตั้งแต่ครั้งแรก: อ่านข้อกำหนดอีกครั้งก่อนเริ่ม",zh:"一次做对：开工前再次确认要求"}},
{i:"pro-p1",c:"pro",d:1,w:W.m,t:{de:"Arbeit selbständig gefunden und erledigt",en:"Found and completed work independently",th:"หางานและทำเสร็จได้ด้วยตนเอง",zh:"主动找到并完成工作"}},
{i:"pro-p2",c:"pro",d:1,w:W.m,t:{de:"Zeitvorgabe eingehalten bei guter Qualität",en:"Met the time target with good quality",th:"ทำงานทันเวลาและคุณภาพดี",zh:"在规定时间内完成且质量良好"}},
{i:"pro-p3",c:"pro",d:1,w:W.l,t:{de:"Konstant hohes Arbeitstempo",en:"Consistently high working pace",th:"รักษาความเร็วในการทำงานได้สม่ำเสมอ",zh:"工作节奏持续保持高水平"}},
{i:"pro-p4",c:"pro",d:1,w:W.l,t:{de:"Zusätzliche Aufgaben übernommen",en:"Took on additional tasks",th:"รับงานเพิ่มเติม",zh:"主动承担了额外任务"}},
/* ORGANISATION */
{i:"org-n1",c:"org",d:-1,w:W.m,t:{de:"Briefingvorlage unvollständig ausgefüllt",en:"Briefing template filled in incompletely",th:"กรอกแบบฟอร์มบรีฟไม่ครบ",zh:"每日简报表格填写不完整"},a:{de:"Briefing vor Produktionsbeginn vollständig ausfüllen und kontrollieren lassen.",en:"Complete the briefing before production starts and have it checked.",th:"กรอกบรีฟให้ครบก่อนเริ่มผลิต และให้ผู้สอนตรวจ",zh:"生产开始前完整填写简报，并交由负责人检查"}},
{i:"org-n2",c:"org",d:-1,w:W.m,t:{de:"Mise en Place unvollständig oder zu spät bereit",en:"Mise en place incomplete or ready too late",th:"มีสอองพลาสไม่ครบหรือเสร็จช้า",zh:"备料不齐或准备过迟"},a:{de:"Mise-en-Place-Liste schreiben und vor Servicebeginn abhaken.",en:"Write a mise en place list and tick it off before service starts.",th:"เขียนรายการมีสอองพลาสและเช็กให้ครบก่อนเปิดบริการ",zh:"列出备料清单，在服务开始前逐项核对"}},
{i:"org-n3",c:"org",d:-1,w:W.m,t:{de:"Arbeitsplatz nicht nach Vorgabe eingerichtet",en:"Workstation not set up to standard",th:"จัดจุดทำงานไม่ตรงตามมาตรฐาน",zh:"工作台未按标准布置"},a:{de:"Nach Standard einrichten: Werkzeug, Abfall, Abstellfläche, Reinigungstuch.",en:"Set up to standard: tools, waste bin, landing space, cleaning cloth.",th:"จัดตามมาตรฐาน: อุปกรณ์ ถังขยะ พื้นที่วาง ผ้าเช็ด",zh:"按标准布置：工具、垃圾桶、放置区、清洁布"}},
{i:"org-n4",c:"org",d:-1,w:W.m,t:{de:"Vermeidbarer Foodwaste",en:"Avoidable food waste",th:"เกิดขยะอาหารที่หลีกเลี่ยงได้",zh:"出现可避免的食物浪费"},a:{de:"Rüstverluste prüfen, Zuschnitte weiterverwenden und Mengen genauer kalkulieren.",en:"Check trimming losses, re-use offcuts and calculate quantities more precisely.",th:"ตรวจเศษจากการตัดแต่ง นำส่วนที่ใช้ได้ไปใช้ต่อ และคำนวณปริมาณให้แม่นขึ้น",zh:"检查修整损耗，利用边角料，更精确地计算用量"}},
{i:"org-n5",c:"org",d:-1,w:W.l,t:{de:"Leftovers nicht korrekt verräumt oder angeschrieben",en:"Leftovers not stored or labelled correctly",th:"เก็บหรือติดฉลากของเหลือไม่ถูกต้อง",zh:"剩余食材未正确存放或未贴标签"},a:{de:"Alles mit Inhalt und Datum anschreiben, dann kühlen.",en:"Label everything with content and date, then refrigerate.",th:"ติดฉลากระบุชนิดและวันที่ทุกครั้ง แล้วจึงแช่เย็น",zh:"全部贴上内容和日期标签后再冷藏"}},
{i:"org-p1",c:"org",d:1,w:W.m,t:{de:"Arbeitsplatz vorbildlich eingerichtet",en:"Workstation set up exemplarily",th:"จัดจุดทำงานได้เป็นแบบอย่างที่ดี",zh:"工作台布置堪称典范"}},
{i:"org-p2",c:"org",d:1,w:W.m,t:{de:"Briefing vollständig umgesetzt und mitgedacht",en:"Implemented the briefing fully and thought ahead",th:"ปฏิบัติตามบรีฟครบถ้วนและคิดล่วงหน้า",zh:"完整落实简报内容并有前瞻思考"}},
{i:"org-p3",c:"org",d:1,w:W.m,t:{de:"Foodwaste aktiv vermieden",en:"Actively avoided food waste",th:"ลดขยะอาหารอย่างตั้งใจ",zh:"主动避免食物浪费"}},
{i:"org-p4",c:"org",d:1,w:W.l,t:{de:"Reinigung und Recycling selbständig organisiert",en:"Organised cleaning and recycling independently",th:"จัดการทำความสะอาดและแยกขยะได้ด้วยตนเอง",zh:"独立组织清洁与垃圾分类"}},
/* TEAMFÄHIGKEIT */
{i:"tea-n1",c:"tea",d:-1,w:W.m,t:{de:"Verspätet zum Dienst erschienen",en:"Arrived late for the shift",th:"มาทำงานสาย",zh:"上岗迟到"},a:{de:"15 Minuten früher planen; eine Verspätung vorher melden.",en:"Plan to arrive 15 minutes early; announce a delay in advance.",th:"วางแผนมาถึงก่อน 15 นาที และแจ้งล่วงหน้าหากจะสาย",zh:"提前 15 分钟安排行程；如会迟到请事先通知"}},
{i:"tea-n2",c:"tea",d:-1,w:W.m,t:{de:"Unterstützt das Team bei Engpässen nicht",en:"Does not support the team at bottlenecks",th:"ไม่ช่วยทีมเมื่อทีมติดขัด",zh:"团队忙不过来时不提供帮助"},a:{de:"Bei eigener freier Kapazität aktiv Hilfe anbieten.",en:"Offer help actively whenever your own station is under control.",th:"เมื่องานของตนเสร็จ ให้เสนอตัวช่วยเพื่อนร่วมทีม",zh:"自己岗位完成后主动提出帮忙"}},
{i:"tea-n3",c:"tea",d:-1,w:W.s,t:{de:"Umgangston gegenüber Team oder Vorgesetzten unangemessen",en:"Tone towards team or superiors inappropriate",th:"ใช้คำพูดกับทีมหรือหัวหน้าไม่เหมาะสม",zh:"对同事或上级的言语态度不当"},a:{de:"Kritik sachlich und unter vier Augen ansprechen.",en:"Raise criticism factually and one to one.",th:"แสดงความเห็นเชิงวิจารณ์อย่างสุภาพและคุยตัวต่อตัว",zh:"就事论事地提出批评，并单独沟通"}},
{i:"tea-n4",c:"tea",d:-1,w:W.l,t:{de:"Wenig flexibel bei kurzfristigen Änderungen",en:"Little flexibility with short-notice changes",th:"ปรับตัวกับการเปลี่ยนแปลงกะทันหันได้น้อย",zh:"面对临时调整时灵活性不足"},a:{de:"Änderungen zuerst annehmen, Rückfragen danach stellen.",en:"Accept the change first, ask your questions afterwards.",th:"รับการเปลี่ยนแปลงก่อน แล้วค่อยถามคำถามภายหลัง",zh:"先接受调整，之后再提出疑问"}},
{i:"tea-p1",c:"tea",d:1,w:W.m,t:{de:"Team aktiv unterstützt",en:"Actively supported the team",th:"ช่วยเหลือทีมอย่างแข็งขัน",zh:"积极支援团队"}},
{i:"tea-p2",c:"tea",d:1,w:W.m,t:{de:"Ruhig und konstruktiv unter Druck",en:"Calm and constructive under pressure",th:"ใจเย็นและสร้างสรรค์ภายใต้ความกดดัน",zh:"压力之下依然冷静且有建设性"}},
{i:"tea-p3",c:"tea",d:1,w:W.l,t:{de:"Flexibel auf Änderungen reagiert",en:"Reacted flexibly to changes",th:"ปรับตัวกับการเปลี่ยนแปลงได้ดี",zh:"灵活应对变化"}},
{i:"tea-p4",c:"tea",d:1,w:W.m,t:{de:"Verantwortung für das Team übernommen",en:"Took responsibility for the team",th:"รับผิดชอบดูแลทีม",zh:"主动为团队承担责任"}},
/* SELBSTÄNDIGKEIT */
{i:"sel-n1",c:"sel",d:-1,w:W.m,t:{de:"Fragt bei Unklarheit nicht nach",en:"Does not ask when something is unclear",th:"ไม่ถามเมื่อไม่เข้าใจ",zh:"有疑问时不主动询问"},a:{de:"Lieber einmal zu viel fragen als etwas falsch produzieren.",en:"Better to ask once too often than to produce the wrong thing.",th:"ถามเกินไว้ดีกว่าทำผิด",zh:"宁可多问一次，也不要做错"}},
{i:"sel-n2",c:"sel",d:-1,w:W.m,t:{de:"Braucht durchgehend Anleitung",en:"Needs continuous guidance",th:"ต้องมีคนคอยบอกตลอดเวลา",zh:"全程需要他人指导"},a:{de:"Arbeitsschritte notieren und beim nächsten Mal selbständig starten.",en:"Note the work steps and start on your own next time.",th:"จดขั้นตอนงานไว้ และเริ่มเองในครั้งถัดไป",zh:"记下工作步骤，下次独立开始"}},
{i:"sel-n3",c:"sel",d:-1,w:W.m,t:{de:"Absprache im Team fehlt",en:"Fails to coordinate with the team",th:"ไม่ประสานงานกับทีม",zh:"缺少与团队的沟通协调"},a:{de:"Vor dem Start kurz abgleichen, wer was übernimmt.",en:"Agree briefly who does what before starting.",th:"ตกลงกันสั้น ๆ ก่อนเริ่มว่าใครทำอะไร",zh:"开工前简短商定谁负责什么"}},
{i:"sel-n4",c:"sel",d:-1,w:W.l,t:{de:"Erkennt anstehende Arbeiten nicht",en:"Does not recognise upcoming work",th:"มองไม่ออกว่างานถัดไปคืออะไร",zh:"看不出接下来要做的工作"},a:{de:"Am Ende jeder Aufgabe bewusst umschauen, was als Nächstes ansteht.",en:"At the end of each task, look around for what comes next.",th:"เมื่อจบแต่ละงาน ให้มองรอบ ๆ ว่ามีงานอะไรต่อ",zh:"每完成一项任务，有意识地环顾下一步该做什么"}},
{i:"sel-p1",c:"sel",d:1,w:W.l,t:{de:"Stellt gezielte, weiterführende Fragen",en:"Asks precise, forward-looking questions",th:"ตั้งคำถามตรงประเด็นและต่อยอดได้",zh:"能提出有针对性且有深度的问题"}},
{i:"sel-p2",c:"sel",d:1,w:W.m,t:{de:"Arbeitet eigenverantwortlich ohne Nachfragen",en:"Works responsibly without needing prompts",th:"ทำงานรับผิดชอบได้เองโดยไม่ต้องเตือน",zh:"无需催促即可自主负责地工作"}},
{i:"sel-p3",c:"sel",d:1,w:W.m,t:{de:"Probleme früh erkannt und gehandelt",en:"Spotted problems early and acted",th:"เห็นปัญหาแต่เนิ่น ๆ และลงมือแก้",zh:"及早发现问题并采取行动"}},

function erkenneKlasse(v){

  return m ? ("HF" + m[1] + m[2]).toUpperCase() : "";

function erkenneGruppe(v){
  const s = String(v || "").trim();

  const e = s.match(/^(?:gruppe|grp|gr|group)\s*(\d+)\s*(?:team\s*)?([a-z])$/i);

  const m = s.match(/^(gruppe|grp|group|team)\s*(\d+)$/i);
  return m ? ((/^t/i.test(m[1]) ? "Team " : "Gruppe ") + m[2]) : "";
}

   Nachname; Vorname; Nickname; E-Mail; Sprache; Klasse; Gruppe
   E-Mail, Sprache, Klasse und Gruppe werden am Inhalt erkannt, darum sind
   aeltere Zeilen wie "Ammann Lea; lea@x.ch; de" weiterhin lesbar.        */
function parseStudentLine(line){
  const parts = line.split(/[;\t]/).map(x=>x.trim());
  let mail="", lang="", klasse="", gruppe="";
  const rest = [];
  parts.forEach(v=>{
    if(!mail && v.indexOf("@") >= 0){ mail = v; return; }
    if(!lang && /^(de|en|zh)$/i.test(v)){ lang = v.toLowerCase(); return; }
    if(!klasse && erkenneKlasse(v)){ klasse = erkenneKlasse(v); return; }
    if(!gruppe && erkenneGruppe(v)){ gruppe = erkenneGruppe(v); return; }
    rest.push(v);
  });
  let last = rest[0] || "", first = rest[1] || "", nick = rest[2] || "";
  if(last && !first && /\s/.test(last)){            // "Ammann Lea" in einem Feld
    const q = last.split(/\s+/); last = q.shift(); first = q.join(" ");
  }
  return {last, first, nick, mail, lang, klasse, gruppe};
}

}

  const n = parseInt(String(slid).slice(1), 10);
  if(!n) return null;
  const pad = x => "d" + String(x).padStart(2,"0");
  if(srcVariant === "5T"){
    if(n < 1 || n > 5) return null;
    return pad(n + (halfMode === "second" ? 4 : 0));        // erste Hälfte 1-5, zweite 5-9
  }
  if(srcVariant === "4T"){
    if(n === 5) return "d10";                               // Exam Day gehört immer ans Ende
    if(n < 1 || n > 4) return null;
    return pad(n + (halfMode === "first" ? 0 : 5));         // zweite Hälfte 6-9, erste 1-4
  }
  return null;
}
const acceptsVariant = v => !v || v === VARIANT || (VARIANT === "10T" && (v === "4T" || v === "5T"));

/* ---- Notenlogik ---- */
function critGradesForDay(id, sid){
  const r = (S.days[id]||{})[sid];
  if(!r) return null;
  const sl = slots().find(x=>x.id===id);
  const isExam = !!(sl && sl.exam);
  const att = ATT_OK.includes(r.att) ? r.att : "present";   // unbekannter Wert zaehlt als anwesend
  /* Team Market: kein Küchendienst, der Tag zählt fest mit 5.00. */
  if(att === "tm"){ const g0 = {}; CRITS.forEach(c=>g0[c.k]=5); return g0; }
  /* Exam Day: jede Abwesenheit ergibt 1.00, unabhängig vom Grund. */
  if(att === "excused" && !isExam) return null;
  const g = {};
  if(att === "unexcused" || (isExam && att === "excused")){ CRITS.forEach(c=>g[c.k]=1); return g; }
  const obs = obsOf(r).map(i=>CHIP[i]).filter(Boolean);
  if(att === "late" && !obs.some(o=>o.i==="tea-n1")) obs.push(CHIP["tea-n1"]);
  const nt = r.note;
  CRITS.forEach(c=>{
    const mine = obs.filter(o=>o.c===c.k);
    if(mine.some(o=>o.ko)){ g[c.k] = 1; return; }
    let d = 0;
    mine.forEach(o=>{ d += o.d * o.w; });
    if(nt && nt.crit === c.k && nt.dir && nt.w) d += nt.dir * nt.w;
    d = Math.max(CAP_NEG, Math.min(CAP_POS, d));
    g[c.k] = Math.max(1, Math.min(6, baseNum() + d));
  });
  return g;
}
/* Bewertungszeitraum: der Exam Day zählt nie mit, er wird separat ausgewiesen. */
function slotsInRange(mode){
  const all = gradedSlots();
  if(mode === "all") return all;
  const cur = slotById(curSlot);
  const w = cur.exam ? (all.length ? all[all.length-1].week : 1) : cur.week;
  return all.filter(s=>s.week === w);
}
function dayTotal(id, sid){
  const g = critGradesForDay(id, sid); if(!g) return null;
  let sum = 0, w = 0;
  CRITS.forEach(c=>{ const ww = (c.k==="hyg" && S.settings.hyg2) ? 2 : 1; sum += g[c.k]*ww; w += ww; });
  return sum/w;
}
function summary(sid, mode){
  const rng = slotsInRange(mode);
  const per = {}; CRITS.forEach(c=>per[c.k]=[]);
  let counted = 0, exc = 0, unx = 0, late = 0, tm = 0;
  const tally = {}, notes = [];
  rng.forEach(sl=>{
    const r = (S.days[sl.id]||{})[sid]; if(!r) return;
    if(r.note && r.note.txt) notes.push({slot:sl, ...r.note});
    if(r.att === "excused"){ exc++; return; }
    if(r.att === "unexcused") unx++;
    if(r.att === "late") late++;
    if(r.att === "tm") tm++;
    obsOf(r).forEach(i=>{ tally[i] = (tally[i]||0)+1; });
    const g = critGradesForDay(sl.id, sid); if(!g) return;
    counted++; CRITS.forEach(c=>per[c.k].push(g[c.k]));
  });
  if(!counted) return {counted:0, exc, unx, late, tm, tally, notes, crit:null, total:null};
  const crit = {};
  CRITS.forEach(c=>{ crit[c.k] = per[c.k].reduce((a,b)=>a+b,0)/per[c.k].length; });
  let sum = 0, wsum = 0;
  CRITS.forEach(c=>{ const w = (c.k==="hyg" && S.settings.hyg2) ? 2 : 1; sum += crit[c.k]*w; wsum += w; });
  return {counted, exc, unx, late, tm, tally, notes, crit, total: sum/wsum};
}
/* Exam Day separat */
function examSummary(sid){
  const sl = examSlot(); if(!sl) return null;
  const r = (S.days[sl.id]||{})[sid]; if(!r) return null;
  const g = critGradesForDay(sl.id, sid);
  return {slot:sl, att:r.att, crit:g, total: g ? dayTotal(sl.id, sid) : null,
          obs:obsOf(r).map(i=>CHIP[i]).filter(Boolean), note:r.note||null};
}
/* Schlussnote: zwei Drittel Praxis, ein Drittel Exam Day. */
function finalGrade(praxis, exam){
  if(praxis == null) return exam;
  if(exam == null) return praxis;
  return (2*praxis + exam) / 3;
}
function recordedPeriod(sid, mode, lg){
  const rec = slotsInRange(mode).filter(sl=>(S.days[sl.id]||{})[sid]);
  if(!rec.length) return "–";
  return rec.length===1 ? slotLabel(rec[0], lg)
    : slotLabel(rec[0], lg) + " – " + slotLabel(rec[rec.length-1], lg);
}

const fmt1 = g => (g==null ? "–" : (Math.round(g*10)/10).toFixed(1));

/* ---- DOM-Helfer ---- */
const el = (tag, attrs={}, kids=[]) => {
  const n = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(v===false||v==null) continue;
    if(k==="class") n.className = v;
    else if(k==="text") n.textContent = v;
    else if(k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v===true ? "" : v);
  }
  (Array.isArray(kids)?kids:[kids]).forEach(c=>c && n.appendChild(c));
  return n;
};

let dl = null;
function claudeUse(n){
  try{ return (window.claude && window.claude.use) ? window.claude.use(n).catch(()=>null) : Promise.resolve(null); }
  catch(e){ return Promise.resolve(null); }
}

async function copy(txt){
  try{ await navigator.clipboard.writeText(txt); toast(t("copied")); return true; }
  catch(e){
    const ta = el("textarea",{style:"position:fixed;opacity:0;top:0"}); ta.value = txt;
    document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok = document.execCommand("copy"); }catch(_){}
    ta.remove(); if(ok) toast(t("copied")); return ok;
  }
}
async function saveFile(filename, data, mime){
  if(dl){
    try{ await dl.save({filename, data}); return true; }
    catch(e){ if(e && e.code === "declined") return false; }
  }
  const blob = (data instanceof Blob) ? data
             : new Blob([data], {type: mime || "text/plain;charset=utf-8"});
  /* Speichern unter: der Dozent waehlt Ordner und Namen selbst.
     Chrome und Edge koennen das; sonst faellt es auf den Download zurueck. */
  if(window.showSaveFilePicker){
    try{
      const ext = "." + (filename.split(".").pop() || "txt");
      const h = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{description: ext.slice(1).toUpperCase(),
                 accept: {[mime || "application/octet-stream"]: [ext]}}]
      });
      const w = await h.createWritable();
      await w.write(blob); await w.close();
      toast(t("savedAs") + ": " + (h.name || filename));
      return true;
    }catch(e){
      if(e && e.name === "AbortError") return false;   // Dialog abgebrochen
      /* SecurityError und Co.: weiter mit dem normalen Download */
    }
  }
  try{
    const url = URL.createObjectURL(blob);
    const a = el("a",{href:url, download:filename, style:"display:none"});
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    return true;
  }catch(e){}
  if(typeof data === "string") copy(data);
  return false;
}

    window.removeEventListener("afterprint", done); };
  window.addEventListener("afterprint", done);
  setTimeout(()=>{ try{ window.print(); }catch(e){} setTimeout(done, 1500); }, 80);
}

/* ---------- Absenz- und Verspaetungsmeldung ---------- */
function absenceList(slotId){
  const d = S.days[slotId] || {};
  const out = [];
  S.students.forEach(st=>{
    const r = d[st.id]; if(!r) return;
    const a = ATT_OK.includes(r.att) ? r.att : "present";
    if(a === "late" || a === "excused" || a === "unexcused")
      out.push({st, name:dispName(st), kind:t(a)});
  });
  return out;
}
/* Eine Meldezeile: Nachname, Vorname «Nickname» · Klasse · Gruppe — Grund */
function absenceLine(x){
  const kg = [klasseOf(x.st), gruppeOf(x.st)].filter(Boolean).join(" \u00b7 ");
  return "- " + longName(x.st) + (kg ? "   \u00b7   " + kg : "") + "   \u2014   " + x.kind;
}
function absenceMailHref(slotId){
  const sl = slotById(slotId);
  const list = absenceList(slotId);
  const head = [S.settings.group, S.settings.outlet, S.settings.teacher].filter(Boolean).join(" · ");
  const subj = t("absMailSubj") + " – " + [S.settings.group, S.settings.outlet, slotLabel(sl)].filter(Boolean).join(" · ");
  const body = [head, slotLabel(sl) + " · " + VARIANT, ""]
    .concat(list.length ? list.map(absenceLine) : [t("absMailNone")])
    .concat(["", t("absMailCols"), "", "JSON: " + fileStem() + ".json"])
    .join("\n");
  return "mailto:" + ABS_MAIL + "?subject=" + encodeURIComponent(subj) + "&body=" + encodeURIComponent(body);
}
/* Notenuebersicht als Klartext an die Kursleitung.
   Bewusst kompakt: mailto-Links sind in Outlook auf rund 2000 Zeichen begrenzt. */
function overviewMailHref(){
  const rows = S.students.map(s=>({s, sum:summary(s.id, repMode)}));
  const withExam = !!examSlot();
  const sl = slots();
  const period = sl.length ? (slotLabel(sl[0]) + " – " + slotLabel(sl[sl.length-1])) : "";
  const head = [S.settings.group, S.settings.team, S.settings.outlet, S.settings.teacher]
    .filter(Boolean).join(" · ");
  const subj = t("ovMailSubj") + " – "
    + [S.settings.group, S.settings.outlet, VARIANT].filter(Boolean).join(" · ");
  const w = Math.min(26, Math.max(12, ...rows.map(r=>r.s.name.length)));
  const C1 = 8;                                  // Breite der Zahlenspalten
  const line = [];
  line.push(head);
  line.push(period + "  ·  " + VARIANT + "  ·  " + new Date().toLocaleDateString("de-CH"));
  line.push("");
  let hdr = t("ovCName").padEnd(w) + t("ovCDays").padStart(6)
    + (withExam ? t("ovCPraxis").padStart(C1) : t("ovCTotal").padStart(C1));
  if(withExam) hdr += t("ovCExam").padStart(C1) + t("ovCFinal").padStart(C1);
  line.push(hdr);
  line.push("-".repeat(hdr.length));
  rows.forEach(({s,sum})=>{
    const ex = withExam ? examSummary(s.id) : null;
    const fin = withExam ? finalGrade(sum.total, ex?ex.total:null) : null;
    let r = s.name.slice(0,w).padEnd(w) + String(sum.counted).padStart(6)
          + fmt(sum.total).padStart(C1);
    if(withExam) r += (ex ? fmt(ex.total) : "–").padStart(C1) + fmt(fin).padStart(C1);
    const a = [];
    if(sum.exc)  a.push(sum.exc + "e");
    if(sum.unx)  a.push(sum.unx + "u");
    if(sum.late) a.push(sum.late + "v");
    if(sum.tm)   a.push(sum.tm + "tm");
    if(a.length) r += "   (" + a.join(" ") + ")";
    line.push(r);
  });
  line.push("");
  line.push(t("excused") + " = e · " + t("unexcused") + " = u · "
    + t("late") + " = v · " + t("teamMarket") + " = tm");
  line.push(t("ovMailFoot"));
  line.push(fileStem() + ".xlsx");
  const body = line.join("\n");
  return "mailto:" + ABS_MAIL + "?subject=" + encodeURIComponent(subj)
       + "&body=" + encodeURIComponent(body);
}
function openOverviewMail(){
  if(!S.students.some(s=>summary(s.id, repMode).counted)){ toast(t("ovMailNone")); return; }
  location.href = overviewMailHref();

let sheetCrit = "hyg";
function openSheet(student){
  const host = document.getElementById("sheetHost"); host.innerHTML = "";
  const close = ()=>{ host.innerHTML=""; document.body.style.overflow="";
                      document.removeEventListener("keydown", onKey); renderDay(); };
  document.body.style.overflow = "hidden";   // Seite hinter dem Sheet nicht mitscrollen
  const onKey = e => { if(e.key==="Escape") close(); };
  document.addEventListener("keydown", onKey);
  host.appendChild(el("div",{class:"scrim",onclick:close}));
  const sheet = el("div",{class:"sheet",role:"dialog","aria-modal":"true"});
  sheet.appendChild(el("div",{class:"sheet-h"},[
    el("h3",{text:student.name + " · " + slotLabel(slotById(curSlot))}),
    el("button",{class:"btn sm pri",text:t("done"),onclick:close})
  ]));
  const tabs = el("div",{class:"crittabs"});
  CRITS.forEach(c=>tabs.appendChild(el("button",{text:critName(c.k, S.settings.uiLang),
    "aria-current":String(sheetCrit===c.k), onclick:()=>{ sheetCrit=c.k; draw(); }})));
  tabs.appendChild(el("button",{class:"note",text:"✎ "+t("noteTab"),
    "aria-current":String(sheetCrit==="__note"), onclick:()=>{ sheetCrit="__note"; draw(); }}));
  sheet.appendChild(tabs);
  const body = el("div",{class:"sheet-b"}); sheet.appendChild(body);
  host.appendChild(sheet);

  function draw(){
    [...tabs.children].forEach((b,ix)=>{
      const k = (ix < CRITS.length) ? CRITS[ix].k : "__note";
      b.setAttribute("aria-current", String(k===sheetCrit));
    });
    body.innerHTML = "";
    const r = dayRec(curSlot, student.id);

    if(sheetCrit === "__note"){
      body.appendChild(el("p",{class:"muted",style:"margin:0",text:t("noteHint")}));
      const nt = r.note || {txt:"",crit:"",dir:0,w:0};
      const f1 = el("div",{class:"field",style:"margin:0"});
      const ta = el("textarea",{id:"noteTxt",placeholder:t("note")}); ta.value = nt.txt||"";
      f1.appendChild(ta); body.appendChild(f1);

      const g = el("div",{class:"grid2"});
      const f2 = el("div",{class:"field"});
      f2.appendChild(el("label",{for:"noteCrit",text:t("noteCrit")}));
      const sc = el("select",{id:"noteCrit"});
      sc.appendChild(el("option",{value:"",text:"—",selected:!nt.crit}));
      CRITS.forEach(c=>sc.appendChild(el("option",{value:c.k,text:critName(c.k,S.settings.uiLang),selected:nt.crit===c.k})));
      f2.appendChild(sc); g.appendChild(f2);

      const f3 = el("div",{class:"field"});
      f3.appendChild(el("label",{for:"noteEff",text:t("noteEffect")}));
      const se = el("select",{id:"noteEff"});
      const cur = (nt.dir&&nt.w) ? (nt.dir>0?"+":"-")+nt.w : "0";
      [["0",t("neutral")],["+0.25","+ 0.25"],["+0.5","+ 0.50"],["+1","+ 1.00"],
       ["-0.25","− 0.25"],["-0.5","− 0.50"],["-1","− 1.00"]]
        .forEach(([v,lb])=>se.appendChild(el("option",{value:v,text:lb,selected:cur===v})));
      f3.appendChild(se); g.appendChild(f3);
      body.appendChild(g);

      const ci = el("input",{type:"checkbox",id:"noteInt",checked:!!nt.internal});
      body.appendChild(el("label",{class:"chk",for:"noteInt"},[ci, el("span",{text:t("internal")})]));

      body.appendChild(el("button",{class:"btn pri",text:t("done"),onclick:()=>{
        unseed();
        const txt = ta.value.trim();
        if(!txt){ r.note = null; }
        else{
          const num = parseFloat(se.value);
          r.note = {txt, crit: sc.value||"", dir: num>0?1:(num<0?-1:0), w: Math.abs(num)||0, internal: ci.checked};
          if(!r.note.crit){ r.note.dir = 0; r.note.w = 0; }
        }
        persist(); close();
      }}));
      return;
    }

    [[1,t("plus")],[-1,t("minus")]].forEach(([dir,label])=>{
      const list = CHIPS.filter(c=>c.c===sheetCrit && c.d===dir);
      if(!list.length) return;
      const grp = el("div",{class:"grp"});
      grp.appendChild(el("span",{class:"eyebrow",text:label}));
      const opts = el("div",{class:"opts"});
      list.forEach(c=>{
        const on = obsOf(r).includes(c.i);
        const sig = c.ko ? "K.-o." : (c.d>0?"+":"−") + c.w.toFixed(2).slice(1);
        const b = el("button",{class:"opt "+(c.d>0?"p":"m")+(on?" on":"")+(c.ko?" ko":""),
          onclick:()=>{ unseed();
            r.obs = obsOf(r).includes(c.i) ? obsOf(r).filter(x=>x!==c.i) : [...obsOf(r), c.i];
            persist(); draw(); }},
          [el("span",{class:"sig num",text:sig}), el("span",{text:chipT(c, S.settings.uiLang)})]);
        opts.appendChild(b);
      });
      grp.appendChild(opts); body.appendChild(grp);
    });
  }
  draw();
}

/* ---------- Beurteilungstexte ---------- */
function buildReport(s, mode, lg){
  const sum = summary(s.id, mode);
  const period = recordedPeriod(s.id, mode, lg);
  const P = k => tOut(k, lg);
  const ex = (mode === "all") ? examSummary(s.id) : null;
  const fin = ex ? finalGrade(sum.total, ex.total) : null;
  const out = [];
  out.push(longName(s) + [klasseOf(s), gruppeOf(s)].filter(Boolean)
    .map(x=>" \u00b7 " + x).join(""));
  out.push(period + " · " + sum.counted + " " + P("daysCounted"));
  if(sum.total!=null) out.push(P(ex?"praxisGrade":"grade") + ": " + fmt(sum.total) + " (" + bandName(sum.total, lg) + ")");
  if(ex){
    out.push(P("examGrade") + ": " + (ex.total!=null
      ? fmt(ex.total) + " (" + bandName(ex.total, lg) + ")"
      : P("noData")));
  }
  if(fin!=null) out.push(P("finalGrade") + ": " + fmt(fin) + " (" + bandName(fin, lg) + ")");
  out.push("");
  if(!sum.counted && !sum.notes.length){ out.push(P("noData")); return out.join("\n"); }

  const entries = Object.entries(sum.tally).map(([id,n])=>({c:CHIP[id],n})).filter(x=>x.c);
  const pos = entries.filter(x=>x.c.d>0).sort((a,b)=>b.n-a.n||b.c.w-a.c.w);
  const neg = entries.filter(x=>x.c.d<0).sort((a,b)=>(b.n*(b.c.w||1))-(a.n*(a.c.w||1)));

  if(pos.length){
    out.push(P("takeaway") + ":");
    pos.slice(0,6).forEach(x=>out.push("• " + critName(x.c.c, lg) + ": " + chipT(x.c, lg) + (x.n>1?" ("+x.n+"×)":"")));
    out.push("");
  }
  if(neg.length){
    /* Beobachtung bleibt nachvollziehbar, der Schwerpunkt liegt auf dem nächsten Schritt. */
    out.push(P("gain") + ":");
    neg.slice(0,4).forEach((x,ix)=>{
      out.push((ix+1) + ". " + critName(x.c.c, lg));
      out.push("   " + P("observed") + ": " + chipT(x.c, lg) + (x.n>1?" ("+x.n+"×)":""));
      if(x.c.a) out.push("   " + P("nextStep") + ": " + chipA(x.c, lg));
    });
    out.push("");
  }
  const openNotes = sum.notes.filter(n=>!n.internal);
  if(openNotes.length){
    out.push(P("notes") + ":");
    openNotes.forEach(n=>out.push("• " + slotLabel(n.slot, lg) + ": " + n.txt));
    out.push("");
  }
  if(sum.exc || sum.unx || sum.late){
    const a = [];
    if(sum.exc) a.push(sum.exc + " × " + P("excusedNote"));
    if(sum.unx) a.push(sum.unx + " × " + P("unexcusedNote"));
    if(sum.late) a.push(sum.late + " × " + P("late"));
    out.push(P("abs") + ": " + a.join(", "));
    out.push("");
  }
  if(sum.tm){
    out.push(P("teamMarket") + ": " + sum.tm + " × (5.00)");
    out.push("");
  }
  const g0 = (fin!=null) ? fin : (sum.total!=null ? sum.total : (ex?ex.total:null));
  if(g0!=null) out.push(P(g0>=5.25 ? "cl1" : g0>=4.75 ? "cl2" : g0>=4.0 ? "cl3" : "cl4"));
  out.push("");
  out.push(P("weightNote"));
  out.push("");
  if(sum.crit) out.push(P(ex?"praxis":"grade") + ": " + CRITS.map(c=>critName(c.k, lg)+" "+fmt1(sum.crit[c.k])).join("  ·  "));
  if(ex && ex.crit) out.push(P("examShort") + ": " + CRITS.map(c=>critName(c.k, lg)+" "+fmt1(ex.crit[c.k])).join("  ·  "));
  return out.join("\n").trim();
}

function csvEsc(v){
  let s = String(v==null?"":v);
  if(/^[=+\-@\t\r]/.test(s)) s = "'" + s;            // entschaerft Excel-Formeln
  return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function gradeRows(){
  const rng = slotsInRange(repMode);
  const period = rng.length ? slotLabel(rng[0],"de")+" – "+slotLabel(rng[rng.length-1],"de") : "";
  const withExam = (repMode === "all") && !!examSlot();
  const head = ["Klasse","Gruppe/Team","Outlet","Dozent","Studierende","Nachname","Vorname","Nickname","E-Mail","Turnus","Tage gewertet","Entschuldigt","Unentschuldigt","Verspaetet","Team Market",
    ...CRITS.map(c=>c.de), withExam?"Praxisnote":"Gesamtnote","Gerundet","Prädikat"]
    .concat(withExam ? [...CRITS.map(c=>"Exam "+c.de), "Prüfungsnote","Exam Anwesenheit"] : [])
    .concat(withExam ? ["Schlussnote"] : []).concat(["Sprache","Beurteilung"]);
  const rows = S.students.map(s=>{
    const su = summary(s.id, repMode);
    const ex = withExam ? examSummary(s.id) : null;
    const base = [klasseOf(s), gruppeOf(s), S.settings.outlet||"", S.settings.teacher,
                  dispName(s), s.last||"", s.first||"", s.nick||"", s.mail||"", period,
                  su.counted, su.exc, su.unx, su.late, su.tm||0,
      ...CRITS.map(c=>su.crit?Number(su.crit[c.k].toFixed(2)):""),
      su.total!=null?Number(su.total.toFixed(2)):"", su.total!=null?Number(fmt1(su.total)):"",
      su.total!=null?bandName(su.total,"de"):""];
    let row = base;
    if(withExam){
      const att = {present:"Anwesend",late:"Verspätet",excused:"Abwesend",unexcused:"Abwesend",tm:"Team Market"};
      row = row.concat([
        ...CRITS.map(c=>(ex&&ex.crit)?Number(ex.crit[c.k].toFixed(2)):""),
        (ex&&ex.total!=null)?Number(ex.total.toFixed(2)):"",
        ex?(att[ex.att]||ex.att):"nicht erfasst"
      ]);
    }
    if(withExam){
      const fin = finalGrade(su.total, ex?ex.total:null);
      row = row.concat([fin!=null?Number(fin.toFixed(2)):""]);
    }
    row = row.concat([outLangOf(s)]);
    row = row.concat([buildReport(s, repMode, outLangOf(s))]);
    return row;
  });
  return {head, rows};
}
function evidenceRows(){
  const head = ["Studierende","Nachname","Vorname","Nickname","Einsatztag","Woche","Art","Erfasst von","Klasse","Gruppe/Team","Outlet","Anwesenheit",
                "Kriterium","Richtung","Gewicht","Beobachtung"];
  const rows = [];
  const rng = slotsInRange(repMode).concat(
    (repMode==="all" && examSlot()) ? [examSlot()] : []);
  rng.forEach(sl=>{
    const d = S.days[sl.id]; if(!d) return;
    S.students.forEach(s=>{
      const r = d[s.id]; if(!r) return;
      const att = {present:"Anwesend",late:"Verspätet",excused:"Entschuldigt",unexcused:"Unentschuldigt",tm:"Team Market"}[r.att]||r.att;
      const kind = sl.exam ? "Exam Day" : "Praxis";
      const lab = sl.exam ? "Exam Day" : slotLabel(sl,"de");
      const mt = dayMeta(sl.id);
      const pre = [dispName(s), s.last||"", s.first||"", s.nick||"", lab, sl.week, kind,
                   mt.teacher, klasseOf(s), gruppeOf(s), mt.outlet||"", att];
      obsOf(r).forEach(id=>{
        const c = CHIP[id]; if(!c) return;
        rows.push(pre.concat([critName(c.c,"de"), c.ko?"K.-o.":(c.d>0?"+":"−"), c.ko?"":c.w, chipT(c,"de")]));
      });
      if(r.note && r.note.txt)
        rows.push(pre.concat([r.note.crit?critName(r.note.crit,"de"):"",
          r.note.dir>0?"+":(r.note.dir<0?"−":""), r.note.w||"",
          (r.note.internal?"Freitext (intern): ":"Freitext: ")+r.note.txt]));
      if(!obsOf(r).length && !(r.note&&r.note.txt) && r.att!=="present")
        rows.push(pre.concat(["", "", "", ""]));
    });
  });
  return {head, rows};
}
function buildCsv(){
  const {head, rows} = gradeRows();
  return "﻿" + [head.map(csvEsc).join(";")].concat(rows.map(r=>r.map(csvEsc).join(";"))).join("\r\n");
}
function buildXlsx(){
  if(typeof XLSX === "undefined") return null;
  const g = gradeRows(), e = evidenceRows();
  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.aoa_to_sheet([g.head, ...g.rows]);
  ws1["!cols"] = g.head.map((h,i)=>({wch: i===4?24 : i===8?30 : (i<10?16:12)}));
  ws1["!cols"][g.head.length-1] = {wch:90};
  XLSX.utils.book_append_sheet(wb, ws1, "Noten");
  const ws2 = XLSX.utils.aoa_to_sheet([e.head, ...e.rows]);
  ws2["!cols"] = [{wch:24},{wch:16},{wch:14},{wch:12},{wch:14},{wch:6},{wch:10},
                  {wch:18},{wch:9},{wch:14},{wch:20},{wch:14},{wch:20},{wch:9},{wch:8},{wch:70}];
  XLSX.utils.book_append_sheet(wb, ws2, "Beobachtungen");
  const buf = XLSX.write(wb, {bookType:"xlsx", type:"array"});
  return new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

function fileStem(){
  const d = new Date();
  const iso = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  const clean = x => String(x||"").trim().replace(/[^A-Za-z0-9ÄÖÜäöüß]+/g,"-").replace(/^-+|-+$/g,"");
  const parts = [clean(S.settings.teacher), clean(S.settings.group), clean(S.settings.outlet), VARIANT, iso].filter(Boolean);
  return parts.length > 2 ? parts.join("_") : "Kuechenrapport_" + VARIANT + "_" + iso;
}

async function onMerge(e){
  const files = [...e.target.files]; let addedS=0, addedD=0; const clash=[], wrongVar=[], placed=[];
  for(const f of files){
    try{
      const o = JSON.parse(await f.text());
      if(!o || !Array.isArray(o.students) || !o.days) continue;
      o.days = sanitizeDays(o.days);                 // fremde Datei auf die erwartete Form bringen
      if(!acceptsVariant(o.variant)){ wrongVar.push(f.name + " (" + o.variant + ")"); continue; }
      if(o.variant && o.variant !== VARIANT) placed.push(o.variant);
      const map = {};
      o.students.forEach(st=>{
        if(!st || typeof st !== "object") return;
        const nmOf = x => (dispName(x) || "").trim().toLowerCase();
        /* Gleicher Name und (falls beide vorhanden) gleiche E-Mail = dieselbe Person.
           Alle Felder werden uebernommen: vorher gingen Nachname/Vorname getrennt,
           Nickname, Klasse und Gruppe neuer Personen verloren (Fehler bis 05.10.2026). */
        let ex = S.students.find(x => nmOf(x) === nmOf(st) &&
          (!x.mail || !st.mail || x.mail.toLowerCase() === String(st.mail).toLowerCase()));
        if(!ex){
          ex = {id:"m"+Math.random().toString(36).slice(2,8), name:st.name||"",
                last:st.last||"", first:st.first||"", nick:st.nick||"",
                nr:st.nr||"", foto:st.foto||"",
                mail:st.mail||"", lang:st.lang||"",
                klasse:st.klasse||"", gruppe:st.gruppe||""};
          S.students.push(ex); addedS++;
        } else {                       // bestehende Person: fehlende Angaben nachtragen
          ["last","first","nick","mail","lang","klasse","gruppe","nr","foto"].forEach(k=>{
            if(!ex[k] && st[k]) ex[k] = st[k];
          });
        }
        map[st.id] = ex.id;
      });
      normalizeStudents();
      Object.entries(o.days).forEach(([srcId,recs])=>{
        const slid = mapSlotId(o.variant, srcId);
        if(!slid) return;
        S.days[slid] = S.days[slid] || {};
        if(o.dayMeta && o.dayMeta[srcId] && !S.dayMeta[slid]) S.dayMeta[slid] = o.dayMeta[srcId];
        Object.entries(recs).forEach(([oldId,r])=>{
          const nid = map[oldId]; if(!nid) return;
          if(!S.days[slid][nid]){ S.days[slid][nid] = r; addedD++; }
          else{
            const nm = (S.students.find(x=>x.id===nid)||{}).name || nid;
            const sl = slots().find(x=>x.id===slid);
            clash.push(nm + " / " + (sl ? slotLabel(sl) : slid));
          }
        });
      });
    }catch(err){}
  }
  unseed(); persist();
  let msg = "+"+addedS+" "+t("student")+" · +"+addedD+" "+t("days");
  if(clash.length) msg += "  ⚠︎ "+clash.length+"× doppelt erfasst, bestehender Eintrag behalten: "
    + clash.slice(0,3).join(", ") + (clash.length>3 ? " …" : "");
  if(placed.length) msg += "  · " + [...new Set(placed)].join(", ") + " " + t("placedAs");
  if(wrongVar.length) msg += "  ⚠︎ " + t("wrongVariant") + ": " + wrongVar.join(", ");
  toast(msg); renderData();
}
/* Sicherung wieder einlesen: ersetzt den gesamten Inhalt dieser Datei */
async function onRestore(e){
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!f) return;
  try{
    const o = JSON.parse(await f.text());
    if(!o || !o.settings || !Array.isArray(o.students)) throw new Error("format");
    if(o.variant && o.variant !== VARIANT){ toast(t("wrongVariant") + ": " + o.variant); return; }
    S = { settings:{...DEF, ...o.settings, isSample:false},
          students:o.students.filter(x=>x && typeof x.name === "string"),
          days:sanitizeDays(o.days),
          dayMeta:(o.dayMeta && typeof o.dayMeta === "object") ? o.dayMeta : {} };
    normalizeSettings(); pruneOrphans();
    persist();
    curSlot = slots()[0].id;
    view = "set"; render();
    toast(t("restoreDone") + ": " + S.students.length + " " + t("student")
          + " · " + Object.keys(S.days).length + " " + t("days"));
  }catch(err){ toast(t("restoreBad")); }
}

        : WDAYS.filter(x=>cur.includes(x.k)||x.k===w.k).map(x=>x.k);
      if(!S.settings.weekdays.length) S.settings.weekdays = [w.k];
      if(S.settings.startIdx >= S.settings.weekdays.length) S.settings.startIdx = 0;
      persist(); renderSet();
    }})));
  fw.appendChild(wd); c2.appendChild(fw);

  const g3 = el("div",{class:"grid2"});
  const fs = el("div",{class:"field"});
  fs.appendChild(el("label",{for:"fStart",text:t("startOn")}));
  const selS = el("select",{id:"fStart",onchange:e=>{S.settings.startIdx=parseInt(e.target.value,10);persist();curSlot=slots()[0].id;render();}});
  (S.settings.weekdays||[]).forEach((k,ix)=>selS.appendChild(el("option",{value:String(ix),text:wdName(k),selected:S.settings.startIdx===ix})));
  fs.appendChild(selS); g3.appendChild(fs);
  const fx = el("div",{class:"field"});
  fx.appendChild(el("label",{text:t("fixedRules")}));
  fx.appendChild(el("div",{style:"padding:8px 0;font-size:13.5px;color:var(--ink2);line-height:1.5",
    text: HAS_EXAM
      ? SLOT_COUNT + " " + t("daysFixed") + " · " + t("examFixed").replace("10", String(SLOT_COUNT)) + " · " + t("fm67")
      : SLOT_COUNT + " " + t("daysFixed") + " · " + t("vNoExam") + " · " + t("fmPraxis")}));
  g3.appendChild(fx);
  c2.appendChild(g3);
  c2.appendChild(el("p",{class:"muted",style:"margin:2px 0 10px",text:t("turnusHint")+" "+t("examHint")}));
  c2.appendChild(el("div",{class:"row",style:"gap:5px"},
    slots().map(s=>el("span",{class:"obs "+(s.exam?"p":"nt"),style:"padding:2px 9px;font-size:12px",
      text:(s.exam ? t("examDay")+" ("+wdName(s.wd)+")" : slotLabel(s))+(dayOpen(s.id)?" ✓":"")}))));
  root.appendChild(c2);

  /* Rechenlogik */
  const c4 = el("div",{class:"card pad",style:"margin-top:14px"});
  c4.appendChild(el("span",{class:"eyebrow",text:t("calc"),style:"display:block;margin-bottom:8px"}));
  const info = el("div",{style:"font-size:13.5px;line-height:1.65;color:var(--ink2)"});
  info.innerHTML = "Jeder Einsatztag startet pro Kriterium auf der Basisnote <b class='num'>"+baseNum().toFixed(2)+"</b>. "+
    "Jede angetippte Beobachtung verschiebt diese Note: leicht <b class='num'>0.25</b>, mittel <b class='num'>0.50</b>, schwer <b class='num'>1.00</b>. "+
    "Pro Tag und Kriterium sind maximal <b class='num'>−1.50</b> und <b class='num'>+1.00</b> möglich. "+
    "Ein K.-o.-Baustein setzt das Kriterium auf <b class='num'>1.00</b>. "+
    "Ein Tag ohne Beobachtung zählt bewusst als «wie erwartet». "+
    "Unentschuldigt ergibt eine Tagesnote von <b class='num'>1.00</b>, entschuldigt zählt nicht in den Durchschnitt. "+
    "«Verspätet» setzt automatisch einen Abzug auf Teamfähigkeit. "+
    "Ein Freitext wirkt nur dann auf die Note, wenn ein Kriterium und eine Wirkung gewählt sind. "+
    (S.settings.hyg2 ? "Hygiene zählt im Gesamtschnitt <b>doppelt</b>. " : "Hygiene zählt im Gesamtschnitt einfach. ")+
    (HAS_EXAM
      ? "Der <b>Exam Day</b> ist der " + SLOT_COUNT + ". und letzte Einsatztag. Er wird mit demselben Raster bewertet, "
        + "ergibt eine <b>eigene Note</b> und fliesst nicht in die Praxisnote ein. Abwesenheit am Exam Day ergibt "
        + "<b class='num'>1.00</b>, unabhängig vom Grund; nach einer Nachprüfung wird der Eintrag überschrieben. "
        + "Die <b>Schlussnote</b> ist fest gerechnet: zwei Drittel Praxisnote, ein Drittel Prüfungsnote. "
      : "Diese Variante hat <b>keinen Exam Day</b>. Alle " + SLOT_COUNT + " Einsatztage ergeben zusammen eine Note. ")
    + ""
    + "<b>Team Market</b> ist keine Absenz: der Tag zählt in allen Kriterien fest mit <b class='num'>5.00</b>.";
  c4.appendChild(info);
  root.appendChild(c4);

  /* Sicherung */
  const cB = el("div",{class:"card pad",style:"margin-top:14px"});
  cB.appendChild(el("span",{class:"eyebrow",text:t("backupTitle"),style:"display:block;margin-bottom:8px"}));
  cB.appendChild(el("p",{class:"muted",style:"margin:0 0 10px",text:t("backupHint")}));
  cB.appendChild(el("div",{class:"row"},
    el("button",{class:"btn pri",text:t("backupBtn"),onclick:()=>{
      saveFile(fileStem()+".json", JSON.stringify(snapshot(),null,1), "application/json");
      toast(t("backupDone"));
    }})));
  cB.appendChild(el("p",{class:"muted",style:"margin:10px 0 0",
    text:fileStem()+".json"}));
  /* Gegenrichtung: Sicherung wieder einlesen */
  cB.appendChild(el("div",{style:"margin-top:14px;padding-top:12px;border-top:1px solid var(--line)"},[
    el("span",{class:"eyebrow",style:"display:block;margin-bottom:8px",text:t("restoreTitle")}),
    el("p",{class:"muted",style:"margin:0 0 10px",text:t("restoreHint")})
  ]));
  const rin = el("input",{type:"file",accept:".json,application/json",id:"restoreFile",
                          style:"display:none",onchange:onRestore});
  let rArmed = false;
  const rbtn = el("button",{class:"btn",text:t("restoreBtn"),onclick:()=>{
    const hasData = S.students.length || Object.keys(S.days||{}).length;
    if(hasData && !rArmed){
      rArmed = true;
      rbtn.textContent = t("restoreArm");
      rbtn.style.borderColor = "var(--minus)"; rbtn.style.color = "var(--minus)";
      setTimeout(()=>{ if(rArmed){ rArmed=false; renderSet(); } }, 6000);
      return;
    }
    rin.click();
  }});
  cB.appendChild(el("div",{class:"row"},[rbtn, rin]));
  cB.appendChild(el("p",{class:"muted",style:"margin:10px 0 0",text:t("restoreWarn")}));
  root.appendChild(cB);

  /* Zurücksetzen */
  const c5 = el("div",{class:"card pad",style:"margin-top:14px"});
  c5.appendChild(el("span",{class:"eyebrow",text:t("reset"),style:"display:block;margin-bottom:8px"}));
  c5.appendChild(el("p",{class:"muted",style:"margin:0 0 10px",text:t("resetHint")}));
  const rrow = el("div",{class:"row"});
  rrow.appendChild(el("button",{class:"btn sm",text:t("exportJson"),
    onclick:()=>saveFile(fileStem()+".json", JSON.stringify(snapshot(),null,1), "application/json")}));
  let armed = false;
  const rb = el("button",{class:"btn sm",style:"border-color:var(--minus);color:var(--minus)",text:t("reset"),
    onclick:()=>{
      if(!armed){
        armed = true;
        rb.textContent = t("resetConfirm");
        rb.style.background = "var(--minus)"; rb.style.color = "#fff"; rb.style.borderColor = "var(--minus)";
        setTimeout(()=>{ if(armed){ armed=false; renderSet(); } }, 6000);
        return;
      }
      const keep = {...DEF, uiLang:S.settings.uiLang, outLang:S.settings.outLang,
                    customLangs:S.settings.customLangs||{}, hideBanner:S.settings.hideBanner};
      S = {settings:keep, students:[], days:{}, dayMeta:{}};
      persist(); curSlot = slots()[0].id; view = "set"; render(); toast(t("resetDone"));
    }});
  rrow.appendChild(rb);
  c5.appendChild(rrow);
  c5.appendChild(el("p",{class:"muted",style:"margin:10px 0 0",
    text:t("storeFile")+": "+FILENAME}));
  root.appendChild(c5);
}

/* ---------- Sprachumschalter ---------- */
document.getElementById("uiLang").addEventListener("change", e=>{
  S.settings.uiLang = e.target.value; persist(); render();
});
document.getElementById("outLang").addEventListener("change", e=>{
  S.settings.outLang = e.target.value; persist(); render();
});

render();
</script>

</body>
</html>
