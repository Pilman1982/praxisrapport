<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#001436">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Servicerapport 5 Tage · ohne Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<style>
/* ===== EHL Hotelfachschule Passugg — Markenfarben aus der offiziellen Vorlage =====
   Navy #001436 (Primär) · Navy hell #1B365F · Petrol #005779 · Salbei #919388
   Terracotta #B6633F · Hellgrau #E3E3E1 · Cyan #5EC7F0
   Schriften laut Vorlage: Domaine Display Semibold (Titel), Hurme Geometric Sans 1 (Text).
   Beide sind lizenzpflichtig; sie stehen zuerst im Stack und werden benutzt, wenn sie
   auf dem Gerät installiert sind. Sonst Newsreader bzw. Jost als nächste Verwandte. */
:root{
  --navy:#001436; --navy2:#1B365F; --petrol:#005779; --sage:#919388;
  --terra:#B6633F; --pale:#E3E3E1; --cyan:#5EC7F0;
  --ink:#001436; --ink2:#3B4657; --ink3:#6C7684;
  --ground:#F2F2F0; --surf:#FFFFFF; --surf2:#F8F8F6; --surf3:#EDEDEA;
  --line:#DCDCD6; --line2:#C0C0B8;
  --acc:#001436; --accInk:#FFFFFF; --accSoft:#E2E6EE;
  --plus:#2E6B4E; --plusSoft:#E1EDE6; --plusLine:#A2C5B1;
  --minus:#A4402F; --minusSoft:#F6E4DF; --minusLine:#DCAD9D;
  --warn:#A2572F; --warnSoft:#F5E8DD; --warnLine:#DBB294;
  --logoFilter:none;
  --shadow:0 1px 2px rgba(0,20,54,.07), 0 8px 20px -12px rgba(0,20,54,.32);
  --r:8px;
  --f-disp:"Domaine Display Semibold","Domaine Display",Newsreader,"IBM Plex Sans Thai","Noto Sans SC","Microsoft YaHei",Georgia,serif;
  --f-body:"Hurme Geometric Sans 1",Jost,"IBM Plex Sans Thai","Noto Sans SC","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E7EBF1; --ink2:#A8B2C0; --ink3:#7C8798;
    --ground:#070D18; --surf:#0F1726; --surf2:#141D2E; --surf3:#1C2739;
    --line:#253043; --line2:#374558;
    --acc:#5EC7F0; --accInk:#001436; --accSoft:#122839;
    --plus:#6FBF92; --plusSoft:#12291E; --plusLine:#2C5741;
    --minus:#E28C79; --minusSoft:#33201B; --minusLine:#6A3E32;
    --warn:#D89A6E; --warnSoft:#2E2217; --warnLine:#5A432B;
    --logoFilter:brightness(0) invert(1);
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ink:#E7EBF1; --ink2:#A8B2C0; --ink3:#7C8798;
  --ground:#070D18; --surf:#0F1726; --surf2:#141D2E; --surf3:#1C2739;
  --line:#253043; --line2:#374558;
  --acc:#5EC7F0; --accInk:#001436; --accSoft:#122839;
  --plus:#6FBF92; --plusSoft:#12291E; --plusLine:#2C5741;
  --minus:#E28C79; --minusSoft:#33201B; --minusLine:#6A3E32;
  --warn:#D89A6E; --warnSoft:#2E2217; --warnLine:#5A432B;
  --logoFilter:brightness(0) invert(1);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-disp);font-weight:600;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

header.top{position:sticky;top:0;z-index:40;background:var(--surf);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand img{height:21px;width:auto;filter:var(--logoFilter);flex:0 0 auto}
.brand .sep{width:1px;height:22px;background:var(--line2);flex:0 0 auto}
.brand .txt{min-width:0}
.brand b{font-family:var(--f-disp);font-weight:600;font-size:16px;letter-spacing:-.005em;display:block;line-height:1.15}
.brand .sub{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.vbadge{flex:0 0 auto;font-size:10.5px;font-weight:600;letter-spacing:.05em;color:var(--petrol);
  border:1px solid var(--petrol);border-radius:999px;padding:2px 9px;white-space:nowrap}
.langs{display:flex;gap:6px;align-items:center}
.langs label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}
select.mini{background:var(--surf2);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12.5px}
nav.tabs{max-width:980px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:2.5px solid transparent;padding:9px 10px;font-size:13.5px;font-weight:500;color:var(--ink3);white-space:nowrap}
nav.tabs button[aria-current="true"]{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
main{max-width:980px;margin:0 auto;padding-block:18px 96px;padding-left:16px;padding-right:16px}
section[hidden]{display:none!important}

.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r)}
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink3);font-weight:600}
.muted{color:var(--ink3);font-size:13px}
.btn{background:var(--surf);border:1px solid var(--line2);border-radius:6px;padding:8px 13px;font-size:13.5px;font-weight:500;text-decoration:none;display:inline-block;color:var(--ink)}
.btn:hover{background:var(--surf2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accInk);font-weight:600}
.btn.pri:hover{filter:brightness(1.15)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.banner{background:var(--warnSoft);border:1px solid var(--warnLine);color:var(--ink);border-radius:var(--r);padding:10px 13px;font-size:13px;display:flex;gap:9px;align-items:flex-start;margin-bottom:16px}
.banner b{font-family:var(--f-disp)}

.slots{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:thin}
.slot{flex:0 0 auto;background:var(--surf);border:1px solid var(--line);border-radius:7px;padding:6px 11px;min-width:80px;text-align:left;line-height:1.25;color:var(--ink)}
.slot .sd{font-family:var(--f-disp);font-weight:600;font-size:13.5px;display:block;white-space:nowrap}
.slot .sw{font-size:10px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.slot[aria-current="true"]{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.slot[aria-current="true"] .sw{color:var(--accInk);opacity:.82}
.slot.filled{box-shadow:inset 3px 0 0 var(--acc)}
.slot[aria-current="true"].filled{box-shadow:none}
.slot.exam{border-color:var(--petrol);border-style:dashed}
.slot.exam .sd{color:var(--petrol)}
.slot.exam[aria-current="true"]{background:var(--petrol);border-color:var(--petrol);border-style:solid;color:#fff}
.slot.exam[aria-current="true"] .sd{color:#fff}
.slot.exam[aria-current="true"] .sw{color:#fff}

.examnote{background:var(--accSoft);border:1px solid var(--acc);border-radius:var(--r);padding:9px 13px;font-size:13px;margin-bottom:12px;display:flex;gap:9px;align-items:center}
.examnote b{font-family:var(--f-disp)}

.stud{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.stud.absent{background:var(--surf2)}
.stud-h{display:flex;align-items:center;gap:10px;padding:10px 12px}
.opill{font:600 12px/1 inherit;border:1px solid var(--line2);background:transparent;color:inherit;border-radius:999px;padding:6px 10px;cursor:pointer;white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis}
.opill.alt{background:var(--petrol);border-color:var(--petrol);color:#fff}
.ava{border-radius:50%;object-fit:cover;flex:0 0 auto;background:#ddd;vertical-align:middle}
.stud-h .nm{font-family:var(--f-disp);font-weight:600;font-size:15.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grade{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;padding:3px 9px;border-radius:5px;background:var(--surf3);border:1px solid var(--line);min-width:52px;text-align:center}
.grade.g-hi{background:var(--plusSoft);border-color:var(--plusLine);color:var(--plus)}
.grade.g-lo{background:var(--minusSoft);border-color:var(--minusLine);color:var(--minus)}
.grade.g-na{color:var(--ink3);font-size:12.5px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.seg.five{grid-template-columns:repeat(5,1fr)}
@media(max-width:600px){.seg.five{grid-template-columns:repeat(3,1fr)}
  .seg.five button:nth-child(3){border-right:0}
  .seg.five button:nth-child(-n+3){border-bottom:1px solid var(--line)}
  .seg.five button:nth-child(5){grid-column:span 2;border-right:0}}
.seg button{background:var(--surf2);border:0;border-right:1px solid var(--line);padding:7px 4px;font-size:11.5px;font-weight:500;color:var(--ink3);line-height:1.25}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--accInk);font-weight:600}
.seg button.v-late[aria-pressed="true"]{background:var(--warn);color:#fff}
.seg button.v-exc[aria-pressed="true"]{background:var(--sage);color:#fff}
.seg button.v-unx[aria-pressed="true"]{background:var(--minus);color:#fff}
.seg button.v-tm[aria-pressed="true"]{background:var(--petrol);color:#fff}
.stud-b{padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.obs{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 5px 3px 10px;font-size:12.5px;line-height:1.35;max-width:100%;border:1px solid}
.obs.p{background:var(--plusSoft);border-color:var(--plusLine);color:var(--plus)}
.obs.m{background:var(--minusSoft);border-color:var(--minusLine);color:var(--minus)}
.obs.nt{background:var(--surf3);border-color:var(--line2);color:var(--ink2)}
.obs .x{background:none;border:0;color:inherit;opacity:.6;font-size:15px;line-height:1;padding:0 3px}
.obs .x:hover{opacity:1}
.obs .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46ch}
.addbtn{background:var(--accSoft);border:1px dashed var(--acc);color:var(--acc);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600}
.emptyhint{font-size:12.5px;color:var(--ink3);font-style:italic}

.scrim{position:fixed;inset:0;background:rgba(0,10,26,.55);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surf);border-top:1px solid var(--line2);border-radius:12px 12px 0 0;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
@media(min-width:720px){.sheet{left:50%;transform:translateX(-50%);width:min(700px,94vw);bottom:16px;border-radius:12px;border:1px solid var(--line2)}}
.sheet-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sheet-h h3{font-size:15.5px;font-weight:600;flex:1;min-width:0}
.crittabs{display:flex;gap:4px;overflow-x:auto;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--surf2)}
.crittabs button{background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;white-space:nowrap;color:var(--ink2)}
.crittabs button[aria-current="true"]{background:var(--acc);border-color:var(--acc);color:var(--accInk);font-weight:600}
.crittabs button.note[aria-current="true"]{background:var(--petrol);border-color:var(--petrol);color:#fff}
.sheet-b{overflow-y:auto;padding:12px 14px 18px;display:flex;flex-direction:column;gap:14px}
.grp .eyebrow{margin-bottom:7px;display:block}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:flex-start;gap:9px;text-align:left;width:100%;border-radius:6px;padding:8px 11px;font-size:13.5px;line-height:1.4;border:1px solid;background:var(--surf);color:var(--ink)}
.opt.p{border-color:var(--plusLine)}
.opt.p:hover{background:var(--plusSoft)}
.opt.m{border-color:var(--minusLine)}
.opt.m:hover{background:var(--minusSoft)}
.opt .sig{font-variant-numeric:tabular-nums;font-weight:600;flex-shrink:0;width:2.8em;font-size:12px;padding-top:1px}
.opt.p .sig{color:var(--plus)}
.opt.m .sig{color:var(--minus)}
.opt.on{box-shadow:inset 0 0 0 2px var(--acc)}
.opt.ko{border-color:var(--minus);background:var(--minusSoft)}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surf)}
.tblwrap th.abbr{letter-spacing:.08em;cursor:help}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{background:var(--surf2);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:600}
thead th.sep,tbody td.sep{border-left:1px solid var(--line2)}
tbody tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;text-align:right}
td.nm{font-weight:500;font-family:var(--f-disp);font-size:13.5px}
/* Bei neun Kriterien ist die Tabelle breiter als der Container. Die Namensspalte
   bleibt beim waagrechten Scrollen stehen, sonst weiss niemand mehr, wessen Note er liest. */
.tblwrap thead th:first-child,
.tblwrap tbody td.nm{position:sticky;left:0;z-index:1;background:var(--surf)}
.tblwrap thead th:first-child{z-index:2;background:var(--surf2)}
.tblwrap tbody td.nm{box-shadow:1px 0 0 var(--line)}
.bar{display:inline-block;height:7px;border-radius:2px;background:var(--acc);vertical-align:middle}

.rep{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.rep-h{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.rep-h h3{font-size:17px;font-weight:600;flex:1;min-width:0}
.rep h3{font-size:17px;font-weight:600;margin-bottom:2px}
.rep .meta{font-size:12px;color:var(--ink3);margin-bottom:10px}
.rep pre{white-space:pre-wrap;font-family:var(--f-body);font-size:13.5px;line-height:1.6;margin:0;background:var(--surf2);border:1px solid var(--line);border-radius:6px;padding:12px 13px}
.rep .acts{margin-top:10px}

.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);font-weight:600}
.field input,.field select,.field textarea{background:var(--surf2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:14px;width:100%;font-family:inherit}
.field textarea{min-height:110px;line-height:1.6}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 14px}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0 14px;align-items:start}
.grid5 .field{margin-bottom:10px}
.grid5 .field label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.grid5 .field input,.grid5 .field select{height:38px}
@media(max-width:1000px){.grid5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){.grid5{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:460px){.grid5{grid-template-columns:1fr}}
.pad{padding:14px 16px}
details.exp{border:1px solid var(--line);border-radius:var(--r);background:var(--surf);margin-bottom:12px}
details.exp>summary{padding:11px 14px;font-weight:600;font-size:14.5px;font-family:var(--f-disp);cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center}
details.exp>summary::-webkit-details-marker{display:none}
details.exp>summary::after{content:"+";margin-left:auto;color:var(--ink3)}
details.exp[open]>summary::after{content:"–"}
details.exp>div{padding:0 14px 14px;border-top:1px solid var(--line);padding-top:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:70;background:var(--navy);color:#fff;padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow);max-width:90vw;text-align:center}
:root[data-theme="dark"] .toast,:root:not([data-theme="light"]) .toast{}
.scale{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12.5px}
.scale b{font-variant-numeric:tabular-nums}
.wdays{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0}
.wdays button{background:var(--surf2);border:1px solid var(--line);border-radius:6px;padding:6px 11px;font-size:13px;color:var(--ink)}
.wdays button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--accInk);font-weight:600}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;padding:7px 0;cursor:pointer}
.chk input{width:auto}

.seg.two{grid-template-columns:repeat(2,1fr)}
.alert{background:var(--minusSoft);border:1px solid var(--minus);color:var(--ink);border-radius:var(--r);
  padding:10px 13px;font-size:13px;margin-bottom:16px;display:flex;gap:9px;align-items:flex-start}
.alert b{font-family:var(--f-disp)}

/* ===== Druckansicht im EHL-Briefbild ===== */
#printArea{display:none}
@media print{
  body{background:#fff!important;color:#001436!important}
  body.printing > *:not(#printArea){display:none!important}
  #printArea{display:block!important;font-family:"Hurme Geometric Sans 1",Jost,"IBM Plex Sans Thai","Noto Sans SC","Microsoft YaHei",sans-serif;color:#001436;font-size:10pt;line-height:1.5}
  #printArea .pdoc{page-break-after:always;break-after:page}
  #printArea .pdoc:last-child{page-break-after:auto;break-after:auto}
  #printArea .plogo{height:11mm;width:auto;display:block;margin-bottom:7mm}
  #printArea h2{font-family:"Domaine Display Semibold",Newsreader,Georgia,serif;font-size:17pt;font-weight:600;margin:0 0 1mm;color:#001436}
  #printArea .phead{border-bottom:1.5pt solid #001436;padding-bottom:2.5mm;margin-bottom:4mm}
  #printArea .pmeta{font-size:8.5pt;color:#5A6270;letter-spacing:.02em}
  #printArea .pgrades{display:flex;gap:6mm;margin:0 0 4mm}
  #printArea .pgbox{border:0.75pt solid #C0C0B8;border-top:2.5pt solid #001436;padding:2.5mm 4mm;min-width:38mm}
  #printArea .pgbox .lb{font-size:7.5pt;text-transform:uppercase;letter-spacing:.09em;color:#5A6270}
  #printArea .pgbox .vl{font-size:16pt;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
  #printArea .pgbox .bd{font-size:8.5pt;color:#5A6270}
  #printArea h3{font-family:"Domaine Display Semibold",Newsreader,Georgia,serif;font-size:10.5pt;font-weight:600;margin:4.5mm 0 1.5mm;color:#001436;
    border-bottom:0.5pt solid #DCDCD6;padding-bottom:1mm}
  #printArea .li{margin:0 0 1.2mm 0;padding-left:4.5mm;text-indent:-4.5mm}
  #printArea .pclose{margin:5mm 0 0;padding:2.5mm 3.5mm;background:#F2F2F0;border-left:2pt solid #001436}
  #printArea .pnote{margin:3mm 0 0;font-size:8pt;color:#5A6270}
  #printArea table{width:100%;border-collapse:collapse;font-size:8.5pt;margin:2mm 0 0}
  #printArea th{background:#EDEDEA;border:0.5pt solid #C0C0B8;padding:1.2mm 2mm;text-align:left;font-weight:600;
    text-transform:uppercase;letter-spacing:.05em;font-size:7.5pt;color:#3B4657}
  #printArea td{border:0.5pt solid #C0C0B8;padding:1.2mm 2mm;font-variant-numeric:tabular-nums}
  #printArea .psign{margin-top:10mm;display:flex;gap:14mm;font-size:8.5pt;color:#5A6270}
  #printArea .psign div{flex:1;border-top:0.5pt solid #001436;padding-top:1.5mm}

{i:"gas-p3",c:"gas",d:1,w:W.m,t:{de:"Reklamation ruhig aufgenommen, Verständnis gezeigt und eine Lösung angeboten",en:"Handled a complaint calmly, showed understanding and offered a solution",th:"รับข้อร้องเรียนอย่างใจเย็น แสดงความเข้าใจ และเสนอทางแก้ไข",zh:"冷静受理投诉，表示理解并提出解决方案"}},
{i:"gas-p4",c:"gas",d:1,w:W.m,t:{de:"Präsenz im Revier gehalten, aufmerksam und ohne aufdringlich zu wirken",en:"Maintained presence in the station, attentive without being intrusive",th:"อยู่ประจำโซนอย่างสม่ำเสมอ ใส่ใจแต่ไม่รบกวนแขก",zh:"始终在责任区内保持存在感，关注而不打扰"}},
{i:"gas-p5",c:"gas",d:1,w:W.s,t:{de:"Heikle Gastsituation souverän entschärft, Gast verliess das Lokal zufrieden",en:"Defused a difficult guest situation confidently, the guest left satisfied",th:"คลี่คลายสถานการณ์ยากกับแขกได้อย่างมืออาชีพ แขกกลับไปอย่างพอใจ",zh:"从容化解棘手的客人状况，客人满意离店"}},
{i:"gas-n1",c:"gas",d:-1,w:W.m,t:{de:"Gast beim Eintreten nicht beachtet, Begrüssung verzögert",en:"Guest not noticed on arrival, greeting delayed",th:"ไม่สังเกตเห็นแขกเมื่อเข้ามา ทักทายล่าช้า",zh:"客人进门未被注意，问候延迟"},a:{de:"Vereinbart im Team ein festes Blickfeld zur Türe und begrüsst jeden Gast innerhalb von 30 Sekunden, auch wenn ihr noch am Arbeiten seid.",en:"Agree in the team who keeps an eye on the door and greet every guest within 30 seconds, even while working.",th:"ตกลงกันในทีมว่าใครคอยมองประตู และทักทายแขกทุกคนภายใน 30 วินาที แม้กำลังทำงานอยู่",zh:"在团队内约定由谁留意门口，并在 30 秒内问候每位客人，即使手头仍有工作。"}},
{i:"gas-n3",c:"gas",d:-1,w:W.m,t:{de:"Reklamation abgewiesen oder an den Gast zurückgegeben, ohne Lösung anzubieten",en:"Complaint rejected or pushed back to the guest without offering a solution",th:"ปฏิเสธข้อร้องเรียนหรือโยนกลับให้แขก โดยไม่เสนอทางแก้ไข",zh:"拒绝投诉或把问题推回给客人，未提出解决方案"},a:{de:"Nutze die Schrittfolge zuhören, danken, Verständnis zeigen, Lösung anbieten, Vorgesetzte informieren.",en:"Use the sequence: listen, thank, show understanding, offer a solution, inform your supervisor.",th:"ใช้ลำดับขั้น: ฟัง ขอบคุณ แสดงความเข้าใจ เสนอทางแก้ และแจ้งหัวหน้า",zh:"按顺序处理：倾听、致谢、表示理解、提出方案、告知上级。"}},
{i:"gas-n5",c:"gas",d:-1,w:W.m,t:{de:"Revier längere Zeit verlassen, Gäste ohne Ansprechperson",en:"Left the station for a longer period, guests without a contact person",th:"ออกจากโซนรับผิดชอบเป็นเวลานาน แขกไม่มีผู้ดูแล",zh:"长时间离开责任区，客人无人照应"},a:{de:"Sprich dich mit deinem Partner ab, wer das Revier übernimmt, bevor du es verlässt.",en:"Agree with your partner who covers the station before you leave it.",th:"ตกลงกับคู่งานว่าใครดูแลโซนแทน ก่อนที่คุณจะออกไป",zh:"离开责任区前，先与搭档约定由谁接手。"}},
{i:"gas-n7",c:"gas",d:-1,w:W.s,t:{de:"Gast sichtbar verärgert zurückgelassen, keine Weitergabe an die Vorgesetzten",en:"Guest left visibly annoyed, situation not passed on to a supervisor",th:"ปล่อยให้แขกไม่พอใจอย่างเห็นได้ชัด และไม่แจ้งหัวหน้า",zh:"让客人明显带着不满离开，且未向上级反映"},a:{de:"Informiere bei jeder unklaren Gastsituation sofort die Serviceleitung, damit sie noch im Haus gelöst werden kann.",en:"Inform the service manager immediately about any unresolved guest situation so it can be settled while the guest is still in the house.",th:"แจ้งหัวหน้าแผนกบริการทันทีเมื่อมีสถานการณ์ที่ยังไม่คลี่คลาย เพื่อแก้ไขขณะแขกยังอยู่ในร้าน",zh:"遇到未解决的客人状况立即告知服务主管，以便客人仍在店内时处理。"}},
{i:"gas-ko",c:"gas",d:-1,w:0,ko:true,t:{de:"Respektloses Verhalten gegenüber Gast oder Team (Gastgeberhaltung = 1.0)",en:"Disrespectful behaviour towards a guest or the team (Host attitude = 1.0)",th:"พฤติกรรมไม่ให้เกียรติแขกหรือเพื่อนร่วมทีม (ความเป็นเจ้าบ้าน = 1.0)",zh:"对客人或同事表现出不尊重（待客态度记 1.00）"},a:{de:"Besprich schwierige Situationen ausserhalb des Gastbereichs mit der Serviceleitung; im Gastraum gilt immer Zurückhaltung.",en:"Discuss difficult situations with the service manager away from the guest area; in the restaurant always stay restrained.",th:"พูดคุยเรื่องยากกับหัวหน้าแผนกนอกพื้นที่บริการ ในห้องอาหารต้องสำรวมเสมอ",zh:"把棘手情况带到客区之外与服务主管讨论；在餐厅内始终保持克制。"}},

/* HYGIENE UND ERSCHEINUNGSBILD */
{i:"hyg-p1",c:"hyg",d:1,w:W.m,t:{de:"Uniform vollständig, sauber und gebügelt",en:"Uniform complete, clean and pressed",th:"ชุดยูนิฟอร์มครบถ้วน สะอาด และรีดเรียบ",zh:"制服完整、干净、熨烫平整"}},
{i:"hyg-p3",c:"hyg",d:1,w:W.m,t:{de:"Händehygiene korrekt und an den richtigen Stellen eingehalten",en:"Hand hygiene applied correctly and at the right moments",th:"ปฏิบัติสุขอนามัยมือถูกต้องและถูกจังหวะ",zh:"在正确的环节正确执行手部卫生"}},
{i:"hyg-p4",c:"hyg",d:1,w:W.m,t:{de:"Gläser am Stiel und Besteck am Griff angefasst",en:"Held glasses by the stem and cutlery by the handle",th:"จับแก้วที่ก้านและจับช้อนส้อมที่ด้าม",zh:"握持酒杯持杯脚、餐具持柄"}},
{i:"hyg-p5",c:"hyg",d:1,w:W.l,t:{de:"Station und Office während des Service sauber gehalten",en:"Kept station and back office clean throughout service",th:"รักษาความสะอาดของสเตชันและห้องเตรียมตลอดการบริการ",zh:"服务期间保持工作台与备餐间整洁"}},
{i:"hyg-n1",c:"hyg",d:-1,w:W.m,t:{de:"Uniform unvollständig oder verschmutzt",en:"Uniform incomplete or soiled",th:"ชุดยูนิฟอร์มไม่ครบหรือไม่สะอาด",zh:"制服不完整或不整洁"},a:{de:"Kontrolliere vor Dienstbeginn Hemd, Hose, Schuhe, Gilet und Foulard und halte eine Ersatzgarnitur im Spind bereit.",en:"Check shirt, trousers, shoes, waistcoat and neckerchief before the shift and keep a spare set in your locker.",th:"ตรวจเสื้อ กางเกง รองเท้า เสื้อกั๊ก และผ้าพันคอก่อนเข้างาน และเก็บชุดสำรองไว้ในล็อกเกอร์",zh:"上岗前检查衬衫、长裤、鞋、马甲和领巾，并在更衣柜备一套替换。"}},
{i:"hyg-n3",c:"hyg",d:-1,w:W.m,t:{de:"Gläser am Kelch oder Besteck an der Lauffläche angefasst",en:"Held glasses by the bowl or cutlery by the blade or tines",th:"จับแก้วที่ตัวแก้ว หรือจับช้อนส้อมที่ส่วนใช้งาน",zh:"握持杯身或触碰餐具的进食部位"},a:{de:"Trag Gläser konsequent am Stiel oder auf dem Tablett und nimm Besteck nur am Griff.",en:"Always carry glasses by the stem or on a tray and pick up cutlery only by the handle.",th:"ถือแก้วที่ก้านหรือใช้ถาดเสมอ และหยิบช้อนส้อมที่ด้ามเท่านั้น",zh:"始终持杯脚或用托盘搬运酒杯，餐具只握柄部。"}},
{i:"hyg-n4",c:"hyg",d:-1,w:W.m,t:{de:"Händehygiene nach kritischem Arbeitsschritt unterlassen",en:"Hand hygiene omitted after a critical step",th:"ไม่ล้างมือหลังขั้นตอนที่มีความเสี่ยง",zh:"关键环节后未执行手部卫生"},a:{de:"Wasch die Hände nach jedem Abräumen, vor dem Anfassen von sauberem Material und nach jeder Pause.",en:"Wash your hands after every clearing round, before handling clean items and after every break.",th:"ล้างมือทุกครั้งหลังเก็บจาน ก่อนหยิบของสะอาด และหลังพักทุกครั้ง",zh:"每次收台后、接触洁净物品前以及每次休息后都要洗手。"}},
{i:"hyg-n6",c:"hyg",d:-1,w:W.s,t:{de:"Verschmutztes oder beschädigtes Material an den Gast gegeben",en:"Soiled or damaged item given to the guest",th:"ส่งภาชนะที่สกปรกหรือชำรุดให้แขก",zh:"把有污渍或破损的器皿给了客人"},a:{de:"Kontrollier Glas, Teller und Besteck im Gegenlicht, bevor du eindeckst oder servierst.",en:"Check glasses, plates and cutlery against the light before laying up or serving.",th:"ตรวจแก้ว จาน และช้อนส้อมโดยส่องกับแสงก่อนจัดโต๊ะหรือเสิร์ฟ",zh:"摆台或上菜前对光检查玻璃杯、餐盘和餐具。"}},
{i:"hyg-ko",c:"hyg",d:-1,w:0,ko:true,t:{de:"Grober Hygiene- oder HACCP-Verstoss (Hygiene = 1.0)",en:"Serious hygiene or HACCP breach (Hygiene = 1.0)",th:"ละเมิดสุขอนามัยหรือ HACCP อย่างร้ายแรง (สุขอนามัย = 1.0)",zh:"严重违反卫生或 HACCP 规定（卫生记 1.00）"},a:{de:"Hol bei jeder Unsicherheit zu Temperatur, Haltbarkeit oder Allergenen vor dem Servieren die Bestätigung der Fachlehrperson.",en:"Whenever you are unsure about temperature, shelf life or allergens, get confirmation from the lecturer before serving.",th:"เมื่อไม่แน่ใจเรื่องอุณหภูมิ อายุการเก็บ หรือสารก่อภูมิแพ้ ให้ขอการยืนยันจากอาจารย์ก่อนเสิร์ฟ",zh:"对温度、保质期或过敏原有任何不确定时，上菜前先向授课教师确认。"}},
{i:"hyg-ko2",c:"hyg",d:-1,w:0,ko:true,t:{de:"Wiederholter vermeidbarer Uniform- oder Erscheinungsbildverstoss (Hygiene = 1.0)",en:"Repeated avoidable breach of uniform or grooming rules (Hygiene = 1.0)",th:"ละเมิดระเบียบชุดหรือบุคลิกภาพซ้ำโดยหลีกเลี่ยงได้ (สุขอนามัย = 1.0)",zh:"重复出现本可避免的制服或仪容违规（卫生记 1.00）"},a:{de:"Notier den Hinweis und kontrollier den betroffenen Punkt am Folgetag aktiv vor dem Briefing.",en:"Write the feedback down and actively check that point before the next day's briefing.",th:"จดคำแนะนำไว้ และตรวจจุดนั้นก่อนบรีฟในวันถัดไป",zh:"把提醒记下来，第二天简报前主动检查该项。"}},

/* MISE EN PLACE UND ORGANISATION */
{i:"mep-p1",c:"mep",d:1,w:W.m,t:{de:"Station vor Serviceanfang vollständig vorbereitet und kontrolliert",en:"Station fully prepared and checked before service",th:"เตรียมสเตชันครบถ้วนและตรวจสอบก่อนเริ่มบริการ",zh:"服务开始前工作台准备完整并已检查"}},
{i:"mep-p2",c:"mep",d:1,w:W.m,t:{de:"Eingedeckt exakt nach Standard (Abstände, Ausrichtung, Symmetrie)",en:"Laid up exactly to standard (spacing, alignment, symmetry)",th:"จัดโต๊ะตรงตามมาตรฐาน (ระยะ แนว ความสมมาตร)",zh:"严格按标准摆台（间距、对齐、对称）"}},
{i:"mep-p3",c:"mep",d:1,w:W.l,t:{de:"Nachschub selbständig ergänzt, bevor etwas ausging",en:"Replenished supplies independently before anything ran out",th:"เติมของใช้ด้วยตนเองก่อนของจะหมด",zh:"在物品用尽前主动补充"}},
{i:"mep-p4",c:"mep",d:1,w:W.m,t:{de:"Abschlussarbeiten vollständig und fristgerecht erledigt",en:"Closing duties completed fully and on time",th:"ทำงานปิดร้านครบถ้วนและตรงเวลา",zh:"收尾工作完整且按时完成"}},
{i:"mep-n1",c:"mep",d:-1,w:W.m,t:{de:"Mise en Place bei Serviceanfang unvollständig",en:"Mise en place incomplete at the start of service",th:"มีซ็องปลัสไม่ครบเมื่อเริ่มบริการ",zh:"开餐时准备工作不完整"},a:{de:"Arbeite mit einer festen Checkliste für deine Station und hak sie 15 Minuten vor Serviceanfang ab.",en:"Use a fixed checklist for your station and tick it off 15 minutes before service starts.",th:"ใช้เช็กลิสต์ประจำสเตชัน และตรวจให้ครบ 15 นาทีก่อนเริ่มบริการ",zh:"为你的工作台制定固定检查表，并在开餐前 15 分钟逐项核对。"}},
{i:"mep-n2",c:"mep",d:-1,w:W.l,t:{de:"Eindecken ungenau (Abstände, Ausrichtung, Logo)",en:"Table laid inaccurately (spacing, alignment, logo)",th:"จัดโต๊ะไม่เรียบร้อย (ระยะ แนว โลโก้)",zh:"摆台不精确（间距、对齐、标志方向）"},a:{de:"Kontrollier den Tisch am Schluss aus Gastperspektive, indem du dich einmal hinsetzt.",en:"Check the finished table from the guest's perspective by sitting down once.",th:"ตรวจโต๊ะที่จัดเสร็จจากมุมมองแขก โดยลองนั่งลงสักครั้ง",zh:"摆好后坐下一次，从客人视角检查整张桌子。"}},
{i:"mep-n3",c:"mep",d:-1,w:W.m,t:{de:"Während des Service ging Material aus, kein Nachschub vorbereitet",en:"Ran out of items during service, no replenishment prepared",th:"ของหมดระหว่างบริการ ไม่ได้เตรียมของเติม",zh:"服务中物品用尽，未备补给"},a:{de:"Leg für die kritischen Artikel eine Mindestmenge fest und füll nach jedem Gang auf.",en:"Define a minimum stock for the critical items and top up after every course.",th:"กำหนดจำนวนขั้นต่ำสำหรับของสำคัญ และเติมหลังเสิร์ฟทุกคอร์ส",zh:"为关键物品设定最低存量，每道菜后补充一次。"}},
{i:"mep-n4",c:"mep",d:-1,w:W.m,t:{de:"Abschlussarbeiten unvollständig oder an andere abgegeben",en:"Closing duties incomplete or handed to others",th:"งานปิดร้านไม่ครบ หรือโยนให้ผู้อื่น",zh:"收尾工作未完成或推给他人"},a:{de:"Teilt die Abschlussarbeiten zu Beginn im Team auf und meld dich erst ab, wenn dein Teil kontrolliert ist.",en:"Divide the closing duties in the team at the start and only sign off once your part has been checked.",th:"แบ่งงานปิดร้านกันตั้งแต่ต้น และเลิกงานเมื่อส่วนของคุณถูกตรวจแล้วเท่านั้น",zh:"开工时就在团队内分配收尾任务，自己那部分经检查后才下班。"}},
{i:"mep-n7",c:"mep",d:-1,w:W.s,t:{de:"Station am Serviceende nicht betriebsbereit hinterlassen",en:"Station not left ready for operation at the end of service",th:"ไม่ส่งมอบสเตชันในสภาพพร้อมใช้งานเมื่อจบบริการ",zh:"服务结束时工作台未处于可运营状态"},a:{de:"Kontrollier am Schluss anhand der Checkliste, ob die Station für die nächste Schicht startklar ist.",en:"Use the checklist at the end to confirm the station is ready for the next shift.",th:"ใช้เช็กลิสต์ตอนจบงานเพื่อยืนยันว่าสเตชันพร้อมสำหรับกะถัดไป",zh:"结束时按检查表确认工作台已为下一班做好准备。"}},

/* ARBEITSTECHNIK SERVICE */
{i:"tec-p1",c:"tec",d:1,w:W.m,t:{de:"Tragetechnik sicher und korrekt (Teller, Tablett, Gläser)",en:"Carrying technique safe and correct (plates, tray, glasses)",th:"เทคนิคการถือปลอดภัยและถูกต้อง (จาน ถาด แก้ว)",zh:"端托技术安全规范（餐盘、托盘、酒杯）"}},
{i:"tec-p2",c:"tec",d:1,w:W.m,t:{de:"Servier- und Aushebeseite nach Hausstandard eingehalten",en:"Served and cleared from the correct side per house standard",th:"เสิร์ฟและเก็บจานตามด้านที่ถูกต้องตามมาตรฐานร้าน",zh:"按本店标准从正确一侧上菜和收台"}},
{i:"tec-p3",c:"tec",d:1,w:W.m,t:{de:"Getränkeservice fachgerecht (Glaswahl, Temperatur, Einschenkmenge, Flaschenhaltung)",en:"Beverage service professional (glass, temperature, pouring quantity, bottle handling)",th:"บริการเครื่องดื่มอย่างมืออาชีพ (เลือกแก้ว อุณหภูมิ ปริมาณริน การจับขวด)",zh:"饮品服务专业（选杯、温度、斟倒量、持瓶）"}},
{i:"tec-p4",c:"tec",d:1,w:W.s,t:{de:"Arbeit am Gast sicher ausgeführt (Tranchieren, Filetieren, Flambieren, Dekantieren)",en:"Guéridon work performed confidently (carving, filleting, flambéing, decanting)",th:"ทำงานหน้าแขกได้อย่างมั่นใจ (แล่ ตัด ฟลามเบ้ เดคานต์)",zh:"桌边操作稳健（分切、剔骨、火焰烹调、醒酒）"}},
{i:"tec-p5",c:"tec",d:1,w:W.m,t:{de:"Weinservice vollständig nach Standard (Präsentation, Degustation, Reihenfolge)",en:"Wine service complete to standard (presentation, tasting, order of service)",th:"บริการไวน์ครบตามมาตรฐาน (นำเสนอ ชิม ลำดับการเสิร์ฟ)",zh:"葡萄酒服务符合标准（示瓶、品鉴、顺序）"}},
{i:"tec-n1",c:"tec",d:-1,w:W.m,t:{de:"Unsichere Tragetechnik, Gefahr für Gast oder Material",en:"Unsafe carrying technique, risk to guests or material",th:"เทคนิคการถือไม่มั่นคง เสี่ยงต่อแขกหรือภาชนะ",zh:"端托不稳，存在伤及客人或损坏器皿的风险"},a:{de:"Üb die Tragetechnik mit leerem Geschirr ausserhalb der Servicezeit, bis der Griff sitzt.",en:"Practise carrying with empty crockery outside service hours until the grip is secure.",th:"ฝึกถือด้วยภาชนะเปล่านอกเวลาบริการจนกว่าจะจับได้มั่นคง",zh:"在非服务时段用空餐具练习，直到手法稳固。"}},
{i:"tec-n2",c:"tec",d:-1,w:W.l,t:{de:"Servier- oder Aushebeseite nicht eingehalten",en:"Served or cleared from the wrong side",th:"เสิร์ฟหรือเก็บจานผิดด้าน",zh:"上菜或收台的方位不符规定"},a:{de:"Halt dich an den Hausstandard und frag im Briefing nach, sobald du unsicher bist.",en:"Follow the house standard and ask during the briefing as soon as you are unsure.",th:"ยึดตามมาตรฐานของร้าน และถามในช่วงบรีฟทันทีที่ไม่แน่ใจ",zh:"遵循本店标准，一有不确定就在简报时提问。"}},
{i:"tec-n3",c:"tec",d:-1,w:W.m,t:{de:"Getränkeservice fehlerhaft (Glaswahl, Temperatur, Menge)",en:"Beverage service faulty (glass, temperature, quantity)",th:"บริการเครื่องดื่มผิดพลาด (แก้ว อุณหภูมิ ปริมาณ)",zh:"饮品服务有误（选杯、温度、分量）"},a:{de:"Kontrollier vor dem Ausschenken Glas, Temperatur und Menge anhand der Getränkekarte.",en:"Check glass, temperature and quantity against the drinks list before pouring.",th:"ตรวจแก้ว อุณหภูมิ และปริมาณตามรายการเครื่องดื่มก่อนริน",zh:"斟倒前对照酒水单核对杯型、温度和分量。"}},
{i:"tec-n4",c:"tec",d:-1,w:W.s,t:{de:"Arbeit am Gast abgebrochen oder misslungen, Gast musste warten",en:"Guéridon work abandoned or failed, the guest had to wait",th:"งานหน้าแขกทำไม่สำเร็จหรือต้องยกเลิก แขกต้องรอ",zh:"桌边操作中断或失败，客人被迫等待"},a:{de:"Üb die Arbeit am Gast im Trockenlauf und bereite Material und Ablauf vor dem Gang vollständig vor.",en:"Rehearse the guéridon work dry and prepare material and sequence completely before the course.",th:"ซ้อมงานหน้าแขกแบบไม่ใช้ของจริง และเตรียมอุปกรณ์กับลำดับขั้นให้ครบก่อนเสิร์ฟ",zh:"先做空练，并在上该道菜前把器具和流程准备齐全。"}},
{i:"tec-n6",c:"tec",d:-1,w:W.m,t:{de:"Weinservice unvollständig (keine Präsentation, keine Degustation, falsche Reihenfolge)",en:"Wine service incomplete (no presentation, no tasting, wrong order)",th:"บริการไวน์ไม่ครบ (ไม่นำเสนอ ไม่ให้ชิม ลำดับผิด)",zh:"葡萄酒服务不完整（未示瓶、未品鉴、顺序错误）"},a:{de:"Arbeite den Weinservice anhand der festen Schrittfolge ab und lass dir die Reihenfolge von der Fachlehrperson einmal bestätigen.",en:"Work through the fixed sequence for wine service and have the lecturer confirm the order once.",th:"ทำตามลำดับขั้นบริการไวน์ที่กำหนด และให้อาจารย์ยืนยันลำดับสักครั้ง",zh:"按固定步骤完成酒水服务，并请教师确认一次顺序。"}},

/* VERKAUF UND BERATUNG */
{i:"ver-p1",c:"ver",d:1,w:W.m,t:{de:"Menü- und Getränkekenntnisse sicher, Gastfragen kompetent beantwortet",en:"Sound knowledge of menu and drinks, answered guest questions competently",th:"รู้เมนูและเครื่องดื่มดี ตอบคำถามแขกได้อย่างมืออาชีพ",zh:"熟悉菜单与酒水，能称职回答客人提问"}},
{i:"ver-p2",c:"ver",d:1,w:W.m,t:{de:"Aktive Empfehlung ausgesprochen, passend zur Gastsituation",en:"Gave an active recommendation that matched the guest's situation",th:"แนะนำเชิงรุกได้เหมาะกับสถานการณ์ของแขก",zh:"主动给出契合客人情境的推荐"}},
{i:"ver-p3",c:"ver",d:1,w:W.m,t:{de:"Zusatzverkauf gelungen (Apéritif, Wasser, Dessert, Kaffee, Digestif)",en:"Successful upselling (aperitif, water, dessert, coffee, digestif)",th:"ขายเพิ่มได้สำเร็จ (อะเพริทีฟ น้ำ ของหวาน กาแฟ ดิเจสทีฟ)",zh:"成功完成加售（餐前酒、水、甜点、咖啡、餐后酒）"}},
{i:"ver-p4",c:"ver",d:1,w:W.m,t:{de:"Passende Weinbegleitung zum Gericht vorgeschlagen",en:"Suggested a fitting wine pairing for the dish",th:"แนะนำไวน์ที่เข้ากับอาหารได้เหมาะสม",zh:"为菜品推荐了合适的配酒"}},
{i:"ver-n1",c:"ver",d:-1,w:W.m,t:{de:"Frage zu Speisen oder Getränken nicht beantwortet und nicht abgeklärt",en:"Question about food or drinks left unanswered and not clarified",th:"ไม่ตอบคำถามเรื่องอาหารหรือเครื่องดื่ม และไม่ไปสอบถามให้ชัด",zh:"对菜品或酒水的提问未作答也未去核实"},a:{de:"Lies die Karte vor dem Service durch und notier dir drei Fragen, die du im Briefing klären willst.",en:"Read the menu before service and note three questions to clarify during the briefing.",th:"อ่านเมนูก่อนเริ่มบริการ และจดคำถามสามข้อไว้ถามในช่วงบรีฟ",zh:"开餐前通读菜单，记下三个问题在简报时澄清。"}},
{i:"ver-n2",c:"ver",d:-1,w:W.l,t:{de:"Keine Empfehlung ausgesprochen, obwohl die Situation es anbot",en:"No recommendation given although the situation invited one",th:"ไม่ได้แนะนำอะไรเลย ทั้งที่สถานการณ์เอื้อ",zh:"情境适合推荐却未开口"},a:{de:"Leg dir pro Gang eine Empfehlung zurecht und sprich sie aktiv an.",en:"Prepare one recommendation per course and offer it actively.",th:"เตรียมคำแนะนำไว้หนึ่งอย่างต่อหนึ่งคอร์ส และเสนอเชิงรุก",zh:"为每道菜准备一个推荐，并主动提出。"}},
{i:"ver-n4",c:"ver",d:-1,w:W.m,t:{de:"Falsche Angaben zu Speisen, Getränken oder Preisen gemacht",en:"Gave incorrect information on dishes, drinks or prices",th:"ให้ข้อมูลอาหาร เครื่องดื่ม หรือราคาผิด",zh:"对菜品、酒水或价格提供了错误信息"},a:{de:"Sag offen, dass du nachfragst, und hol die Information, statt zu schätzen.",en:"Say openly that you will check, and get the information instead of guessing.",th:"บอกแขกตรง ๆ ว่าจะไปตรวจสอบ แล้วไปหาข้อมูลจริง อย่าเดา",zh:"坦率告知客人你去确认，然后取得准确信息，不要靠猜。"}},
{i:"ver-n7",c:"ver",d:-1,w:W.m,t:{de:"Allergenfrage des Gastes ohne Abklärung beantwortet",en:"Answered an allergen question without checking",th:"ตอบคำถามเรื่องสารก่อภูมิแพ้โดยไม่ตรวจสอบ",zh:"未经核实就回答过敏原问题"},a:{de:"Klär jede Allergenfrage in der Küche ab und gib die Antwort erst danach weiter.",en:"Clarify every allergen question with the kitchen and pass on the answer only afterwards.",th:"สอบถามเรื่องสารก่อภูมิแพ้กับครัวทุกครั้ง แล้วจึงแจ้งคำตอบแก่แขก",zh:"所有过敏原问题都先与厨房核实，之后再答复客人。"}},

/* TEAMFAEHIGKEIT */
{i:"tea-lt",c:"tea",d:-1,w:W.m,t:{de:"Verspätet zum Dienst erschienen",en:"Arrived late for the shift",th:"มาทำงานสาย",zh:"上班迟到"},a:{de:"Plane den Arbeitsweg mit zehn Minuten Reserve und melde eine absehbare Verspätung vorher.",en:"Plan your journey with ten minutes to spare and report a foreseeable delay in advance.",th:"เผื่อเวลาเดินทางสิบนาที และแจ้งล่วงหน้าหากคาดว่าจะมาสาย",zh:"通勤预留十分钟，可预见的迟到请提前通知。"}},
{i:"tea-p1",c:"tea",d:1,w:W.m,t:{de:"Kolleginnen und Kollegen aktiv unterstützt, ohne dazu aufgefordert zu werden",en:"Actively supported colleagues without being asked",th:"ช่วยเหลือเพื่อนร่วมงานเชิงรุกโดยไม่ต้องมีใครบอก",zh:"无需提醒主动支援同事"}},
{i:"tea-p2",c:"tea",d:1,w:W.l,t:{de:"Informationen zuverlässig weitergegeben (Bestellungen, Gastwünsche, Änderungen)",en:"Passed on information reliably (orders, guest requests, changes)",th:"ส่งต่อข้อมูลได้ครบถ้วน (ออเดอร์ ความต้องการของแขก การเปลี่ยนแปลง)",zh:"可靠地传递信息（点单、客人要求、变更）"}},
{i:"tea-p3",c:"tea",d:1,w:W.m,t:{de:"Absprache mit der Küche klar und rechtzeitig",en:"Coordination with the kitchen clear and timely",th:"ประสานงานกับครัวชัดเจนและทันเวลา",zh:"与厨房沟通清晰且及时"}},
{i:"tea-p5",c:"tea",d:1,w:W.m,t:{de:"In hektischen Phasen ruhig und ausgleichend gewirkt",en:"Stayed calm and steadying during busy phases",th:"ช่วยให้ทีมสงบและสมดุลในช่วงเร่งด่วน",zh:"在繁忙时段保持冷静并稳定团队"}},
{i:"tea-n1",c:"tea",d:-1,w:W.m,t:{de:"Nur die eigene Station betreut, Kollegen im Stress stehen gelassen",en:"Looked after own station only, left colleagues under pressure",th:"ดูแลแต่สเตชันของตัวเอง ปล่อยเพื่อนร่วมงานรับภาระ",zh:"只顾自己的区域，任由同事忙不过来"},a:{de:"Schau nach jedem Gang kurz ins Nachbarrevier und biete konkret Hilfe an.",en:"Glance into the neighbouring station after every course and offer concrete help.",th:"หลังเสิร์ฟแต่ละคอร์ส ให้มองไปที่โซนข้างเคียงและเสนอความช่วยเหลือที่ชัดเจน",zh:"每道菜后看一眼邻区，并提出具体的帮忙。"}},
{i:"tea-n2",c:"tea",d:-1,w:W.m,t:{de:"Wichtige Information nicht weitergegeben (Gastwunsch, Änderung, Reklamation)",en:"Important information not passed on (guest request, change, complaint)",th:"ไม่ส่งต่อข้อมูลสำคัญ (ความต้องการของแขก การเปลี่ยนแปลง ข้อร้องเรียน)",zh:"未传递重要信息（客人要求、变更、投诉）"},a:{de:"Gib jede Information sofort weiter und lass sie dir kurz bestätigen.",en:"Pass on every piece of information immediately and have it confirmed briefly.",th:"ส่งต่อข้อมูลทุกอย่างทันที และขอการยืนยันสั้น ๆ",zh:"任何信息都立即传递，并请对方简短确认。"}},
{i:"tea-n4",c:"tea",d:-1,w:W.m,t:{de:"Kritik abgewehrt oder ignoriert",en:"Rejected or ignored feedback",th:"ปฏิเสธหรือเพิกเฉยต่อคำติชม",zh:"抗拒或无视批评意见"},a:{de:"Nimm den Hinweis zuerst entgegen, wiederhol ihn in eigenen Worten und setz ihn im nächsten Gang um.",en:"Accept the feedback first, repeat it in your own words and apply it in the next course.",th:"รับฟังก่อน ทวนด้วยคำพูดของตัวเอง แล้วนำไปใช้ในคอร์สถัดไป",zh:"先接受意见，用自己的话复述一遍，并在下一道菜中落实。"}},
{i:"tea-n5",c:"tea",d:-1,w:W.m,t:{de:"Konflikt im Team im Gastbereich ausgetragen",en:"Team conflict carried out in the guest area",th:"ทะเลาะกันในทีมต่อหน้าแขก",zh:"在客区内发生团队冲突"},a:{de:"Verschieb Klärungen ins Office und bitte die Serviceleitung um Unterstützung.",en:"Move disagreements to the back office and ask the service manager for support.",th:"ย้ายการพูดคุยไปที่ห้องหลังร้าน และขอความช่วยเหลือจากหัวหน้าแผนก",zh:"把争议移到后场处理，并请服务主管协助。"}},

/* SELBSTAENDIGKEIT */
{i:"sel-p1",c:"sel",d:1,w:W.m,t:{de:"Aufgaben selbständig erkannt und übernommen, ohne Anweisung",en:"Identified and took on tasks independently, without instruction",th:"มองเห็นงานและลงมือทำเองโดยไม่ต้องสั่ง",zh:"无需指示即发现并承担任务"}},
{i:"sel-p2",c:"sel",d:1,w:W.m,t:{de:"Im Rahmen der Kompetenz eigenständig entschieden und richtig gelegen",en:"Decided independently within their remit and got it right",th:"ตัดสินใจเองภายในขอบเขตหน้าที่ และตัดสินใจถูก",zh:"在职权范围内自主决策且判断正确"}},
{i:"sel-p3",c:"sel",d:1,w:W.l,t:{de:"Bei Unsicherheit gezielt nachgefragt, statt zu raten",en:"Asked specific questions when unsure instead of guessing",th:"เมื่อไม่แน่ใจก็ถามอย่างตรงประเด็นแทนการเดา",zh:"不确定时具体提问，而非凭猜"}},
{i:"sel-p4",c:"sel",d:1,w:W.m,t:{de:"Eigenen Fehler selbst erkannt, gemeldet und korrigiert",en:"Recognised, reported and corrected their own mistake",th:"รู้ตัวว่าทำผิด แจ้ง และแก้ไขด้วยตนเอง",zh:"自行发现、上报并纠正了自己的错误"}},
{i:"sel-n1",c:"sel",d:-1,w:W.m,t:{de:"Auf Anweisung gewartet, obwohl die Arbeit offensichtlich war",en:"Waited for instructions although the work was obvious",th:"รอคำสั่งทั้งที่งานเห็นได้ชัด",zh:"工作显而易见却仍等待指示"},a:{de:"Leg dir für Leerläufe drei Standardaufgaben zurecht, die du ohne Rückfrage übernehmen kannst.",en:"Define three standard tasks you can take on without asking whenever there is a lull.",th:"กำหนดงานมาตรฐานสามอย่างที่ทำได้เองเมื่อว่าง โดยไม่ต้องถาม",zh:"为空档期准备三项无需请示即可承担的常规任务。"}},
{i:"sel-n2",c:"sel",d:-1,w:W.m,t:{de:"Dieselbe Anweisung mehrfach gebraucht",en:"Needed the same instruction repeatedly",th:"ต้องได้รับคำสั่งเดิมซ้ำหลายครั้ง",zh:"同一指令需反复交代"},a:{de:"Notier dir Anweisungen sofort und kontrollier am Ende der Schicht, was du davon umgesetzt hast.",en:"Write instructions down immediately and check at the end of the shift what you have applied.",th:"จดคำสั่งทันที และตรวจดูตอนจบกะว่าทำไปแล้วเท่าไร",zh:"立即记下指令，下班前检查自己落实了哪些。"}},
{i:"sel-n3",c:"sel",d:-1,w:W.l,t:{de:"Bei Unsicherheit geraten, statt nachzufragen",en:"Guessed when unsure instead of asking",th:"เดาเมื่อไม่แน่ใจแทนที่จะถาม",zh:"不确定时靠猜而不提问"},a:{de:"Frag lieber einmal zu viel nach: eine Rückfrage kostet Sekunden, ein Fehler am Gast kostet den Gang.",en:"Better to ask once too often: a question costs seconds, a mistake at the table costs the whole course.",th:"ถามเกินไว้ดีกว่า: คำถามใช้เวลาไม่กี่วินาที แต่ความผิดพลาดต่อหน้าแขกเสียทั้งคอร์ส",zh:"宁可多问一次：提问只需几秒，失误却要赔上整道菜。"}},
{i:"sel-n4",c:"sel",d:-1,w:W.m,t:{de:"Eigenen Fehler nicht gemeldet",en:"Did not report their own mistake",th:"ไม่แจ้งความผิดพลาดของตนเอง",zh:"未主动上报自己的失误"},a:{de:"Meld Fehler sofort selbst, damit sie behoben sind, bevor der Gast sie bemerkt.",en:"Report mistakes yourself straight away so they can be fixed before the guest notices.",th:"แจ้งความผิดพลาดด้วยตนเองทันที เพื่อแก้ไขก่อนที่แขกจะสังเกตเห็น",zh:"失误立即自行上报，以便在客人察觉前补救。"}},

/* MOTIVATION */
{i:"mot-p1",c:"mot",d:1,w:W.m,t:{de:"Über die ganze Schicht aktiv mitgearbeitet und Einsatz gezeigt",en:"Worked actively and showed commitment throughout the shift",th:"ทำงานอย่างกระตือรือร้นและทุ่มเทตลอดกะ",zh:"整个班次积极投入、表现出干劲"}},
{i:"mot-p2",c:"mot",d:1,w:W.l,t:{de:"Von sich aus gefragt, was zu tun ist",en:"Asked of their own accord what needed doing",th:"ถามเองว่ามีอะไรให้ทำบ้าง",zh:"主动询问还有什么需要做"}},
{i:"mot-p3",c:"mot",d:1,w:W.m,t:{de:"Fachliches Interesse gezeigt, Fragen zum Fach gestellt",en:"Showed professional interest, asked technical questions",th:"แสดงความสนใจในวิชาชีพ ตั้งคำถามเชิงเทคนิค",zh:"表现出专业兴趣，提出业务问题"}},
{i:"mot-p5",c:"mot",d:1,w:W.m,t:{de:"Zusätzliche Aufgaben freiwillig übernommen",en:"Volunteered for additional tasks",th:"อาสารับงานเพิ่มเติม",zh:"自愿承担额外任务"}},
{i:"mot-n1",c:"mot",d:-1,w:W.m,t:{de:"Privates Handy im Arbeitsbereich benutzt",en:"Used a private mobile phone in the work area",th:"ใช้โทรศัพท์ส่วนตัวในพื้นที่ทำงาน",zh:"在工作区使用私人手机"},a:{de:"Lass das Handy während der Schicht im Spind; für Notfälle ist die Serviceleitung erreichbar.",en:"Leave your phone in the locker during the shift; the service manager is reachable for emergencies.",th:"เก็บโทรศัพท์ไว้ในล็อกเกอร์ระหว่างกะ กรณีฉุกเฉินติดต่อผ่านหัวหน้าแผนกได้",zh:"当班时把手机放在更衣柜；紧急情况可通过服务主管联系。"}},
{i:"mot-n2",c:"mot",d:-1,w:W.m,t:{de:"Sich der Arbeit entzogen (Rückzug ins Office, verlängerte Pausen)",en:"Avoided work (retreating to the back office, extended breaks)",th:"หลีกเลี่ยงงาน (หลบไปหลังร้าน พักนานเกิน)",zh:"回避工作（躲进后场、延长休息）"},a:{de:"Meld dich ab, wenn du den Gastbereich verlässt, und nenn Grund und Dauer.",en:"Sign off when you leave the guest area and state the reason and how long you will be.",th:"แจ้งทุกครั้งที่ออกจากพื้นที่บริการ พร้อมบอกเหตุผลและระยะเวลา",zh:"离开客区时先报备，并说明原因和时长。"}},
{i:"mot-n3",c:"mot",d:-1,w:W.l,t:{de:"Anderen zugesehen, statt mitzuarbeiten",en:"Watched others instead of joining in",th:"ยืนดูคนอื่นทำงานแทนที่จะลงมือช่วย",zh:"旁观他人而非动手参与"},a:{de:"Schliess dich bei Unsicherheit einer laufenden Arbeit an, statt zu beobachten.",en:"When unsure, join an ongoing task rather than watching.",th:"เมื่อไม่แน่ใจ ให้เข้าไปช่วยงานที่กำลังทำอยู่ แทนการยืนดู",zh:"不确定时加入正在进行的工作，而不是站着看。"}},

/* Jede Kopie der Datei bekommt einen eigenen Speicher, abgeleitet vom Dateinamen.
   Sonst teilen sich mehrere lokal geöffnete Rapporte denselben Browserspeicher. */
const FILEID = (function(){
  try{
    const n = decodeURIComponent((location.pathname||"").split("/").pop()||"").replace(/\.html?$/i,"");
    if(!n) return "";
    let h = 0; for(let i=0;i<n.length;i++){ h = (h*31 + n.charCodeAt(i)) >>> 0; }
    return "." + h.toString(36);
  }catch(e){ return ""; }
})();

/* Einstellungen aus einer fremden oder alten Datei pruefen, bevor damit gerechnet wird.
   Eine Basisnote als Text oder eine Wochentagsliste als Zeichenkette haben frueher
   den Reiter Eintragen lahmgelegt und stillschweigend NaN-Noten erzeugt. */
function sanitizeSettings(s){
  const o = {...DEF, ...(s || {})};
  const bs = parseFloat(o.base);
  o.base = (isFinite(bs) && bs >= 1 && bs <= 6) ? bs : DEF.base;
  const gueltig = WDAYS.map(w => w.k);
  o.weekdays = Array.isArray(o.weekdays) ? o.weekdays.filter(k => gueltig.indexOf(k) >= 0) : [];
  if(!o.weekdays.length) o.weekdays = DEF.weekdays.slice();
  const ix = parseInt(o.startIdx, 10);
  o.startIdx = (isFinite(ix) && ix >= 0 && ix < o.weekdays.length) ? ix : 0;
  o.gas2 = !!o.gas2;
  o.hideBanner = !!o.hideBanner;
  if(!T[o.uiLang]) o.uiLang = "de";
  if(!OUT_LANGS.some(x => x.code === o.outLang)) o.outLang = "de";
  if(typeof o.customLangs !== "object" || !o.customLangs) o.customLangs = {};
  ["group","team","outlet","teacher"].forEach(k=>{ o[k] = String(o[k] == null ? "" : o[k]); });
  return o;
}
/* Nachname und Vorname aus einem alten einteiligen Namen ableiten: letztes Wort = Vorname.
   Nur fuer Altdaten; neu werden beide Felder getrennt erfasst. */
function splitName(voll){
  const teile = String(voll || "").trim().split(/\s+/).filter(Boolean);
  if(teile.length < 2) return {nachname: teile[0] || "", vorname: ""};
  return {nachname: teile.slice(0, -1).join(" "), vorname: teile[teile.length - 1]};
}
/* Klasse und Gruppe am Inhalt erkennen, in Kueche und Service gleich.
   Klasse: HFD, HFE1, HFE2 (auch "HFe 1"); alte Werte wie HFE bleiben gueltig.
   Gruppe: "Gruppe 1", "Team 2", auch "Grp 1" oder "Group 1".               */
function erkenneKlasse(v){
  const m = String(v || "").trim().match(/^hf\s*([a-z])\s*(\d?)$/i);
  return m ? ("HF" + m[1] + m[2]).toUpperCase() : "";
}
function erkenneGruppe(v){
  const m = String(v || "").trim().match(/^(gruppe|grp|group|team)\s*(\d+)$/i);
  return m ? ((/^t/i.test(m[1]) ? "Team " : "Gruppe ") + m[2]) : "";
}
/* Klasse und Gruppe pro Person; leer = Vorgabe aus der Kopfzeile (wie im Kuechenrapport). */
const klasseOf = s => (s && s.klasse) || S.settings.group || "";
const gruppeOf = s => (s && s.gruppe) || S.settings.team  || "";
/* Anzeigename wie bisher: Nachname zuerst, dann Vorname. */
function anzeigeName(s){ return [s.nachname, s.vorname].filter(Boolean).join(" ") || s.name || ""; }
/* Eine Zeile der Studierendenliste zerlegen. Reihenfolge: Nachname; Vorname; Nickname;
   E-Mail; Sprache. E-Mail und Sprache werden am Inhalt erkannt, damit auch die alte
   Schreibweise "Ammann Lea; mail; de" noch richtig gelesen wird. */
function parseStudentZeile(line){
  const roh = String(line || "").split(/[;\t]/).map(x=>x.trim());
  let mail = "", lang = "", klasse = "", gruppe = "";
  const rest = [];
  roh.forEach(x=>{
    if(!x) return;
    if(!mail && x.indexOf("@") >= 0){ mail = x; return; }
    if(!klasse && erkenneKlasse(x)){ klasse = erkenneKlasse(x); return; }
    if(!gruppe && erkenneGruppe(x)){ gruppe = erkenneGruppe(x); return; }
    const lg = x.toLowerCase();
    if(!lang && OUT_LANGS.some(o=>o.code === lg) && x.length <= 3){ lang = lg; return; }
    rest.push(x);
  });
  let nachname = rest[0] || "", vorname = rest[1] || "", nick = rest[2] || "";
  if(nachname && !vorname){                    /* alte einteilige Schreibweise */
    const g = splitName(nachname); nachname = g.nachname; vorname = g.vorname;
  }
  if(!nachname && !vorname) return null;
  return {nachname, vorname, nick, mail, lang, klasse, gruppe};
}
function studentZeile(s){
  return [s.nachname || "", s.vorname || "", s.nick || "", s.mail || "", s.lang || "",
          s.klasse || "", s.gruppe || ""]
    .filter((x,i)=> i < 2 || x).join("; ");
}

/* Nur Personen mit Namen uebernehmen und alle Felder auf saubere Zeichenketten bringen.
   name bleibt der Anzeigename, damit Tabellen, Berichte und Druckvorlagen unveraendert laufen. */
function saubereStudierende(list){
  return (Array.isArray(list) ? list : [])
    .map(s => {
      if(!s) return null;
      let nach = String(s.nachname == null ? "" : s.nachname).trim();
      let vor  = String(s.vorname  == null ? "" : s.vorname ).trim();
      if(!nach && !vor){                       /* Altdatensatz mit einem Namensfeld */
        const g = splitName(s.name); nach = g.nachname; vor = g.vorname;
      }
      if(!nach && !vor) return null;
      const o = {
        id:       String(s.id || ("s" + Math.random().toString(36).slice(2,8))),
        nachname: nach,
        vorname:  vor,
        nick:     String(s.nick == null ? "" : s.nick).trim(),
        mail:     String(s.mail || "").trim(),
        lang:     OUT_LANGS.some(x => x.code === s.lang) ? s.lang : "",
        klasse:   erkenneKlasse(s.klasse) || String(s.klasse || "").trim(),
        gruppe:   erkenneGruppe(s.gruppe) || String(s.gruppe || "").trim()
      };
      /* Noten 2.0: Studierendennummer, Foto und Wechselplan aus dem Cockpit mitnehmen */
      if(s.nr) o.nr = String(s.nr).trim();
      if(typeof s.foto === "string" && s.foto.indexOf("data:image/") === 0) o.foto = s.foto;
      if(s.wechselAb && s.wechselOutlet){ o.wechselAb = parseInt(s.wechselAb, 10) || 0; o.wechselOutlet = String(s.wechselOutlet); }
      o.name = anzeigeName(o);
      return o;
    })
    .filter(Boolean);
}

/* ---- Turnus-Slots ---- */
function slots(){
  const wd = (S.settings.weekdays && S.settings.weekdays.length) ? S.settings.weekdays : ["mo","tu","we","th"];
  const n  = SLOT_COUNT;
  const st = Math.max(0, Math.min(S.settings.startIdx||0, wd.length-1));
  const out = [];
  for(let i=0;i<n;i++){
    const j = st + i;
    out.push({id:"d"+String(i+1).padStart(2,"0"), wd:wd[j % wd.length], week:Math.floor(j/wd.length)+1,
              idx:i+1, exam: HAS_EXAM && i === n-1});
  }
  return out;
}
function slotLabel(s, lg){
  const L2 = lg || S.settings.uiLang;
  if(s.exam) return tOut("examDay", L2);
  return (L2 === "zh") ? ("第" + s.week + "周 " + wdName(s.wd, L2))
                       : (wdName(s.wd, L2) + " " + s.week);
}
const slotById = id => slots().find(s=>s.id===id) || slots()[0];
const examSlot = () => slots().find(s=>s.exam) || null;
const gradedSlots = () => slots().filter(s=>!s.exam);

let view = "day";
let curSlot = (function(){
  const all = slots();
  const nextOpen = all.find(s=>!s.exam && !S.days[s.id]);
  if(nextOpen) return nextOpen.id;
  const filled = all.filter(s=>S.days[s.id]);
  return (filled.length ? filled[filled.length-1] : all[0]).id;
})();
const repMode = "all";   // Auswertung immer über den ganzen Turnus

const dayOpen = id => !!S.days[id];
function openSlot(id){
  S.days[id] = S.days[id] || {};
  S.students.forEach(s=>{
    if(!S.days[id][s.id]){
      S.days[id][s.id] = {att:"present", obs:[], note:null};
      const vo = planOutlet(s, id) || (hasOutlet2() ? prevOutlet(id, s.id) : "");
      if(vo) S.days[id][s.id].outlet = vo;
    }
  });
  const _m = S.dayMeta[id] || {};
  if(!_m.teacher) _m.teacher = S.settings.teacher || "";
  if(!_m.group)   _m.group   = S.settings.group   || "";
  if(!_m.team)    _m.team    = S.settings.team    || "";
  if(!_m.outlet)  _m.outlet  = S.settings.outlet  || "";
  if(!_m.label || !_m.weekday){
    const _sl = slots().find(x=>x.id===id);
    if(_sl){ _m.label = _m.label || slotLabel(_sl); _m.weekday = _m.weekday || _sl.wd; }
  }
  if(!_m.date) _m.date = new Date().toISOString().slice(0,10);
  S.dayMeta[id] = _m;
  persist();
}
function dayRec(id, sid){
  S.days[id] = S.days[id] || {};
  S.days[id][sid] = S.days[id][sid] || {att:"present", obs:[], note:null};
  return S.days[id][sid];
}

/* Foto und Nickname fuer die Erfassung (Noten 2.0). foto ist ein kleines JPEG aus dem Cockpit. */
function avatar(s, size){

  if(s && typeof s.foto === "string" && s.foto.indexOf("data:image/") === 0)
    return el("img",{class:"ava",src:s.foto,alt:"",style:"width:"+px+";height:"+px});
  return null;
}
const nickTag = s => (s && s.nick) ? " «" + s.nick + "»" : "";
const dayMeta = id => (S.dayMeta && S.dayMeta[id]) || {teacher:"", group:"", team:"", outlet:""};
/* ---- Restaurantwechsel: Ort pro Person und Einsatztag ----
   S.settings.outlet = Stammrestaurant, S.settings.outlet2 = zweites Restaurant (freiwillig).
   r.outlet steht im Tagesdatensatz nur, wenn die Person nicht im Stammrestaurant war. */
const hasOutlet2 = () => !!String(S.settings.outlet2 || "").trim();
function outletOfDay(slotId, sid){
  const r = (S.days[slotId] || {})[sid];
  return (r && r.outlet) ? r.outlet : (S.settings.outlet || "");
}
/* Vorgabe fuer einen neuen Tag: Ort des letzten erfassten Tages dieser Person. */
function prevOutlet(slotId, sid){
  const all = slots(); const i = all.findIndex(s => s.id === slotId);
  for(let k = i - 1; k >= 0; k--){ const r = (S.days[all[k].id] || {})[sid]; if(r) return r.outlet || ""; }
  return "";
}
/* Wechselplan aus dem Cockpit: ab Einsatztag n im zweiten Restaurant */
function planOutlet(s, slotId){
  const sl = slots().find(x => x.id === slotId);
  return (s && s.wechselAb && s.wechselOutlet && sl && sl.idx >= s.wechselAb) ? s.wechselOutlet : "";
}
function toggleOutlet(r){
  r.outlet = r.outlet ? "" : String(S.settings.outlet2 || "").trim();
  if(!r.outlet) delete r.outlet;
}
/* Einsatzorte als Text: "Umami (Tag 1–5), Da Fortunat (Tag 6–10)". Leer, wenn die Person
   nur im Stammrestaurant war. lg = Sprache des Textes (de, en, zh, th). */
function placementText(sid, lg){
  const segs = [];
  slots().forEach(sl => {
    const r = (S.days[sl.id] || {})[sid]; if(!r) return;
    const o = r.outlet || S.settings.outlet || "–";
    const last = segs[segs.length - 1];
    if(last && last.o === o) last.to = sl.idx; else segs.push({o: o, from: sl.idx, to: sl.idx});
  });
  if(!segs.length) return "";
  if(segs.length === 1 && segs[0].o === (S.settings.outlet || "–")) return "";
  const rng = g => g.from === g.to ? String(g.from) : (g.from + "–" + g.to);
  const fmtR = g => (lg === "zh") ? ("第" + rng(g) + "天") : (lg === "en") ? ("Day " + rng(g))
                  : (lg === "th") ? ("วันที่ " + rng(g)) : ("Tag " + rng(g));
  return segs.map(g => g.o + " (" + fmtR(g) + ")").join(", ");
}
/* Beim Zusammenfuehren: Tage aus einer Datei mit anderem Stammrestaurant behalten ihren Ort. */
function mitOrt(r, o){
  const src = String((o && o.meta && o.meta.outlet) || (o && o.settings && o.settings.outlet) || "").trim();
  if(r && !r.outlet && src && src !== String(S.settings.outlet || "").trim()) return Object.assign({}, r, {outlet: src});
  return r;
}


/* Halbturnus in die volle Datei einordnen.
   5T liefert 5 Praxistage, 4T liefert 4 Praxistage plus den Exam Day.
   Zusammen ergeben sie genau die 10T-Struktur: 9 Praxistage plus Exam Day. */
let halfMode = "auto";
function mapSlotId(srcVariant, slid){
  if(!srcVariant || srcVariant === VARIANT) return slid;
  if(VARIANT !== "10T") return null;                       // nur die volle Datei nimmt Hälften auf
  const n = parseInt(String(slid).slice(1), 10);
  if(!n) return null;
  const pad = x => "d" + String(x).padStart(2,"0");
  if(srcVariant === "5T"){
    if(n < 1 || n > 5) return null;
    return pad(n + (halfMode === "second" ? 4 : 0));        // erste Hälfte 1-5, zweite 5-9
  }
  if(srcVariant === "4T"){
    if(n === 5) return "d10";                               // Exam Day gehört immer ans Ende
    if(n < 1 || n > 4) return null;
    return pad(n + (halfMode === "first" ? 0 : 5));         // zweite Hälfte 6-9, erste 1-4
  }
  return null;
}
const acceptsVariant = v => !v || v === VARIANT || (VARIANT === "10T" && (v === "4T" || v === "5T"));

/* ---- Notenlogik ---- */
function critGradesForDay(id, sid){
  const r = (S.days[id]||{})[sid];
  if(!r) return null;
  const sl = slots().find(x=>x.id===id);
  const isExam = !!(sl && sl.exam);
  /* Team Market: kein Servicedienst, der Tag zählt fest mit 5.00. */
  if(r.att === "tm"){ const g0 = {}; CRITS.forEach(c=>g0[c.k]=5); return g0; }
  /* Exam Day: jede Abwesenheit ergibt 1.00, unabhängig vom Grund. */
  if(r.att === "excused" && !isExam) return null;
  const g = {};
  if(r.att === "unexcused" || (isExam && r.att === "excused")){ CRITS.forEach(c=>g[c.k]=1); return g; }
  const obs = (r.obs||[]).map(i=>CHIP[i]).filter(Boolean);
  if(r.att === "late" && !obs.some(o=>o.i==="tea-lt")) obs.push(CHIP["tea-lt"]);
  const nt = r.note;
  CRITS.forEach(c=>{
    const mine = obs.filter(o=>o.c===c.k);
    if(mine.some(o=>o.ko)){ g[c.k] = 1; return; }
    let d = 0;
    mine.forEach(o=>{ d += o.d * o.w; });
    if(nt && nt.crit === c.k && nt.dir && nt.w) d += nt.dir * nt.w;
    d = Math.max(CAP_NEG, Math.min(CAP_POS, d));
    g[c.k] = Math.max(1, Math.min(6, S.settings.base + d));
  });
  return g;
}
/* Bewertungszeitraum: der Exam Day zählt nie mit, er wird separat ausgewiesen. */
function slotsInRange(mode){
  const all = gradedSlots();
  if(mode === "all") return all;
  const cur = slotById(curSlot);
  const w = cur.exam ? (all.length ? all[all.length-1].week : 1) : cur.week;
  return all.filter(s=>s.week === w);
}
function dayTotal(id, sid){
  const g = critGradesForDay(id, sid); if(!g) return null;
  let sum = 0, w = 0;
  CRITS.forEach(c=>{ const ww = (c.k==="gas" && S.settings.gas2) ? 2 : 1; sum += g[c.k]*ww; w += ww; });
  return sum/w;
}
function summary(sid, mode){
  const rng = slotsInRange(mode);
  const per = {}; CRITS.forEach(c=>per[c.k]=[]);
  let counted = 0, exc = 0, unx = 0, late = 0, tm = 0;
  const tally = {}, notes = [];
  rng.forEach(sl=>{
    const r = (S.days[sl.id]||{})[sid]; if(!r) return;
    if(r.note && r.note.txt) notes.push({slot:sl, ...r.note});
    if(r.att === "excused"){ exc++; return; }
    if(r.att === "unexcused") unx++;
    if(r.att === "late") late++;
    if(r.att === "tm") tm++;
    (r.obs||[]).forEach(i=>{ tally[i] = (tally[i]||0)+1; });
    const g = critGradesForDay(sl.id, sid); if(!g) return;
    counted++; CRITS.forEach(c=>per[c.k].push(g[c.k]));
  });
  if(!counted) return {counted:0, exc, unx, late, tm, tally, notes, crit:null, total:null};
  const crit = {};
  CRITS.forEach(c=>{ crit[c.k] = per[c.k].reduce((a,b)=>a+b,0)/per[c.k].length; });
  let sum = 0, wsum = 0;
  CRITS.forEach(c=>{ const w = (c.k==="gas" && S.settings.gas2) ? 2 : 1; sum += crit[c.k]*w; wsum += w; });
  return {counted, exc, unx, late, tm, tally, notes, crit, total: sum/wsum};
}
/* Exam Day separat */
function examSummary(sid){
  const sl = examSlot(); if(!sl) return null;
  const r = (S.days[sl.id]||{})[sid]; if(!r) return null;
  const g = critGradesForDay(sl.id, sid);
  return {slot:sl, att:r.att, crit:g, total: g ? dayTotal(sl.id, sid) : null,
          obs:(r.obs||[]).map(i=>CHIP[i]).filter(Boolean), note:r.note||null};
}
/* Schlussnote: zwei Drittel Praxis, ein Drittel Exam Day. */
function finalGrade(praxis, exam){
  if(praxis == null) return exam;
  if(exam == null) return praxis;
  return (2*praxis + exam) / 3;
}
function recordedPeriod(sid, mode, lg){
  const rec = slotsInRange(mode).filter(sl=>(S.days[sl.id]||{})[sid]);
  if(!rec.length) return "–";
  return rec.length===1 ? slotLabel(rec[0], lg)
    : slotLabel(rec[0], lg) + " – " + slotLabel(rec[rec.length-1], lg);
}
const fmt  = g => (g==null ? "–" : g.toFixed(2));
const fmt1 = g => (g==null ? "–" : (Math.round(g*10)/10).toFixed(1));

/* ---- DOM-Helfer ---- */
const el = (tag, attrs={}, kids=[]) => {
  const n = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(v===false||v==null) continue;
    if(k==="class") n.className = v;
    else if(k==="text") n.textContent = v;
    else if(k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v===true ? "" : v);
  }
  (Array.isArray(kids)?kids:[kids]).forEach(c=>c && n.appendChild(c));
  return n;
};
function toast(msg){
  const h = document.getElementById("toastHost");
  h.innerHTML = ""; h.appendChild(el("div",{class:"toast",text:msg}));
  setTimeout(()=>{ h.innerHTML=""; }, 2200);
}
const gradeClass = g => g==null ? "g-na" : (g>=5.25 ? "g-hi" : (g<4.25 ? "g-lo" : ""));

/* ---- Dateiausgabe: Capability, sonst Direktdownload, sonst Zwischenablage ---- */
let dl = null;
function claudeUse(n){
  try{ return (window.claude && window.claude.use) ? window.claude.use(n).catch(()=>null) : Promise.resolve(null); }
  catch(e){ return Promise.resolve(null); }
}
claudeUse("downloads").then(d=>{ dl = d; if(view==="data") renderData(); });
async function copy(txt, still){
  try{ await navigator.clipboard.writeText(txt); if(!still) toast(t("copied")); return true; }
  catch(e){
    const ta = el("textarea",{style:"position:fixed;opacity:0;top:0"}); ta.value = txt;
    document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok = document.execCommand("copy"); }catch(_){}
    ta.remove(); if(ok && !still) toast(t("copied")); return ok;
  }
}
async function saveFile(filename, data, mime){
  if(dl){
    try{ await dl.save({filename, data}); return true; }
    catch(e){ if(e && e.code === "declined") return false; }
  }
  const blob = (data instanceof Blob) ? data
             : new Blob([data], {type: mime || "text/plain;charset=utf-8"});
  /* Speichern unter: der Dozent waehlt Ordner und Namen selbst.
     Chrome und Edge koennen das; sonst faellt es auf den Download zurueck. */
  if(window.showSaveFilePicker){
    try{
      const ext = "." + (filename.split(".").pop() || "txt");
      const h = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{description: ext.slice(1).toUpperCase(),
                 accept: {[mime || "application/octet-stream"]: [ext]}}]
      });
      const w = await h.createWritable();
      await w.write(blob); await w.close();
      toast(t("savedAs") + ": " + (h.name || filename));
      return true;
    }catch(e){
      if(e && e.name === "AbortError") return false;   // Dialog abgebrochen
      /* SecurityError und Co.: weiter mit dem normalen Download */
    }
  }
  try{
    const url = URL.createObjectURL(blob);
    const a = el("a",{href:url, download:filename, style:"display:none"});
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    return true;
  }catch(e){}
  if(typeof data === "string") copy(data);
  return false;
}

/* ---------- Selbsttest: prueft die Rechenlogik und die Bausteinbibliothek ----------
   Laeuft auf einer Kopie der Daten. Die erfassten Tage werden dabei nicht veraendert. */
function selfTest(){
  const out = [];
  const add = (name, cond, info) => out.push({name:name, ok:!!cond, info:info==null?"":String(info)});
  const backup = JSON.parse(JSON.stringify(S));
  try{
    /* Bausteinbibliothek */
    const ids = CHIPS.map(c=>c.i);
    add(t("stChips"), ids.length === new Set(ids).size, CHIPS.length + " / " + CRITS.length);
    add(t("stCrit"), CHIPS.every(c=>CRITS.some(k=>k.k===c.c)));
    add(t("stAction"), CHIPS.filter(c=>c.d<0 && !c.ko).every(c=>c.a && c.a.de));
    const LG = ["de","en","th","zh"];
    add(t("stLang"), CHIPS.every(c=>LG.every(l=>c.t[l])) && CRITS.every(c=>LG.every(l=>c[l])));
    add(t("stLate"), !!CHIP["tea-lt"]);
    add(t("stSlots"), slots().every((s,i)=>s.id === "d"+String(i+1).padStart(2,"0")), slots().length + " " + t("days"));
    /* Vor dem Austausch der Testdaten: echte Studierendenliste und Stammdaten pruefen. */
    add(t("stNames"), S.students.every(s => s.nachname || s.vorname),
        S.students.length + " " + t("student"));
    add(t("stClass"), !!(S.settings.group && S.settings.team),
        [S.settings.group, S.settings.team].filter(Boolean).join(" \u00b7 ") || "\u2013");

    /* Rechenlogik auf einer Testperson */
    S.students = [{id:"__t", nachname:"Test", vorname:"Person", nick:"", name:"Test Person", mail:"", lang:""}];
    S.days = {}; S.dayMeta = {};
    const first = slots()[0].id, last = slots()[slots().length-1].id;
    const set = (sl, rec) => { S.days[sl] = {}; S.days[sl]["__t"] = rec; };
    const g = sl => critGradesForDay(sl, "__t");
    const K = CRITS[0].k;
    const base = S.settings.base;

    set(first, {att:"present", obs:[], note:null});
    add(t("stBase"), g(first)[K] === base, base.toFixed(2));

    /* je Gewicht einen Baustein suchen, egal in welchem Kriterium */
    [[W.l, 0.25, "stLight"], [W.m, 0.5, "stMedium"], [W.s, 1, "stHeavy"]].forEach(([gew, soll, key])=>{
      const c = CHIPS.find(x=>x.d<0 && !x.ko && x.w===gew);
      if(!c){ add(t(key), false, "kein Baustein mit diesem Gewicht"); return; }
      set(first,{att:"present",obs:[c.i],note:null});
      add(t(key), Math.abs(g(first)[c.c] - (base-soll)) < 1e-9, fmt(g(first)[c.c]));
    });

    const negs = CHIPS.filter(c=>c.c===K && c.d<0 && !c.ko).map(c=>c.i);
    set(first,{att:"present",obs:negs,note:null});
    add(t("stCapDown"), g(first)[K] === Math.max(1, base-1.5), fmt(g(first)[K]));
    const poss = CHIPS.filter(c=>c.c===K && c.d>0).map(c=>c.i);
    set(first,{att:"present",obs:poss,note:null});
    add(t("stCapUp"), g(first)[K] === Math.min(6, base+1), fmt(g(first)[K]));

    const ko = CHIPS.find(c=>c.ko);
    if(ko){ set(first,{att:"present",obs:[ko.i],note:null});
      const gg = g(first);
      add(t("stKo"), gg[ko.c] === 1 && CRITS.filter(c=>c.k!==ko.c).every(c=>gg[c.k] === base), critName(ko.c)); }

    set(first,{att:"late",obs:[],note:null});
    add(t("stLateEffect"), g(first)["tea"] < base, fmt(g(first)["tea"]));
    set(first,{att:"unexcused",obs:[],note:null});
    add(t("stUnexcused"), CRITS.every(c=>g(first)[c.k] === 1));
    set(first,{att:"excused",obs:[],note:null});
    add(t("stExcused"), g(first) === null);
    set(first,{att:"tm",obs:[],note:null});
    add(t("stTm"), CRITS.every(c=>g(first)[c.k] === 5));

    if(HAS_EXAM){
      set(last,{att:"excused",obs:[],note:null});
      const ge = g(last);
      add(t("stExam"), ge && CRITS.every(c=>ge[c.k] === 1));
      add(t("stFinal"), Math.abs(finalGrade(4,6) - (4*2/3 + 6/3)) < 1e-9, fmt(finalGrade(4,6)));
    }

    set(first,{att:"present",obs:[],note:{txt:"x",crit:"",dir:0,w:0}});
    const ohne = g(first)[K];
    set(first,{att:"present",obs:[],note:{txt:"x",crit:K,dir:-1,w:0.5}});
    add(t("stNote"), ohne === base && Math.abs(g(first)[K] - (base-0.5)) < 1e-9);

    add(t("stStore"), storeOK);
  }catch(err){
    out.push({name:"Fehler", ok:false, info:String(err)});
  }finally{
    S = backup;
  }
  return out;
}

/* ---------- Erfassen ---------- */
function slotStrip(onPick){
  const strip = el("div",{class:"slots"});
  const n = slots().length;
  slots().forEach(s=>{
    const b = el("button",{class:"slot"+(dayOpen(s.id)?" filled":"")+(s.exam?" exam":""),
      "aria-current":String(s.id===curSlot), onclick:()=>{ curSlot = s.id; onPick(); }});
    b.appendChild(el("span",{class:"sd",text: s.exam ? t("examShort") : wdName(s.wd)}));
    b.appendChild(el("span",{class:"sw",text: s.exam
      ? wdName(s.wd)+" · "+s.idx+"/"+n
      : t("weekN")+" "+s.week+" · "+s.idx+"/"+n}));
    if(s.id===curSlot) setTimeout(()=>{ try{ b.scrollIntoView({block:"nearest",inline:"center"}); }catch(e){} }, 0);
    strip.appendChild(b);
  });
  return strip;
}

  root.appendChild(slotStrip(renderDay));

  if(!S.students.length){
    root.appendChild(el("div",{class:"card pad"},[
      el("p",{class:"muted",style:"margin:0 0 10px",text:t("noData")}),
      el("button",{class:"btn pri",text:t("set"),onclick:()=>{view="set";render();}})
    ]));

  }
  const sl = slotById(curSlot);
  if(sl.exam) root.appendChild(el("div",{class:"examnote"},[

    el("div",{},[el("b",{text:t("examDay")+". "}), el("span",{text:t("examBadge")+" "+t("examAbsHint")})])
  ]));
  if(!dayOpen(curSlot)){
    root.appendChild(el("div",{class:"card pad",style:"text-align:center"},[
      el("p",{class:"muted",style:"margin:0 0 12px",text:t("openDayHint")}),
      el("button",{class:"btn pri",text:t("openDay")+" · "+slotLabel(sl),
        onclick:()=>{ unseed(); openSlot(curSlot); renderDay(); }})
    ]));
    return;
  }

  S.students.forEach(s=>{
    const r = dayRec(curSlot, s.id);
    const tot = dayTotal(curSlot, s.id);
    const card = el("article",{class:"stud"+(r.att==="excused"||r.att==="unexcused"||r.att==="tm"?" absent":"")});
    const head = el("div",{class:"stud-h"},[avatar(s, 34), el("div",{class:"nm",text:s.name + nickTag(s)})]);
    if(hasOutlet2()) head.appendChild(el("button",{class:"opill"+(r.outlet?" alt":""),title:t("switchTitle"),
      text:"⇄ " + (r.outlet || S.settings.outlet || "–"),
      onclick:()=>{ unseed(); toggleOutlet(r); persist(); renderDay(); }}));
    head.appendChild(el("div",{class:"grade num "+gradeClass(tot),text: tot==null ? t("excused") : fmt(tot)}));
    card.appendChild(head);
    const seg = el("div",{class:"seg"+(sl.exam?" two":" five")});
    (sl.exam
      ? [["present",t("present"),""],["unexcused",t("absent"),"v-unx"]]
      : [["present",t("present"),""],["late",t("late"),"v-late"],["excused",t("excused"),"v-exc"],
         ["unexcused",t("unexcused"),"v-unx"],["tm",t("teamMarket"),"v-tm"]]
    ).forEach(([k,label,cls])=>seg.appendChild(el("button",{class:cls,text:label,
        "aria-pressed":String(sl.exam ? (k==="present" ? r.att==="present" : r.att!=="present") : r.att===k),
        onclick:()=>{ unseed(); r.att = k; persist(); renderDay(); }})));
    card.appendChild(seg);

    if(r.att === "tm"){
      card.appendChild(el("div",{class:"stud-b"}, el("span",{class:"emptyhint",text:t("tmDay")})));
    }
    if(r.att !== "excused" && r.att !== "unexcused" && r.att !== "tm"){
      const body = el("div",{class:"stud-b"});
      const shown = [...(r.obs||[])];
      if(r.att==="late" && !shown.includes("tea-n1")) shown.push("tea-n1");
      shown.forEach(id=>{
        const c = CHIP[id]; if(!c) return;
        const auto = (id==="tea-n1" && !(r.obs||[]).includes("tea-n1"));
        const pill = el("span",{class:"obs "+(c.d>0?"p":"m")},
          el("span",{class:"tx",text:chipT(c, S.settings.uiLang)}));
        if(!auto) pill.appendChild(el("button",{class:"x",text:"×","aria-label":"x",
          onclick:()=>{ unseed(); r.obs = r.obs.filter(x=>x!==id); persist(); renderDay(); }}));
        body.appendChild(pill);
      });
      if(r.note && r.note.txt){
        const sign = r.note.dir && r.note.w ? (r.note.dir>0?"+":"−")+r.note.w.toFixed(2).slice(1)+" " : "";
        body.appendChild(el("span",{class:"obs nt"},[
          el("span",{class:"tx",text:(r.note.internal?"🔒 ":"✎ ")+sign+r.note.txt}),
          el("button",{class:"x",text:"×","aria-label":"x",
            onclick:()=>{ unseed(); r.note = null; persist(); renderDay(); }})
        ]));
      }
      if(!shown.length && !(r.note && r.note.txt)) body.appendChild(el("span",{class:"emptyhint",text:t("noObs")}));
      body.appendChild(el("button",{class:"addbtn",text:"+ "+t("addObs"),onclick:()=>openSheet(s)}));
      card.appendChild(body);
    }
    root.appendChild(card);
  });

  const list = absenceList(curSlot);
  const box = el("div",{class:"card pad",style:"margin-top:16px"});
  box.appendChild(el("span",{class:"eyebrow",text:t("absMailTitle"),style:"display:block;margin-bottom:8px"}));
  if(list.length){
    box.appendChild(el("div",{class:"row",style:"gap:6px;margin-bottom:10px"},
      list.map(x=>el("span",{class:"obs m",style:"padding:3px 10px",text:x.name + " · " + x.kind}))));
  } else {
    box.appendChild(el("p",{class:"muted",style:"margin:0 0 10px",text:t("absMailNone")}));
  }
  const foot = el("div",{class:"row",style:"align-items:center"});
  foot.appendChild(el("button",{class:"btn pri",text:"⤓ "+t("saveDay"),
    onclick:()=>saveFile(fileStem()+".json", JSON.stringify(snapshot(),null,1), "application/json")}));
  foot.appendChild(el("button",{class:"btn pri",style:"background:var(--petrol);border-color:var(--petrol)",
    text:"✉ "+t("absMailBtn"), onclick:()=>openAbsenceMail(curSlot)}));
  /* Zweistufig wie das Zuruecksetzen: ein Fehlklick darf nicht die Beobachtungen
     aller Studierenden dieses Tages loeschen. */
  let dropArmed = false;
  const dropBtn = el("button",{class:"btn sm",text:t("dropDay"),
    onclick:()=>{
      if(!dropArmed){
        dropArmed = true;
        dropBtn.textContent = t("dropConfirm");
        dropBtn.style.background = "var(--minus)"; dropBtn.style.color = "#fff";
        dropBtn.style.borderColor = "var(--minus)";
        setTimeout(()=>{ if(dropArmed){ dropArmed = false; if(view==="day") renderDay(); } }, 6000);
        return;
      }
      delete S.days[curSlot]; delete S.dayMeta[curSlot]; persist(); renderDay();
      toast(t("dropDone"));
    }});
  foot.appendChild(dropBtn);
  box.appendChild(foot);
  const pr = el("div",{class:"row",style:"margin-top:12px;padding-top:12px;border-top:1px solid var(--line)"});
  pr.appendChild(el("span",{class:"eyebrow",style:"width:100%",text:t("sheetPrint")}));
  pr.appendChild(el("button",{class:"btn sm",text:"\u2399 "+t("sheetDay"),onclick:()=>printSheets("day")}));
  pr.appendChild(el("button",{class:"btn sm",text:"\u2399 "+t("sheetSingle"),onclick:()=>printSheets("single")}));
  box.appendChild(pr);
  box.appendChild(el("p",{class:"muted",style:"margin:10px 0 0",
    text:t("saveDayHint") + " " + t("absMailHint") + " " + ABS_MAIL + "."}));
  root.appendChild(box);
}
