  :root:not([data-theme="light"]){
    --bg:#0A101C; --surf:#131B29; --surf2:#0F1724;
    --ink:#EDF0F4; --ink2:#C2CAD6; --ink3:#8D97A6;
    --line:#26303F; --grey:#26303F;
    --plus:#5FBE8D; --minus:#E08874;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;
}
input,select,textarea,button{font-family:inherit;font-size:16px}
.hide{display:none !important}

/* ---------- Kopf ---------- */
header{
  position:sticky; top:0; z-index:40;
  background:var(--navy); color:#fff;
  padding:calc(var(--sat) + 10px) calc(var(--sar) + 14px) 10px calc(var(--sal) + 14px);
  box-shadow:0 1px 0 rgba(0,0,0,.18);
}
.hrow{display:flex;align-items:center;gap:10px}
.hrow img{height:16px;width:auto;max-width:104px;flex:0 0 auto;filter:brightness(0) invert(1)}
.htitle{font-family:var(--f-disp);font-size:15.5px;font-weight:600;line-height:1.2;
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsub{font-size:11.5px;color:#9FB0C6;letter-spacing:.04em;text-transform:uppercase;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbtn{margin-left:auto;background:rgba(255,255,255,.12);border:0;color:#fff;
      width:38px;height:38px;border-radius:10px;font-size:18px;line-height:1;flex:0 0 auto}
.hbtn:active{background:rgba(255,255,255,.26)}
.hbtn+.hbtn{margin-left:6px}

/* ---------- Tagesleiste ---------- */
.slots{
  display:flex;gap:7px;overflow-x:auto;padding:9px calc(var(--sar) + 14px) 9px calc(var(--sal) + 14px);
  background:var(--surf);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:30;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.slots::-webkit-scrollbar{display:none}
.slot{
  flex:0 0 auto;min-width:74px;min-height:46px;padding:5px 12px;border-radius:11px;
  border:1px solid var(--line);background:var(--surf2);color:var(--ink2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
}
.slot .sd{font-size:13.5px;font-weight:600;line-height:1.1}
.slot .sw{font-size:10px;color:var(--ink3);letter-spacing:.03em}
.slot[aria-current="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.slot[aria-current="true"] .sw{color:#9FB0C6}
.slot.filled{border-color:var(--petrol)}
.slot.filled .sd::after{content:" •";color:var(--petrol)}
.slot[aria-current="true"].filled .sd::after{color:var(--cyan)}
.slot.exam{border-color:var(--terra)}
.slot.exam .sd{color:var(--terra)}
.slot.exam[aria-current="true"] .sd{color:#fff}

main{padding:14px calc(var(--sar) + 12px) 120px calc(var(--sal) + 12px);max-width:760px;margin:0 auto}

/* ---------- Karten und Listen ---------- */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card.pad{padding:14px}
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);font-weight:600}
.muted{color:var(--ink3);font-size:13px}
h2.sec{font-family:var(--f-disp);font-size:18px;margin:18px 0 8px;font-weight:600}

.slist{list-style:none;margin:0;padding:0}
.slist li{border-bottom:1px solid var(--line)}
.slist li:last-child{border-bottom:0}
.srow{
  display:flex;align-items:center;gap:11px;width:100%;
  min-height:62px;padding:9px 13px;background:transparent;border:0;text-align:left;color:var(--ink);
}
.srow:active{background:var(--surf2)}
.opill{font:600 13px/1 inherit;border:1px solid var(--line2,#c0c0b8);background:transparent;color:inherit;border-radius:999px;padding:8px 12px;margin-right:8px;white-space:nowrap;max-width:48%;overflow:hidden;text-overflow:ellipsis}
.opill.alt{background:var(--petrol,#005779);border-color:var(--petrol,#005779);color:#fff}
.ava{border-radius:50%;object-fit:cover;flex:0 0 auto;background:#ddd;vertical-align:middle}
.srow .nm{flex:1;min-width:0;font-size:16.5px;font-weight:600;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .sub{font-size:12.5px;color:var(--ink3);font-weight:400;margin-top:1px;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .chev{color:var(--ink3);font-size:19px;flex:0 0 auto}
.dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;background:var(--grey)}
.dot.present{background:var(--plus)}
.dot.late{background:var(--terra)}
.dot.excused{background:var(--sage)}
.dot.unexcused{background:var(--minus)}
.dot.tm{background:var(--petrol)}
.pill{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);
      color:var(--ink3);flex:0 0 auto;white-space:nowrap}
.pill.on{border-color:var(--petrol);color:var(--petrol)}

/* ---------- Buttons ---------- */
.btn{
  min-height:var(--tap);padding:12px 16px;border-radius:12px;border:1px solid var(--line);
  background:var(--surf);color:var(--ink);font-size:15.5px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:active{background:var(--surf2)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:active{background:#00224f}
.btn.wide{width:100%}
.btn.sm{min-height:42px;padding:8px 13px;font-size:14px;font-weight:500}
.btn.danger{border-color:var(--minus);color:var(--minus)}
.row{display:flex;gap:9px;flex-wrap:wrap}

/* ---------- Anwesenheit ---------- */
.att{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.att button{
  min-height:58px;border-radius:12px;border:1.5px solid var(--line);background:var(--surf2);
  color:var(--ink2);font-size:14px;font-weight:600;padding:6px 4px;line-height:1.2;
}
.att button:nth-child(4){grid-column:span 1}
.att button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.att button.warn[aria-pressed="true"]{background:var(--terra);border-color:var(--terra)}
.att button.bad[aria-pressed="true"]{background:var(--minus);border-color:var(--minus)}
.att button.tm[aria-pressed="true"]{background:var(--petrol);border-color:var(--petrol)}

/* ---------- Bausteine ---------- */
.critbar{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.critbar::-webkit-scrollbar{display:none}
.critbar button{
  flex:0 0 auto;min-height:40px;padding:8px 13px;border-radius:999px;
  border:1px solid var(--line);background:var(--surf2);color:var(--ink2);font-size:14px;font-weight:600;
}
.critbar button[aria-current="true"]{background:var(--petrol);border-color:var(--petrol);color:#fff}
.critbar button .n{font-size:11px;opacity:.8;margin-left:4px}

.chips{display:flex;flex-direction:column;gap:8px}
.chip{
  display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
  min-height:var(--tap);padding:11px 13px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--surf2);color:var(--ink);font-size:15px;line-height:1.3;
}
.chip .sg{flex:0 0 auto;width:22px;height:22px;border-radius:6px;display:flex;
          align-items:center;justify-content:center;font-size:14px;font-weight:700;margin-top:1px}
.chip.pos .sg{background:rgba(46,107,78,.13);color:var(--plus)}
.chip.neg .sg{background:rgba(164,64,47,.13);color:var(--minus)}
.chip .tx{flex:1;min-width:0}
.chip .w{font-size:11px;color:var(--ink3);margin-top:2px;letter-spacing:.03em}
.chip[aria-pressed="true"].pos{border-color:var(--plus);background:rgba(46,107,78,.10)}
.chip[aria-pressed="true"].neg{border-color:var(--minus);background:rgba(164,64,47,.10)}
.chip[aria-pressed="true"] .tx{font-weight:600}
.chip.ko .w{color:var(--minus);font-weight:600}
.morebtn{width:100%;min-height:46px;border-radius:12px;border:1px dashed var(--line);
         background:transparent;color:var(--ink3);font-size:14px;font-weight:600}

/* ---------- Felder ---------- */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);font-weight:600}
.field input,.field select,.field textarea{
  background:var(--surf2);border:1px solid var(--line);border-radius:10px;
  padding:12px 12px;font-size:16px;width:100%;color:var(--ink);min-height:48px;
}
.field textarea{min-height:110px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}

/* ---------- Vollbild-Erfassung ---------- */
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.sheet-h{
  background:var(--navy);color:#fff;
  padding:calc(var(--sat) + 10px) calc(var(--sar) + 12px) 10px calc(var(--sal) + 12px);
  display:flex;align-items:center;gap:10px;
}
.sheet-h .nm{flex:1;min-width:0;font-family:var(--f-disp);font-size:18px;font-weight:600;
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-h .sb{font-size:11.5px;color:#9FB0C6}
.sheet-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
         padding:14px calc(var(--sar) + 12px) 28px calc(var(--sal) + 12px)}
.sheet-f{
  background:var(--surf);border-top:1px solid var(--line);
  padding:10px calc(var(--sar) + 12px) calc(var(--sab) + 10px) calc(var(--sal) + 12px);
  display:flex;gap:9px;
}
.sheet-f .btn{flex:1}

/* ---------- Fussleiste ---------- */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surf);
  border-top:1px solid var(--line);
  padding:9px calc(var(--sar) + 12px) calc(var(--sab) + 9px) calc(var(--sal) + 12px);
  display:flex;gap:9px;
}
.bar .btn{flex:1;min-height:50px;font-size:15px;white-space:nowrap}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--sab) + 84px);z-index:90;
  background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;
  font-size:14.5px;max-width:88vw;text-align:center;box-shadow:0 8px 26px rgba(0,0,0,.28);
  opacity:0;pointer-events:none;transition:opacity .18s;
}
#toast.on{opacity:1}
.banner{
  background:rgba(182,99,63,.13);border:1px solid rgba(182,99,63,.4);
  border-radius:12px;padding:11px 13px;font-size:13.5px;color:var(--ink2);margin-bottom:14px;
}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <img id="brandLogo" alt="EHL">
    <div style="min-width:0;flex:1">
      <div class="htitle" id="brandSub">Servicepraxis</div>
    </div>
    <button class="hbtn" id="btnLang" aria-label="Sprache">文</button>
    <button class="hbtn" id="btnSet" aria-label="Setup">⚙</button>
  </div>
</header>
<nav class="slots" id="slots"></nav>
<main id="view"></main>
<div class="bar" id="bar"></div>
<div id="sheetHost"></div>
<div id="toast" role="status" aria-live="polite"></div>

{i:"gas-n5",c:"gas",d:-1,w:W.m,t:{de:"Revier längere Zeit verlassen, Gäste ohne Ansprechperson",en:"Left the station for a longer period, guests without a contact person",th:"ออกจากโซนรับผิดชอบเป็นเวลานาน แขกไม่มีผู้ดูแล",zh:"长时间离开责任区，客人无人照应"},a:{de:"Sprich dich mit deinem Partner ab, wer das Revier übernimmt, bevor du es verlässt.",en:"Agree with your partner who covers the station before you leave it.",th:"ตกลงกับคู่งานว่าใครดูแลโซนแทน ก่อนที่คุณจะออกไป",zh:"离开责任区前，先与搭档约定由谁接手。"}},
{i:"gas-n7",c:"gas",d:-1,w:W.s,t:{de:"Gast sichtbar verärgert zurückgelassen, keine Weitergabe an die Vorgesetzten",en:"Guest left visibly annoyed, situation not passed on to a supervisor",th:"ปล่อยให้แขกไม่พอใจอย่างเห็นได้ชัด และไม่แจ้งหัวหน้า",zh:"让客人明显带着不满离开，且未向上级反映"},a:{de:"Informiere bei jeder unklaren Gastsituation sofort die Serviceleitung, damit sie noch im Haus gelöst werden kann.",en:"Inform the service manager immediately about any unresolved guest situation so it can be settled while the guest is still in the house.",th:"แจ้งหัวหน้าแผนกบริการทันทีเมื่อมีสถานการณ์ที่ยังไม่คลี่คลาย เพื่อแก้ไขขณะแขกยังอยู่ในร้าน",zh:"遇到未解决的客人状况立即告知服务主管，以便客人仍在店内时处理。"}},
{i:"gas-ko",c:"gas",d:-1,w:0,ko:true,t:{de:"Respektloses Verhalten gegenüber Gast oder Team (Gastgeberhaltung = 1.0)",en:"Disrespectful behaviour towards a guest or the team (Host attitude = 1.0)",th:"พฤติกรรมไม่ให้เกียรติแขกหรือเพื่อนร่วมทีม (ความเป็นเจ้าบ้าน = 1.0)",zh:"对客人或同事表现出不尊重（待客态度记 1.00）"},a:{de:"Besprich schwierige Situationen ausserhalb des Gastbereichs mit der Serviceleitung; im Gastraum gilt immer Zurückhaltung.",en:"Discuss difficult situations with the service manager away from the guest area; in the restaurant always stay restrained.",th:"พูดคุยเรื่องยากกับหัวหน้าแผนกนอกพื้นที่บริการ ในห้องอาหารต้องสำรวมเสมอ",zh:"把棘手情况带到客区之外与服务主管讨论；在餐厅内始终保持克制。"}},

/* HYGIENE UND ERSCHEINUNGSBILD */
{i:"hyg-p1",c:"hyg",d:1,w:W.m,t:{de:"Uniform vollständig, sauber und gebügelt",en:"Uniform complete, clean and pressed",th:"ชุดยูนิฟอร์มครบถ้วน สะอาด และรีดเรียบ",zh:"制服完整、干净、熨烫平整"}},
{i:"hyg-p3",c:"hyg",d:1,w:W.m,t:{de:"Händehygiene korrekt und an den richtigen Stellen eingehalten",en:"Hand hygiene applied correctly and at the right moments",th:"ปฏิบัติสุขอนามัยมือถูกต้องและถูกจังหวะ",zh:"在正确的环节正确执行手部卫生"}},
{i:"hyg-p4",c:"hyg",d:1,w:W.m,t:{de:"Gläser am Stiel und Besteck am Griff angefasst",en:"Held glasses by the stem and cutlery by the handle",th:"จับแก้วที่ก้านและจับช้อนส้อมที่ด้าม",zh:"握持酒杯持杯脚、餐具持柄"}},
{i:"hyg-p5",c:"hyg",d:1,w:W.l,t:{de:"Station und Office während des Service sauber gehalten",en:"Kept station and back office clean throughout service",th:"รักษาความสะอาดของสเตชันและห้องเตรียมตลอดการบริการ",zh:"服务期间保持工作台与备餐间整洁"}},
{i:"hyg-n1",c:"hyg",d:-1,w:W.m,t:{de:"Uniform unvollständig oder verschmutzt",en:"Uniform incomplete or soiled",th:"ชุดยูนิฟอร์มไม่ครบหรือไม่สะอาด",zh:"制服不完整或不整洁"},a:{de:"Kontrolliere vor Dienstbeginn Hemd, Hose, Schuhe, Gilet und Foulard und halte eine Ersatzgarnitur im Spind bereit.",en:"Check shirt, trousers, shoes, waistcoat and neckerchief before the shift and keep a spare set in your locker.",th:"ตรวจเสื้อ กางเกง รองเท้า เสื้อกั๊ก และผ้าพันคอก่อนเข้างาน และเก็บชุดสำรองไว้ในล็อกเกอร์",zh:"上岗前检查衬衫、长裤、鞋、马甲和领巾，并在更衣柜备一套替换。"}},
{i:"hyg-n3",c:"hyg",d:-1,w:W.m,t:{de:"Gläser am Kelch oder Besteck an der Lauffläche angefasst",en:"Held glasses by the bowl or cutlery by the blade or tines",th:"จับแก้วที่ตัวแก้ว หรือจับช้อนส้อมที่ส่วนใช้งาน",zh:"握持杯身或触碰餐具的进食部位"},a:{de:"Trag Gläser konsequent am Stiel oder auf dem Tablett und nimm Besteck nur am Griff.",en:"Always carry glasses by the stem or on a tray and pick up cutlery only by the handle.",th:"ถือแก้วที่ก้านหรือใช้ถาดเสมอ และหยิบช้อนส้อมที่ด้ามเท่านั้น",zh:"始终持杯脚或用托盘搬运酒杯，餐具只握柄部。"}},
{i:"hyg-n4",c:"hyg",d:-1,w:W.m,t:{de:"Händehygiene nach kritischem Arbeitsschritt unterlassen",en:"Hand hygiene omitted after a critical step",th:"ไม่ล้างมือหลังขั้นตอนที่มีความเสี่ยง",zh:"关键环节后未执行手部卫生"},a:{de:"Wasch die Hände nach jedem Abräumen, vor dem Anfassen von sauberem Material und nach jeder Pause.",en:"Wash your hands after every clearing round, before handling clean items and after every break.",th:"ล้างมือทุกครั้งหลังเก็บจาน ก่อนหยิบของสะอาด และหลังพักทุกครั้ง",zh:"每次收台后、接触洁净物品前以及每次休息后都要洗手。"}},
{i:"hyg-n6",c:"hyg",d:-1,w:W.s,t:{de:"Verschmutztes oder beschädigtes Material an den Gast gegeben",en:"Soiled or damaged item given to the guest",th:"ส่งภาชนะที่สกปรกหรือชำรุดให้แขก",zh:"把有污渍或破损的器皿给了客人"},a:{de:"Kontrollier Glas, Teller und Besteck im Gegenlicht, bevor du eindeckst oder servierst.",en:"Check glasses, plates and cutlery against the light before laying up or serving.",th:"ตรวจแก้ว จาน และช้อนส้อมโดยส่องกับแสงก่อนจัดโต๊ะหรือเสิร์ฟ",zh:"摆台或上菜前对光检查玻璃杯、餐盘和餐具。"}},
{i:"hyg-ko",c:"hyg",d:-1,w:0,ko:true,t:{de:"Grober Hygiene- oder HACCP-Verstoss (Hygiene = 1.0)",en:"Serious hygiene or HACCP breach (Hygiene = 1.0)",th:"ละเมิดสุขอนามัยหรือ HACCP อย่างร้ายแรง (สุขอนามัย = 1.0)",zh:"严重违反卫生或 HACCP 规定（卫生记 1.00）"},a:{de:"Hol bei jeder Unsicherheit zu Temperatur, Haltbarkeit oder Allergenen vor dem Servieren die Bestätigung der Fachlehrperson.",en:"Whenever you are unsure about temperature, shelf life or allergens, get confirmation from the lecturer before serving.",th:"เมื่อไม่แน่ใจเรื่องอุณหภูมิ อายุการเก็บ หรือสารก่อภูมิแพ้ ให้ขอการยืนยันจากอาจารย์ก่อนเสิร์ฟ",zh:"对温度、保质期或过敏原有任何不确定时，上菜前先向授课教师确认。"}},
{i:"hyg-ko2",c:"hyg",d:-1,w:0,ko:true,t:{de:"Wiederholter vermeidbarer Uniform- oder Erscheinungsbildverstoss (Hygiene = 1.0)",en:"Repeated avoidable breach of uniform or grooming rules (Hygiene = 1.0)",th:"ละเมิดระเบียบชุดหรือบุคลิกภาพซ้ำโดยหลีกเลี่ยงได้ (สุขอนามัย = 1.0)",zh:"重复出现本可避免的制服或仪容违规（卫生记 1.00）"},a:{de:"Notier den Hinweis und kontrollier den betroffenen Punkt am Folgetag aktiv vor dem Briefing.",en:"Write the feedback down and actively check that point before the next day's briefing.",th:"จดคำแนะนำไว้ และตรวจจุดนั้นก่อนบรีฟในวันถัดไป",zh:"把提醒记下来，第二天简报前主动检查该项。"}},

/* MISE EN PLACE UND ORGANISATION */
{i:"mep-p1",c:"mep",d:1,w:W.m,t:{de:"Station vor Serviceanfang vollständig vorbereitet und kontrolliert",en:"Station fully prepared and checked before service",th:"เตรียมสเตชันครบถ้วนและตรวจสอบก่อนเริ่มบริการ",zh:"服务开始前工作台准备完整并已检查"}},
{i:"mep-p2",c:"mep",d:1,w:W.m,t:{de:"Eingedeckt exakt nach Standard (Abstände, Ausrichtung, Symmetrie)",en:"Laid up exactly to standard (spacing, alignment, symmetry)",th:"จัดโต๊ะตรงตามมาตรฐาน (ระยะ แนว ความสมมาตร)",zh:"严格按标准摆台（间距、对齐、对称）"}},
{i:"mep-p3",c:"mep",d:1,w:W.l,t:{de:"Nachschub selbständig ergänzt, bevor etwas ausging",en:"Replenished supplies independently before anything ran out",th:"เติมของใช้ด้วยตนเองก่อนของจะหมด",zh:"在物品用尽前主动补充"}},
{i:"mep-p4",c:"mep",d:1,w:W.m,t:{de:"Abschlussarbeiten vollständig und fristgerecht erledigt",en:"Closing duties completed fully and on time",th:"ทำงานปิดร้านครบถ้วนและตรงเวลา",zh:"收尾工作完整且按时完成"}},
{i:"mep-n1",c:"mep",d:-1,w:W.m,t:{de:"Mise en Place bei Serviceanfang unvollständig",en:"Mise en place incomplete at the start of service",th:"มีซ็องปลัสไม่ครบเมื่อเริ่มบริการ",zh:"开餐时准备工作不完整"},a:{de:"Arbeite mit einer festen Checkliste für deine Station und hak sie 15 Minuten vor Serviceanfang ab.",en:"Use a fixed checklist for your station and tick it off 15 minutes before service starts.",th:"ใช้เช็กลิสต์ประจำสเตชัน และตรวจให้ครบ 15 นาทีก่อนเริ่มบริการ",zh:"为你的工作台制定固定检查表，并在开餐前 15 分钟逐项核对。"}},
{i:"mep-n2",c:"mep",d:-1,w:W.l,t:{de:"Eindecken ungenau (Abstände, Ausrichtung, Logo)",en:"Table laid inaccurately (spacing, alignment, logo)",th:"จัดโต๊ะไม่เรียบร้อย (ระยะ แนว โลโก้)",zh:"摆台不精确（间距、对齐、标志方向）"},a:{de:"Kontrollier den Tisch am Schluss aus Gastperspektive, indem du dich einmal hinsetzt.",en:"Check the finished table from the guest's perspective by sitting down once.",th:"ตรวจโต๊ะที่จัดเสร็จจากมุมมองแขก โดยลองนั่งลงสักครั้ง",zh:"摆好后坐下一次，从客人视角检查整张桌子。"}},
{i:"mep-n3",c:"mep",d:-1,w:W.m,t:{de:"Während des Service ging Material aus, kein Nachschub vorbereitet",en:"Ran out of items during service, no replenishment prepared",th:"ของหมดระหว่างบริการ ไม่ได้เตรียมของเติม",zh:"服务中物品用尽，未备补给"},a:{de:"Leg für die kritischen Artikel eine Mindestmenge fest und füll nach jedem Gang auf.",en:"Define a minimum stock for the critical items and top up after every course.",th:"กำหนดจำนวนขั้นต่ำสำหรับของสำคัญ และเติมหลังเสิร์ฟทุกคอร์ส",zh:"为关键物品设定最低存量，每道菜后补充一次。"}},
{i:"mep-n4",c:"mep",d:-1,w:W.m,t:{de:"Abschlussarbeiten unvollständig oder an andere abgegeben",en:"Closing duties incomplete or handed to others",th:"งานปิดร้านไม่ครบ หรือโยนให้ผู้อื่น",zh:"收尾工作未完成或推给他人"},a:{de:"Teilt die Abschlussarbeiten zu Beginn im Team auf und meld dich erst ab, wenn dein Teil kontrolliert ist.",en:"Divide the closing duties in the team at the start and only sign off once your part has been checked.",th:"แบ่งงานปิดร้านกันตั้งแต่ต้น และเลิกงานเมื่อส่วนของคุณถูกตรวจแล้วเท่านั้น",zh:"开工时就在团队内分配收尾任务，自己那部分经检查后才下班。"}},
{i:"mep-n7",c:"mep",d:-1,w:W.s,t:{de:"Station am Serviceende nicht betriebsbereit hinterlassen",en:"Station not left ready for operation at the end of service",th:"ไม่ส่งมอบสเตชันในสภาพพร้อมใช้งานเมื่อจบบริการ",zh:"服务结束时工作台未处于可运营状态"},a:{de:"Kontrollier am Schluss anhand der Checkliste, ob die Station für die nächste Schicht startklar ist.",en:"Use the checklist at the end to confirm the station is ready for the next shift.",th:"ใช้เช็กลิสต์ตอนจบงานเพื่อยืนยันว่าสเตชันพร้อมสำหรับกะถัดไป",zh:"结束时按检查表确认工作台已为下一班做好准备。"}},

/* ARBEITSTECHNIK SERVICE */
{i:"tec-p1",c:"tec",d:1,w:W.m,t:{de:"Tragetechnik sicher und korrekt (Teller, Tablett, Gläser)",en:"Carrying technique safe and correct (plates, tray, glasses)",th:"เทคนิคการถือปลอดภัยและถูกต้อง (จาน ถาด แก้ว)",zh:"端托技术安全规范（餐盘、托盘、酒杯）"}},
{i:"tec-p2",c:"tec",d:1,w:W.m,t:{de:"Servier- und Aushebeseite nach Hausstandard eingehalten",en:"Served and cleared from the correct side per house standard",th:"เสิร์ฟและเก็บจานตามด้านที่ถูกต้องตามมาตรฐานร้าน",zh:"按本店标准从正确一侧上菜和收台"}},
{i:"tec-p3",c:"tec",d:1,w:W.m,t:{de:"Getränkeservice fachgerecht (Glaswahl, Temperatur, Einschenkmenge, Flaschenhaltung)",en:"Beverage service professional (glass, temperature, pouring quantity, bottle handling)",th:"บริการเครื่องดื่มอย่างมืออาชีพ (เลือกแก้ว อุณหภูมิ ปริมาณริน การจับขวด)",zh:"饮品服务专业（选杯、温度、斟倒量、持瓶）"}},
{i:"tec-p4",c:"tec",d:1,w:W.s,t:{de:"Arbeit am Gast sicher ausgeführt (Tranchieren, Filetieren, Flambieren, Dekantieren)",en:"Guéridon work performed confidently (carving, filleting, flambéing, decanting)",th:"ทำงานหน้าแขกได้อย่างมั่นใจ (แล่ ตัด ฟลามเบ้ เดคานต์)",zh:"桌边操作稳健（分切、剔骨、火焰烹调、醒酒）"}},
{i:"tec-p5",c:"tec",d:1,w:W.m,t:{de:"Weinservice vollständig nach Standard (Präsentation, Degustation, Reihenfolge)",en:"Wine service complete to standard (presentation, tasting, order of service)",th:"บริการไวน์ครบตามมาตรฐาน (นำเสนอ ชิม ลำดับการเสิร์ฟ)",zh:"葡萄酒服务符合标准（示瓶、品鉴、顺序）"}},
{i:"tec-n1",c:"tec",d:-1,w:W.m,t:{de:"Unsichere Tragetechnik, Gefahr für Gast oder Material",en:"Unsafe carrying technique, risk to guests or material",th:"เทคนิคการถือไม่มั่นคง เสี่ยงต่อแขกหรือภาชนะ",zh:"端托不稳，存在伤及客人或损坏器皿的风险"},a:{de:"Üb die Tragetechnik mit leerem Geschirr ausserhalb der Servicezeit, bis der Griff sitzt.",en:"Practise carrying with empty crockery outside service hours until the grip is secure.",th:"ฝึกถือด้วยภาชนะเปล่านอกเวลาบริการจนกว่าจะจับได้มั่นคง",zh:"在非服务时段用空餐具练习，直到手法稳固。"}},
{i:"tec-n2",c:"tec",d:-1,w:W.l,t:{de:"Servier- oder Aushebeseite nicht eingehalten",en:"Served or cleared from the wrong side",th:"เสิร์ฟหรือเก็บจานผิดด้าน",zh:"上菜或收台的方位不符规定"},a:{de:"Halt dich an den Hausstandard und frag im Briefing nach, sobald du unsicher bist.",en:"Follow the house standard and ask during the briefing as soon as you are unsure.",th:"ยึดตามมาตรฐานของร้าน และถามในช่วงบรีฟทันทีที่ไม่แน่ใจ",zh:"遵循本店标准，一有不确定就在简报时提问。"}},
{i:"tec-n3",c:"tec",d:-1,w:W.m,t:{de:"Getränkeservice fehlerhaft (Glaswahl, Temperatur, Menge)",en:"Beverage service faulty (glass, temperature, quantity)",th:"บริการเครื่องดื่มผิดพลาด (แก้ว อุณหภูมิ ปริมาณ)",zh:"饮品服务有误（选杯、温度、分量）"},a:{de:"Kontrollier vor dem Ausschenken Glas, Temperatur und Menge anhand der Getränkekarte.",en:"Check glass, temperature and quantity against the drinks list before pouring.",th:"ตรวจแก้ว อุณหภูมิ และปริมาณตามรายการเครื่องดื่มก่อนริน",zh:"斟倒前对照酒水单核对杯型、温度和分量。"}},
{i:"tec-n4",c:"tec",d:-1,w:W.s,t:{de:"Arbeit am Gast abgebrochen oder misslungen, Gast musste warten",en:"Guéridon work abandoned or failed, the guest had to wait",th:"งานหน้าแขกทำไม่สำเร็จหรือต้องยกเลิก แขกต้องรอ",zh:"桌边操作中断或失败，客人被迫等待"},a:{de:"Üb die Arbeit am Gast im Trockenlauf und bereite Material und Ablauf vor dem Gang vollständig vor.",en:"Rehearse the guéridon work dry and prepare material and sequence completely before the course.",th:"ซ้อมงานหน้าแขกแบบไม่ใช้ของจริง และเตรียมอุปกรณ์กับลำดับขั้นให้ครบก่อนเสิร์ฟ",zh:"先做空练，并在上该道菜前把器具和流程准备齐全。"}},
{i:"tec-n6",c:"tec",d:-1,w:W.m,t:{de:"Weinservice unvollständig (keine Präsentation, keine Degustation, falsche Reihenfolge)",en:"Wine service incomplete (no presentation, no tasting, wrong order)",th:"บริการไวน์ไม่ครบ (ไม่นำเสนอ ไม่ให้ชิม ลำดับผิด)",zh:"葡萄酒服务不完整（未示瓶、未品鉴、顺序错误）"},a:{de:"Arbeite den Weinservice anhand der festen Schrittfolge ab und lass dir die Reihenfolge von der Fachlehrperson einmal bestätigen.",en:"Work through the fixed sequence for wine service and have the lecturer confirm the order once.",th:"ทำตามลำดับขั้นบริการไวน์ที่กำหนด และให้อาจารย์ยืนยันลำดับสักครั้ง",zh:"按固定步骤完成酒水服务，并请教师确认一次顺序。"}},

/* VERKAUF UND BERATUNG */
{i:"ver-p1",c:"ver",d:1,w:W.m,t:{de:"Menü- und Getränkekenntnisse sicher, Gastfragen kompetent beantwortet",en:"Sound knowledge of menu and drinks, answered guest questions competently",th:"รู้เมนูและเครื่องดื่มดี ตอบคำถามแขกได้อย่างมืออาชีพ",zh:"熟悉菜单与酒水，能称职回答客人提问"}},
{i:"ver-p2",c:"ver",d:1,w:W.m,t:{de:"Aktive Empfehlung ausgesprochen, passend zur Gastsituation",en:"Gave an active recommendation that matched the guest's situation",th:"แนะนำเชิงรุกได้เหมาะกับสถานการณ์ของแขก",zh:"主动给出契合客人情境的推荐"}},
{i:"ver-p3",c:"ver",d:1,w:W.m,t:{de:"Zusatzverkauf gelungen (Apéritif, Wasser, Dessert, Kaffee, Digestif)",en:"Successful upselling (aperitif, water, dessert, coffee, digestif)",th:"ขายเพิ่มได้สำเร็จ (อะเพริทีฟ น้ำ ของหวาน กาแฟ ดิเจสทีฟ)",zh:"成功完成加售（餐前酒、水、甜点、咖啡、餐后酒）"}},
{i:"ver-p4",c:"ver",d:1,w:W.m,t:{de:"Passende Weinbegleitung zum Gericht vorgeschlagen",en:"Suggested a fitting wine pairing for the dish",th:"แนะนำไวน์ที่เข้ากับอาหารได้เหมาะสม",zh:"为菜品推荐了合适的配酒"}},
{i:"ver-n1",c:"ver",d:-1,w:W.m,t:{de:"Frage zu Speisen oder Getränken nicht beantwortet und nicht abgeklärt",en:"Question about food or drinks left unanswered and not clarified",th:"ไม่ตอบคำถามเรื่องอาหารหรือเครื่องดื่ม และไม่ไปสอบถามให้ชัด",zh:"对菜品或酒水的提问未作答也未去核实"},a:{de:"Lies die Karte vor dem Service durch und notier dir drei Fragen, die du im Briefing klären willst.",en:"Read the menu before service and note three questions to clarify during the briefing.",th:"อ่านเมนูก่อนเริ่มบริการ และจดคำถามสามข้อไว้ถามในช่วงบรีฟ",zh:"开餐前通读菜单，记下三个问题在简报时澄清。"}},
{i:"ver-n2",c:"ver",d:-1,w:W.l,t:{de:"Keine Empfehlung ausgesprochen, obwohl die Situation es anbot",en:"No recommendation given although the situation invited one",th:"ไม่ได้แนะนำอะไรเลย ทั้งที่สถานการณ์เอื้อ",zh:"情境适合推荐却未开口"},a:{de:"Leg dir pro Gang eine Empfehlung zurecht und sprich sie aktiv an.",en:"Prepare one recommendation per course and offer it actively.",th:"เตรียมคำแนะนำไว้หนึ่งอย่างต่อหนึ่งคอร์ส และเสนอเชิงรุก",zh:"为每道菜准备一个推荐，并主动提出。"}},
{i:"ver-n4",c:"ver",d:-1,w:W.m,t:{de:"Falsche Angaben zu Speisen, Getränken oder Preisen gemacht",en:"Gave incorrect information on dishes, drinks or prices",th:"ให้ข้อมูลอาหาร เครื่องดื่ม หรือราคาผิด",zh:"对菜品、酒水或价格提供了错误信息"},a:{de:"Sag offen, dass du nachfragst, und hol die Information, statt zu schätzen.",en:"Say openly that you will check, and get the information instead of guessing.",th:"บอกแขกตรง ๆ ว่าจะไปตรวจสอบ แล้วไปหาข้อมูลจริง อย่าเดา",zh:"坦率告知客人你去确认，然后取得准确信息，不要靠猜。"}},
{i:"ver-n7",c:"ver",d:-1,w:W.m,t:{de:"Allergenfrage des Gastes ohne Abklärung beantwortet",en:"Answered an allergen question without checking",th:"ตอบคำถามเรื่องสารก่อภูมิแพ้โดยไม่ตรวจสอบ",zh:"未经核实就回答过敏原问题"},a:{de:"Klär jede Allergenfrage in der Küche ab und gib die Antwort erst danach weiter.",en:"Clarify every allergen question with the kitchen and pass on the answer only afterwards.",th:"สอบถามเรื่องสารก่อภูมิแพ้กับครัวทุกครั้ง แล้วจึงแจ้งคำตอบแก่แขก",zh:"所有过敏原问题都先与厨房核实，之后再答复客人。"}},

/* TEAMFAEHIGKEIT */
{i:"tea-lt",c:"tea",d:-1,w:W.m,t:{de:"Verspätet zum Dienst erschienen",en:"Arrived late for the shift",th:"มาทำงานสาย",zh:"上班迟到"},a:{de:"Plane den Arbeitsweg mit zehn Minuten Reserve und melde eine absehbare Verspätung vorher.",en:"Plan your journey with ten minutes to spare and report a foreseeable delay in advance.",th:"เผื่อเวลาเดินทางสิบนาที และแจ้งล่วงหน้าหากคาดว่าจะมาสาย",zh:"通勤预留十分钟，可预见的迟到请提前通知。"}},
{i:"tea-p1",c:"tea",d:1,w:W.m,t:{de:"Kolleginnen und Kollegen aktiv unterstützt, ohne dazu aufgefordert zu werden",en:"Actively supported colleagues without being asked",th:"ช่วยเหลือเพื่อนร่วมงานเชิงรุกโดยไม่ต้องมีใครบอก",zh:"无需提醒主动支援同事"}},
{i:"tea-p2",c:"tea",d:1,w:W.l,t:{de:"Informationen zuverlässig weitergegeben (Bestellungen, Gastwünsche, Änderungen)",en:"Passed on information reliably (orders, guest requests, changes)",th:"ส่งต่อข้อมูลได้ครบถ้วน (ออเดอร์ ความต้องการของแขก การเปลี่ยนแปลง)",zh:"可靠地传递信息（点单、客人要求、变更）"}},
{i:"tea-p3",c:"tea",d:1,w:W.m,t:{de:"Absprache mit der Küche klar und rechtzeitig",en:"Coordination with the kitchen clear and timely",th:"ประสานงานกับครัวชัดเจนและทันเวลา",zh:"与厨房沟通清晰且及时"}},
{i:"tea-p5",c:"tea",d:1,w:W.m,t:{de:"In hektischen Phasen ruhig und ausgleichend gewirkt",en:"Stayed calm and steadying during busy phases",th:"ช่วยให้ทีมสงบและสมดุลในช่วงเร่งด่วน",zh:"在繁忙时段保持冷静并稳定团队"}},
{i:"tea-n1",c:"tea",d:-1,w:W.m,t:{de:"Nur die eigene Station betreut, Kollegen im Stress stehen gelassen",en:"Looked after own station only, left colleagues under pressure",th:"ดูแลแต่สเตชันของตัวเอง ปล่อยเพื่อนร่วมงานรับภาระ",zh:"只顾自己的区域，任由同事忙不过来"},a:{de:"Schau nach jedem Gang kurz ins Nachbarrevier und biete konkret Hilfe an.",en:"Glance into the neighbouring station after every course and offer concrete help.",th:"หลังเสิร์ฟแต่ละคอร์ส ให้มองไปที่โซนข้างเคียงและเสนอความช่วยเหลือที่ชัดเจน",zh:"每道菜后看一眼邻区，并提出具体的帮忙。"}},
{i:"tea-n2",c:"tea",d:-1,w:W.m,t:{de:"Wichtige Information nicht weitergegeben (Gastwunsch, Änderung, Reklamation)",en:"Important information not passed on (guest request, change, complaint)",th:"ไม่ส่งต่อข้อมูลสำคัญ (ความต้องการของแขก การเปลี่ยนแปลง ข้อร้องเรียน)",zh:"未传递重要信息（客人要求、变更、投诉）"},a:{de:"Gib jede Information sofort weiter und lass sie dir kurz bestätigen.",en:"Pass on every piece of information immediately and have it confirmed briefly.",th:"ส่งต่อข้อมูลทุกอย่างทันที และขอการยืนยันสั้น ๆ",zh:"任何信息都立即传递，并请对方简短确认。"}},
{i:"tea-n4",c:"tea",d:-1,w:W.m,t:{de:"Kritik abgewehrt oder ignoriert",en:"Rejected or ignored feedback",th:"ปฏิเสธหรือเพิกเฉยต่อคำติชม",zh:"抗拒或无视批评意见"},a:{de:"Nimm den Hinweis zuerst entgegen, wiederhol ihn in eigenen Worten und setz ihn im nächsten Gang um.",en:"Accept the feedback first, repeat it in your own words and apply it in the next course.",th:"รับฟังก่อน ทวนด้วยคำพูดของตัวเอง แล้วนำไปใช้ในคอร์สถัดไป",zh:"先接受意见，用自己的话复述一遍，并在下一道菜中落实。"}},
{i:"tea-n5",c:"tea",d:-1,w:W.m,t:{de:"Konflikt im Team im Gastbereich ausgetragen",en:"Team conflict carried out in the guest area",th:"ทะเลาะกันในทีมต่อหน้าแขก",zh:"在客区内发生团队冲突"},a:{de:"Verschieb Klärungen ins Office und bitte die Serviceleitung um Unterstützung.",en:"Move disagreements to the back office and ask the service manager for support.",th:"ย้ายการพูดคุยไปที่ห้องหลังร้าน และขอความช่วยเหลือจากหัวหน้าแผนก",zh:"把争议移到后场处理，并请服务主管协助。"}},

/* SELBSTAENDIGKEIT */
{i:"sel-p1",c:"sel",d:1,w:W.m,t:{de:"Aufgaben selbständig erkannt und übernommen, ohne Anweisung",en:"Identified and took on tasks independently, without instruction",th:"มองเห็นงานและลงมือทำเองโดยไม่ต้องสั่ง",zh:"无需指示即发现并承担任务"}},
{i:"sel-p2",c:"sel",d:1,w:W.m,t:{de:"Im Rahmen der Kompetenz eigenständig entschieden und richtig gelegen",en:"Decided independently within their remit and got it right",th:"ตัดสินใจเองภายในขอบเขตหน้าที่ และตัดสินใจถูก",zh:"在职权范围内自主决策且判断正确"}},
{i:"sel-p3",c:"sel",d:1,w:W.l,t:{de:"Bei Unsicherheit gezielt nachgefragt, statt zu raten",en:"Asked specific questions when unsure instead of guessing",th:"เมื่อไม่แน่ใจก็ถามอย่างตรงประเด็นแทนการเดา",zh:"不确定时具体提问，而非凭猜"}},
{i:"sel-p4",c:"sel",d:1,w:W.m,t:{de:"Eigenen Fehler selbst erkannt, gemeldet und korrigiert",en:"Recognised, reported and corrected their own mistake",th:"รู้ตัวว่าทำผิด แจ้ง และแก้ไขด้วยตนเอง",zh:"自行发现、上报并纠正了自己的错误"}},
{i:"sel-n1",c:"sel",d:-1,w:W.m,t:{de:"Auf Anweisung gewartet, obwohl die Arbeit offensichtlich war",en:"Waited for instructions although the work was obvious",th:"รอคำสั่งทั้งที่งานเห็นได้ชัด",zh:"工作显而易见却仍等待指示"},a:{de:"Leg dir für Leerläufe drei Standardaufgaben zurecht, die du ohne Rückfrage übernehmen kannst.",en:"Define three standard tasks you can take on without asking whenever there is a lull.",th:"กำหนดงานมาตรฐานสามอย่างที่ทำได้เองเมื่อว่าง โดยไม่ต้องถาม",zh:"为空档期准备三项无需请示即可承担的常规任务。"}},
{i:"sel-n2",c:"sel",d:-1,w:W.m,t:{de:"Dieselbe Anweisung mehrfach gebraucht",en:"Needed the same instruction repeatedly",th:"ต้องได้รับคำสั่งเดิมซ้ำหลายครั้ง",zh:"同一指令需反复交代"},a:{de:"Notier dir Anweisungen sofort und kontrollier am Ende der Schicht, was du davon umgesetzt hast.",en:"Write instructions down immediately and check at the end of the shift what you have applied.",th:"จดคำสั่งทันที และตรวจดูตอนจบกะว่าทำไปแล้วเท่าไร",zh:"立即记下指令，下班前检查自己落实了哪些。"}},
{i:"sel-n3",c:"sel",d:-1,w:W.l,t:{de:"Bei Unsicherheit geraten, statt nachzufragen",en:"Guessed when unsure instead of asking",th:"เดาเมื่อไม่แน่ใจแทนที่จะถาม",zh:"不确定时靠猜而不提问"},a:{de:"Frag lieber einmal zu viel nach: eine Rückfrage kostet Sekunden, ein Fehler am Gast kostet den Gang.",en:"Better to ask once too often: a question costs seconds, a mistake at the table costs the whole course.",th:"ถามเกินไว้ดีกว่า: คำถามใช้เวลาไม่กี่วินาที แต่ความผิดพลาดต่อหน้าแขกเสียทั้งคอร์ส",zh:"宁可多问一次：提问只需几秒，失误却要赔上整道菜。"}},
{i:"sel-n4",c:"sel",d:-1,w:W.m,t:{de:"Eigenen Fehler nicht gemeldet",en:"Did not report their own mistake",th:"ไม่แจ้งความผิดพลาดของตนเอง",zh:"未主动上报自己的失误"},a:{de:"Meld Fehler sofort selbst, damit sie behoben sind, bevor der Gast sie bemerkt.",en:"Report mistakes yourself straight away so they can be fixed before the guest notices.",th:"แจ้งความผิดพลาดด้วยตนเองทันที เพื่อแก้ไขก่อนที่แขกจะสังเกตเห็น",zh:"失误立即自行上报，以便在客人察觉前补救。"}},

/* MOTIVATION */
{i:"mot-p1",c:"mot",d:1,w:W.m,t:{de:"Über die ganze Schicht aktiv mitgearbeitet und Einsatz gezeigt",en:"Worked actively and showed commitment throughout the shift",th:"ทำงานอย่างกระตือรือร้นและทุ่มเทตลอดกะ",zh:"整个班次积极投入、表现出干劲"}},
{i:"mot-p2",c:"mot",d:1,w:W.l,t:{de:"Von sich aus gefragt, was zu tun ist",en:"Asked of their own accord what needed doing",th:"ถามเองว่ามีอะไรให้ทำบ้าง",zh:"主动询问还有什么需要做"}},
{i:"mot-p3",c:"mot",d:1,w:W.m,t:{de:"Fachliches Interesse gezeigt, Fragen zum Fach gestellt",en:"Showed professional interest, asked technical questions",th:"แสดงความสนใจในวิชาชีพ ตั้งคำถามเชิงเทคนิค",zh:"表现出专业兴趣，提出业务问题"}},
{i:"mot-p5",c:"mot",d:1,w:W.m,t:{de:"Zusätzliche Aufgaben freiwillig übernommen",en:"Volunteered for additional tasks",th:"อาสารับงานเพิ่มเติม",zh:"自愿承担额外任务"}},
{i:"mot-n1",c:"mot",d:-1,w:W.m,t:{de:"Privates Handy im Arbeitsbereich benutzt",en:"Used a private mobile phone in the work area",th:"ใช้โทรศัพท์ส่วนตัวในพื้นที่ทำงาน",zh:"在工作区使用私人手机"},a:{de:"Lass das Handy während der Schicht im Spind; für Notfälle ist die Serviceleitung erreichbar.",en:"Leave your phone in the locker during the shift; the service manager is reachable for emergencies.",th:"เก็บโทรศัพท์ไว้ในล็อกเกอร์ระหว่างกะ กรณีฉุกเฉินติดต่อผ่านหัวหน้าแผนกได้",zh:"当班时把手机放在更衣柜；紧急情况可通过服务主管联系。"}},
{i:"mot-n2",c:"mot",d:-1,w:W.m,t:{de:"Sich der Arbeit entzogen (Rückzug ins Office, verlängerte Pausen)",en:"Avoided work (retreating to the back office, extended breaks)",th:"หลีกเลี่ยงงาน (หลบไปหลังร้าน พักนานเกิน)",zh:"回避工作（躲进后场、延长休息）"},a:{de:"Meld dich ab, wenn du den Gastbereich verlässt, und nenn Grund und Dauer.",en:"Sign off when you leave the guest area and state the reason and how long you will be.",th:"แจ้งทุกครั้งที่ออกจากพื้นที่บริการ พร้อมบอกเหตุผลและระยะเวลา",zh:"离开客区时先报备，并说明原因和时长。"}},
{i:"mot-n3",c:"mot",d:-1,w:W.l,t:{de:"Anderen zugesehen, statt mitzuarbeiten",en:"Watched others instead of joining in",th:"ยืนดูคนอื่นทำงานแทนที่จะลงมือช่วย",zh:"旁观他人而非动手参与"},a:{de:"Schliess dich bei Unsicherheit einer laufenden Arbeit an, statt zu beobachten.",en:"When unsure, join an ongoing task rather than watching.",th:"เมื่อไม่แน่ใจ ให้เข้าไปช่วยงานที่กำลังทำอยู่ แทนการยืนดู",zh:"不确定时加入正在进行的工作，而不是站着看。"}},
{i:"mot-n5",c:"mot",d:-1,w:W.m,t:{de:"Desinteresse oder Gleichgültigkeit gegenüber den Aufgaben gezeigt",en:"Showed disinterest or indifference towards the tasks",th:"แสดงความไม่สนใจหรือเฉยเมยต่องาน",zh:"对任务表现出缺乏兴趣或无所谓"},a:{de:"Such dir pro Schicht eine Aufgabe, die dich fachlich interessiert, und vertief sie.",en:"Pick one task per shift that interests you professionally and go deeper into it.",th:"เลือกงานหนึ่งอย่างต่อกะที่คุณสนใจเชิงวิชาชีพ และลงลึกกับงานนั้น",zh:"每班挑一项你专业上感兴趣的工作，把它做深。"}},

/* AUFMERKSAMKEIT UND EFFIZIENZ */
{i:"auf-p1",c:"auf",d:1,w:W.m,t:{de:"Gastsignale früh erkannt (leeres Glas, Blickkontakt, fertiger Teller)",en:"Spotted guest signals early (empty glass, eye contact, finished plate)",th:"สังเกตสัญญาณจากแขกได้เร็ว (แก้วหมด สบตา จานว่าง)",zh:"及早捕捉客人信号（空杯、目光、吃完的盘子）"}},
{i:"auf-p2",c:"auf",d:1,w:W.m,t:{de:"Revier laufend im Blick behalten, Timing der Gänge stimmte",en:"Kept the station in view throughout, course timing was right",th:"ดูแลโซนอย่างต่อเนื่อง จังหวะการเสิร์ฟแต่ละคอร์สเหมาะสม",zh:"持续关注责任区，上菜节奏把握得当"}},
{i:"auf-p3",c:"auf",d:1,w:W.m,t:{de:"Wege gebündelt, nie mit leeren Händen gelaufen",en:"Combined trips, never walked with empty hands",th:"รวบเส้นทางเดิน ไม่เดินมือเปล่า",zh:"合并动线，从不空手走动"}},
{i:"auf-p5",c:"auf",d:1,w:W.m,t:{de:"Engpass früh erkannt und selbst entschärft",en:"Recognised a bottleneck early and resolved it independently",th:"มองเห็นจุดคอขวดได้เร็วและแก้ไขด้วยตนเอง",zh:"及早发现瓶颈并自行化解"}},
{i:"auf-n1",c:"auf",d:-1,w:W.m,t:{de:"Gastsignale übersehen, Gast musste winken",en:"Missed guest signals, the guest had to wave",th:"มองข้ามสัญญาณจากแขก จนแขกต้องโบกมือเรียก",zh:"忽略客人信号，客人不得不招手"},a:{de:"Geh alle fünf Minuten bewusst einmal durch dein Revier und schau jeden Tisch an.",en:"Walk through your station deliberately every five minutes and look at every table.",th:"เดินตรวจโซนของคุณทุกห้านาที และมองทุกโต๊ะ",zh:"每五分钟有意识地巡一次责任区，逐桌看过去。"}},
{i:"auf-n2",c:"auf",d:-1,w:W.m,t:{de:"Timing der Gänge nicht im Griff, Gast wartete unnötig",en:"Course timing not under control, the guest waited unnecessarily",th:"คุมจังหวะคอร์สไม่ได้ แขกต้องรอโดยไม่จำเป็น",zh:"上菜节奏失控，客人白等"},a:{de:"Notier die Anstosszeit pro Tisch und stimm den nächsten Gang aktiv mit der Küche ab.",en:"Note the start time for each table and coordinate the next course actively with the kitchen.",th:"จดเวลาเริ่มของแต่ละโต๊ะ และประสานคอร์สถัดไปกับครัวเชิงรุก",zh:"记录每桌的开始时间，主动与厨房协调下一道菜。"}},

const critName = (k, lg) => { const c = CRITS.find(x=>x.k===k); return c ? (c[lg||L]||c.de) : k; };
function splitName(voll){
  const teile = String(voll || "").trim().split(/\s+/).filter(Boolean);
  if(teile.length < 2) return {nachname: teile[0] || "", vorname: ""};
  return {nachname: teile.slice(0,-1).join(" "), vorname: teile[teile.length-1]};
}
const anzeigeName = s => [s.nachname, s.vorname].filter(Boolean).join(" ") || s.name || "";
/* Klasse und Gruppe am Inhalt erkennen, in Kueche und Service gleich.
   Klasse: HFD, HFE1, HFE2 (auch "HFe 1"); alte Werte wie HFE bleiben gueltig.
   Gruppe: "Gruppe 1", "Team 2", auch "Grp 1" oder "Group 1".               */
function erkenneKlasse(v){
  const m = String(v || "").trim().match(/^hf\s*([a-z])\s*(\d?)$/i);
  return m ? ("HF" + m[1] + m[2]).toUpperCase() : "";
}
function erkenneGruppe(v){
  const s = String(v || "").trim();
  /* EHL-Einteilung: "Gruppe 1 Team A", auch "Gruppe 1A", "Gr1 A" */
  const e = s.match(/^(?:gruppe|grp|gr|group)\s*(\d+)\s*(?:team\s*)?([a-z])$/i);
  if(e) return "Gruppe " + e[1] + " Team " + e[2].toUpperCase();
  const m = s.match(/^(gruppe|grp|group|team)\s*(\d+)$/i);
  return m ? ((/^t/i.test(m[1]) ? "Team " : "Gruppe ") + m[2]) : "";
}
const klasseOf = s => (s && s.klasse) || S.settings.group || "";
const gruppeOf = s => (s && s.gruppe) || S.settings.team  || "";
/* Nachname; Vorname; Nickname; E-Mail; Sprache. E-Mail und Sprache werden am Inhalt
   erkannt, damit die alte Schreibweise "Ammann Lea; mail; de" weiter funktioniert. */
function parseStudentZeile(line){
  const roh = String(line || "").split(/[;\t]/).map(x=>x.trim());
  let mail = "", lang = "", klasse = "", gruppe = ""; const rest = [];
  roh.forEach(x=>{
    if(!x) return;
    if(!mail && x.indexOf("@") >= 0){ mail = x; return; }
    if(!klasse && erkenneKlasse(x)){ klasse = erkenneKlasse(x); return; }
    if(!gruppe && erkenneGruppe(x)){ gruppe = erkenneGruppe(x); return; }
    const lg = x.toLowerCase();
    if(!lang && ["de","en","zh"].indexOf(lg) >= 0 && x.length <= 3){ lang = lg; return; }
    rest.push(x);
  });
  let nachname = rest[0] || "", vorname = rest[1] || "", nick = rest[2] || "";
  if(nachname && !vorname){ const g = splitName(nachname); nachname = g.nachname; vorname = g.vorname; }
  if(!nachname && !vorname) return null;
  return {nachname, vorname, nick, mail, lang, klasse, gruppe};
}

/* ---------- Speicher, pro Datei getrennt ---------- */
const FILENAME = (function(){
  try{ const p = decodeURIComponent(location.pathname||""); const n = p.split("/").pop();
       return n || "Servicerapport_Mobil.html"; }catch(e){ return "Servicerapport_Mobil.html"; }
})();
const FILEID = (function(){
  let h = 0; const s = FILENAME;
  for(let i=0;i<s.length;i++){ h = ((h<<5)-h) + s.charCodeAt(i); h |= 0; }
  return "." + Math.abs(h).toString(36);
})();
const KEY = "servicerapport.mobil.v1" + FILEID;

S.students = (S.students || []).map(s=>{
  if(!s) return null;
  let nach = String(s.nachname == null ? "" : s.nachname).trim();
  let vor  = String(s.vorname  == null ? "" : s.vorname ).trim();
  if(!nach && !vor){ const g = splitName(s.name); nach = g.nachname; vor = g.vorname; }
  if(!nach && !vor) return null;
  const o = {...s, nachname:nach, vorname:vor, nick:String(s.nick || "").trim(),
             klasse:String(s.klasse || "").trim(), gruppe:String(s.gruppe || "").trim()};
  o.name = anzeigeName(o);
  return o;

/* ---- Startlink (Noten 2.0): Voreinstellungen aus dem Link ----
   Beispiel: ...Kuechenrapport_Mobil.html#lang=th&outlet=Umami&dozent=Q
   Alles nach dem # bleibt im Browser und wird nie an einen Server geschickt.
   Gesetzt wird nur, was im Link steht; der Rest bleibt wie auf dem Geraet gespeichert.
   Schluessel: lang (de/en/th), outlet, dozent, klasse, gruppe,
   plan (Bewertende nach Wochentag, z. B. plan=mo:Sybille,tu:Sybille,we:Laura,th:Laura) */
const STARTLINK = (function(){
  const p = {};
  try{
    String(location.hash || "").replace(/^#/, "").split("&").forEach(kv=>{
      const i = kv.indexOf("="); if(i <= 0) return;
      p[decodeURIComponent(kv.slice(0, i)).trim().toLowerCase()] =
        decodeURIComponent(kv.slice(i + 1).replace(/\+/g, " ")).trim();
    });
  }catch(e){ return {}; }
  const st = S.settings; let changed = false;
  const put = (k, v) => { if(v != null && v !== "" && st[k] !== v){ st[k] = v; changed = true; } };
  if(p.lang && ["de","en","th"].indexOf(p.lang.toLowerCase()) >= 0) put("uiLang", p.lang.toLowerCase());
  put("outlet", p.outlet);
  put("outlet2", p.outlet2);
  put("teacher", p.dozent);
  if(p.klasse) put("group", (typeof erkenneKlasse === "function" && erkenneKlasse(p.klasse)) || p.klasse);
  if(p.gruppe) put("team",  (typeof erkenneGruppe === "function" && erkenneGruppe(p.gruppe)) || p.gruppe);
  if(p.plan){
    const plan = {};
    p.plan.split(",").forEach(x=>{
      const m = x.split(":"); const wd = (m[0] || "").trim().toLowerCase(); const nm = (m[1] || "").trim();
      if(["mo","tu","we","th","fr","sa","su"].indexOf(wd) >= 0 && nm) plan[wd] = nm;
    });
    if(Object.keys(plan).length){
      if(JSON.stringify(st.teacherPlan || {}) !== JSON.stringify(plan)){ st.teacherPlan = plan; changed = true; }
      if(!p.dozent) put("teacher", Array.from(new Set(Object.values(plan))).join(" / "));
    }
  }
  if(changed){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
  return p;
})();

function slots(){
  const wd = (S.settings.weekdays && S.settings.weekdays.length) ? S.settings.weekdays : ["mo","tu","we","th"];
  const n = vcfg().n, hasEx = vcfg().exam;
  const st = Math.max(0, Math.min(S.settings.startIdx||0, wd.length-1));
  const out = [];
  for(let i=0;i<n;i++){
    const j = st + i;
    out.push({id:"d"+String(i+1).padStart(2,"0"), wd:wd[j % wd.length],
              week:Math.floor(j/wd.length)+1, idx:i+1, exam: hasEx && i === n-1});
  }
  return out;
}

})();

/* ---------- Hilfen ---------- */
function el(tag, attrs, kids){
  const n = document.createElement(tag);
  for(const k in (attrs||{})){
    const v = attrs[k];
    /* false und null bedeuten: Attribut gar nicht setzen. setAttribute("selected", false)
       wuerde sonst "selected=false" schreiben, und das gilt im HTML als gesetzt. */
    if(v === undefined || v === null || v === false) continue;
    if(k === "text") n.textContent = v;
    else if(k.slice(0,2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  (Array.isArray(kids) ? kids : (kids ? [kids] : [])).forEach(c=>c && n.appendChild(c));
  return n;
}
let toastT;
function toast(msg){
  const b = document.getElementById("toast");
  b.textContent = msg; b.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(()=>b.classList.remove("on"), 2600);
}

function clean(x){

}
function fileStem(){
  const d = new Date();
  const iso = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const p = [clean(S.settings.teacher), clean(S.settings.group), clean(S.settings.outlet),
             MVARIANT, iso].filter(Boolean);
  return p.length > 2 ? p.join("_") : "Servicerapport_" + MVARIANT + "_" + iso;
}
function dayRec(id, sid){

/* ---- Restaurantwechsel: Ort pro Person und Einsatztag ----
   S.settings.outlet = Stammrestaurant, S.settings.outlet2 = zweites Restaurant (freiwillig).
   r.outlet steht im Tagesdatensatz nur, wenn die Person nicht im Stammrestaurant war. */
const hasOutlet2 = () => !!String(S.settings.outlet2 || "").trim();
function outletOfDay(slotId, sid){
  const r = (S.days[slotId] || {})[sid];
  return (r && r.outlet) ? r.outlet : (S.settings.outlet || "");
}
/* Vorgabe fuer einen neuen Tag: Ort des letzten erfassten Tages dieser Person. */
function prevOutlet(slotId, sid){
  const all = slots(); const i = all.findIndex(s => s.id === slotId);
  for(let k = i - 1; k >= 0; k--){ const r = (S.days[all[k].id] || {})[sid]; if(r) return r.outlet || ""; }
  return "";
}
function planOutlet(s, slotId){
  const sl = slots().find(x => x.id === slotId);
  if(!s || !sl) return "";
  /* Tagesplan aus dem Cockpit: Restaurant pro Einsatztag */
  if(Array.isArray(s.ortPlan)){
    const o = String(s.ortPlan[sl.idx - 1] || "").trim();
    return (o && o !== String(S.settings.outlet || "").trim()) ? o : "";
  }
  return (s.wechselAb && s.wechselOutlet && sl.idx >= s.wechselAb) ? s.wechselOutlet : "";
}
/* Tagesplan aus dem Cockpit: Team Market an diesem Einsatztag? */
function planTM(s, slotId){
  const sl = slots().find(x => x.id === slotId);
  return !!(s && Array.isArray(s.tmTage) && sl && s.tmTage.indexOf(sl.idx) >= 0);
}

function toggleOutlet(r){
  r.outlet = r.outlet ? "" : String(S.settings.outlet2 || "").trim();
  if(!r.outlet) delete r.outlet;
}
/* Einsatzorte als Text: "Umami (Tag 1–5), Da Fortunat (Tag 6–10)". Leer, wenn die Person
   nur im Stammrestaurant war. lg = Sprache des Textes (de, en, zh, th). */
function placementText(sid, lg){
  const segs = [];
  slots().forEach(sl => {
    const r = (S.days[sl.id] || {})[sid]; if(!r) return;
    const o = r.outlet || S.settings.outlet || "–";
    const last = segs[segs.length - 1];
    if(last && last.o === o) last.to = sl.idx; else segs.push({o: o, from: sl.idx, to: sl.idx});
  });
  if(!segs.length) return "";
  if(segs.length === 1 && segs[0].o === (S.settings.outlet || "–")) return "";
  const rng = g => g.from === g.to ? String(g.from) : (g.from + "–" + g.to);
  const fmtR = g => (lg === "zh") ? ("第" + rng(g) + "天") : (lg === "en") ? ("Day " + rng(g))
                  : (lg === "th") ? ("วันที่ " + rng(g)) : ("Tag " + rng(g));
  return segs.map(g => g.o + " (" + fmtR(g) + ")").join(", ");
}
/* Beim Zusammenfuehren: Tage aus einer Datei mit anderem Stammrestaurant behalten ihren Ort. */
function mitOrt(r, o){
  const src = String((o && o.meta && o.meta.outlet) || (o && o.settings && o.settings.outlet) || "").trim();
  if(r && !r.outlet && src && src !== String(S.settings.outlet || "").trim()) return Object.assign({}, r, {outlet: src});
  return r;
}

/* Foto und Nickname fuer die Erfassung (Noten 2.0). foto ist ein kleines JPEG aus dem Cockpit. */
function avatar(s, size){
  const px = (size || 32) + "px";
  if(s && typeof s.foto === "string" && s.foto.indexOf("data:image/") === 0)
    return el("img",{class:"ava",src:s.foto,alt:"",style:"width:"+px+";height:"+px});
  return null;
}
const nickTag = s => (s && s.nick) ? " «" + s.nick + "»" : "";
function openSlot(id){
  S.days[id] = S.days[id] || {};
  S.students.forEach(s=>{
    if(!S.days[id][s.id]){
      S.days[id][s.id] = {att: planTM(s, id) ? "tm" : "present", obs:[], note:null};
      /* Mit Tagesplan gilt nur der Plan (leer = Stammrestaurant); sonst Ort vom Vortag */
      const vo = Array.isArray(s.ortPlan) ? planOutlet(s, id)
               : (planOutlet(s, id) || (hasOutlet2() ? prevOutlet(id, s.id) : ""));
      if(vo) S.days[id][s.id].outlet = vo;
    }
  });
  const sl = slotById(id);
  const m = S.dayMeta[id] || {};
  if(!m.teacher) m.teacher = teacherForWd(sl && sl.wd);
  if(!m.group)   m.group   = S.settings.group   || "";
  if(!m.team)    m.team    = S.settings.team    || "";
  if(!m.outlet)  m.outlet  = S.settings.outlet  || "";
  if(!m.label)   m.label   = slotLabel(sl, "de");
  if(!m.weekday) m.weekday = sl.wd;
  if(!m.date)    m.date    = new Date().toISOString().slice(0,10);
  m.source = "mobil";
  S.dayMeta[id] = m;
  persist();
}

function jsonBlob(){
  return new Blob([JSON.stringify(snapshot(), null, 1)], {type:"application/json"});
}
async function shareDay(){
  const name = fileStem() + ".json";
  const blob = jsonBlob();
  try{
    const file = new File([blob], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:name});
      toast(t("shared")); return;
    }
  }catch(e){ if(e && e.name === "AbortError") return; }
  downloadBlob(blob, name);
}
function downloadBlob(blob, name){
  try{
    const url = URL.createObjectURL(blob);
    const a = el("a",{href:url, download:name, style:"display:none"});
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 6000);
    toast(t("saved") + ": " + name);
  }catch(e){ toast(name); }
}
function absenceList(id){
  const d = S.days[id] || {}; const out = [];
  S.students.forEach(s=>{
    const r = d[s.id]; if(!r) return;
    const k = r.att === "late" ? t("late")
            : r.att === "excused" ? t("excused")
            : r.att === "unexcused" ? t("unexcused") : null;
    if(!k) return;
    /* Name, Vorname, Nickname, Klasse, Gruppe und Grund auf einer Zeile, damit eine
       einzelne Zeile ohne den Kopf der Mail weitergeleitet werden kann. */
    const person = [s.nachname || s.name || "", s.vorname || ""].filter(Boolean).join(", ")
                 + (s.nick ? " \u00ab" + s.nick + "\u00bb" : "");
    const kg = [klasseOf(s), gruppeOf(s)].filter(Boolean).join(" \u00b7 ");
    const ort = (hasOutlet2() || r.outlet) ? outletOfDay(id, s.id) : "";
    out.push(person + (kg ? "   \u00b7   " + kg : "") + (ort ? "   \u00b7   " + ort : "") + "   \u2014   " + k);
  });
  return out;
}

/* ---------- Erfassung pro Person ---------- */
let sheetCrit = "gas", sheetAll = false;
function openSheet(student){
  const host = document.getElementById("sheetHost");
  sheetCrit = "gas"; sheetAll = false;
  /* Die Scrollsperre wird an einer Stelle geloest, damit sie nicht haengen bleibt. */
  const entsperren = ()=>{ host.innerHTML = ""; try{ document.body.style.overflow = ""; }catch(e){} };
  const close = ()=>{ entsperren(); render(); };
  document.body.style.overflow = "hidden";
  const sh = el("div",{class:"sheet"});
  const hd = el("div",{class:"sheet-h"});
  hd.appendChild(el("div",{style:"min-width:0;flex:1"},[
    el("div",{class:"nm",text:student.name + nickTag(student)}),
    el("div",{class:"sb",text:slotLabel(slotById(curSlot))})
  ]));
  if(hasOutlet2()){
    const rr = dayRec(curSlot, student.id);
    const ob = el("button",{class:"opill"+(rr.outlet?" alt":""),title:t("switchTitle"),
      text:"\u21c4 " + (rr.outlet || S.settings.outlet || "\u2013")});
    ob.addEventListener("click", ()=>{ toggleOutlet(rr); persist();
      ob.className = "opill" + (rr.outlet ? " alt" : ""); ob.textContent = "\u21c4 " + (rr.outlet || S.settings.outlet || "\u2013"); });
    hd.appendChild(ob);
  }
  hd.appendChild(el("button",{class:"hbtn",text:"✕","aria-label":t("done"),onclick:close}));
  sh.appendChild(hd);
  const body = el("div",{class:"sheet-b"});
  sh.appendChild(body);
  const ft = el("div",{class:"sheet-f"});
  const ix = S.students.findIndex(x=>x.id===student.id);
  if(ix > 0) ft.appendChild(el("button",{class:"btn",text:"‹",
    onclick:()=>{ entsperren(); openSheet(S.students[ix-1]); }}));
  ft.appendChild(el("button",{class:"btn pri",text:t("done"),onclick:close}));
  if(ix < S.students.length-1) ft.appendChild(el("button",{class:"btn",text:"›",
    onclick:()=>{ entsperren(); openSheet(S.students[ix+1]); }}));
  sh.appendChild(ft);
  host.innerHTML = ""; host.appendChild(sh);

  function draw(){
    body.innerHTML = "";
    const r = dayRec(curSlot, student.id);

    /* Anwesenheit */
    body.appendChild(el("span",{class:"eyebrow",style:"display:block;margin-bottom:7px",text:t("attendance")}));
    const att = el("div",{class:"att"});
    [["present",""],["late","warn"],["excused",""],["unexcused","bad"],["teamMarket","tm"]]
      .forEach(([k,cls],i)=>{
        const val = (k === "teamMarket") ? "tm" : k;
        att.appendChild(el("button",{class:cls,"aria-pressed":String((r.att||"present")===val),
          text:t(k), onclick:()=>{ r.att = val; persist(); draw(); }}));
      });
    body.appendChild(att);

    /* Kriterien */
    body.appendChild(el("span",{class:"eyebrow",style:"display:block;margin:18px 0 7px",text:t("obs")}));
    const bar = el("div",{class:"critbar"});
    CRITS.forEach(c=>{
      const n = (r.obs||[]).filter(id=>CHIP[id] && CHIP[id].c === c.k).length;
      const b = el("button",{"aria-current":String(sheetCrit===c.k),
        onclick:()=>{ sheetCrit = c.k; sheetAll = false; draw(); }});
      b.appendChild(el("span",{text:critShort(c.k)}));
      if(n) b.appendChild(el("span",{class:"n",text:"("+n+")"}));
      if(sheetCrit === c.k) setTimeout(()=>{ try{ b.scrollIntoView({block:"nearest",inline:"center"}); }catch(e){} }, 0);
      bar.appendChild(b);
    });
    bar.appendChild(el("button",{"aria-current":String(sheetCrit==="__note"),
      onclick:()=>{ sheetCrit = "__note"; draw(); }, text:"✎ "+t("note")}));
    body.appendChild(bar);

    if(sheetCrit === "__note"){
      const nt = r.note || {txt:""};
      const f = el("div",{class:"field"});
      const ta = el("textarea",{placeholder:t("notePh"),
        oninput:e=>{ r.note = {txt:e.target.value, crit:"", dir:0, w:0}; persist(); }});
      ta.value = nt.txt || "";
      f.appendChild(ta);
      body.appendChild(f);
      body.appendChild(el("p",{class:"muted",style:"margin:0",text:t("noteHint")}));
      return;
    }

    const set = new Set(r.obs || []);
    const quick = QUICK[sheetCrit] || [];
    const list = CHIPS.filter(c=>c.c === sheetCrit);
    const shown = sheetAll ? list
      : list.filter(c=>quick.indexOf(c.i) >= 0 || set.has(c.i));
    const order = c => (quick.indexOf(c.i) >= 0 ? quick.indexOf(c.i) : 90) + (c.d > 0 ? 0 : -0.5);
    shown.sort((a,b)=>order(a)-order(b));

    const box = el("div",{class:"chips"});
    shown.forEach(c=>{
      const on = set.has(c.i);
      const wtxt = c.ko ? t("ko") : (c.w === W.l ? t("light") : (c.w === W.s ? t("heavy") : t("medium")));
      const b = el("button",{class:"chip "+(c.d>0?"pos":"neg")+(c.ko?" ko":""),
        "aria-pressed":String(on),
        onclick:()=>{
          const s2 = new Set(r.obs || []);
          if(s2.has(c.i)) s2.delete(c.i); else s2.add(c.i);
          r.obs = [...s2]; persist(); draw();
        }});
      b.appendChild(el("span",{class:"sg",text: on ? "✓" : (c.d>0 ? "+" : "−")}));
      b.appendChild(el("span",{class:"tx"},[
        document.createTextNode(chipT(c)),
        el("div",{class:"w",text:(c.d>0?"+ ":"− ")+wtxt})
      ]));
      box.appendChild(b);
    });
    body.appendChild(box);
    if(list.length > shown.length || sheetAll)
      body.appendChild(el("button",{class:"morebtn",style:"margin-top:9px",
        text: sheetAll ? t("showLess") : t("showAll")+" ("+list.length+")",
        onclick:()=>{ sheetAll = !sheetAll; draw(); }}));
  }
  draw();
}

/* ---------- Setup ---------- */
let loadArmed = false;
function renderSet(){
  const root = document.getElementById("view"); root.innerHTML = "";

  if(!storeOK) root.appendChild(el("div",{class:"banner",
    text:"Dieses Gerät speichert nichts im Browser. Teilen Sie den Tag sofort nach dem Erfassen."}));

  /* Sicherung laden */
  const c0 = el("div",{class:"card pad"});
  c0.appendChild(el("span",{class:"eyebrow",style:"display:block;margin-bottom:6px",text:t("loadBackup")}));
  c0.appendChild(el("p",{class:"muted",style:"margin:0 0 11px",text:t("loadHint")}));
  const fin = el("input",{type:"file",accept:".json,application/json",style:"display:none",onchange:onLoadBackup});
  const lb = el("button",{class:"btn pri wide",text:t("loadBtn"),onclick:()=>{
    const hasData = S.students.length || Object.keys(S.days||{}).length;
    if(hasData && !loadArmed){
      loadArmed = true; lb.textContent = t("loadArm");
      lb.style.background = "var(--minus)"; lb.style.borderColor = "var(--minus)";
      setTimeout(()=>{ if(loadArmed){ loadArmed = false; renderSet(); } }, 6000);
      return;
    }
    fin.click();
  }});
  c0.appendChild(lb); c0.appendChild(fin);
  root.appendChild(c0);

  /* Angaben */
  root.appendChild(el("h2",{class:"sec",text:t("setup")}));
  const c1 = el("div",{class:"card pad"});
  const tf = (id, label, key) => {
    const f = el("div",{class:"field"});
    f.appendChild(el("label",{for:id,text:label}));
    f.appendChild(el("input",{id:id,value:S.settings[key]||"",autocapitalize:"words",
      oninput:e=>{ S.settings[key]=e.target.value; persist();
                   document.getElementById("brandSub").textContent = subLine(); }}));
    return f;
  };
  const g = el("div",{class:"grid2"});
  /* Klasse und Gruppe als feste Listen, gleich wie in der Laptop-Datei. */
  const sf = (id, label, key, liste) => {
    const f = el("div",{class:"field"});
    f.appendChild(el("label",{for:id,text:label}));
    const cur = S.settings[key] || "";
    const opts = liste.slice();
    if(cur && opts.indexOf(cur) < 0) opts.push(cur);
    const sel = el("select",{id:id, onchange:e=>{
      S.settings[key] = e.target.value; persist();
      document.getElementById("brandSub").textContent = subLine();
    }});
    sel.appendChild(el("option",{value:"", text:"\u2013", selected: !cur}));
    opts.forEach(v=>sel.appendChild(el("option",{value:v, text:v, selected: cur === v})));
    f.appendChild(sel);
    return f;
  };
  g.appendChild(sf("mGroup", t("group"), "group", KLASSEN));
  g.appendChild(sf("mTeam",  t("team"),  "team",  GRUPPEN));
  c1.appendChild(g);
  c1.appendChild(tf("mOutlet",  t("outlet"),  "outlet"));
  const fO2 = tf("mOutlet2", t("outlet2"), "outlet2");
  fO2.appendChild(el("span",{class:"muted",text:t("outlet2Hint")}));
  c1.appendChild(fO2);
  c1.appendChild(tf("mTeacher", t("teacher"), "teacher"));

  const fv = el("div",{class:"field"});
  fv.appendChild(el("label",{text:t("variant")}));
  fv.appendChild(el("div",{style:"padding:11px 12px;border:1px solid var(--line);border-radius:10px;"
    + "background:var(--surf2);font-weight:600", text:{"10T":t("v10"),"4T":t("v4"),"5T":t("v5")}[MVARIANT]}));
  fv.appendChild(el("span",{class:"muted",text:t("varFixed")}));
  c1.appendChild(fv);

  const fs = el("div",{class:"field"});
  fs.appendChild(el("label",{for:"mStart",text:t("startDay")}));
  const ss = el("select",{id:"mStart",onchange:e=>{
    S.settings.startIdx = parseInt(e.target.value,10) || 0; persist(); render();
  }});
  (S.settings.weekdays||["mo","tu","we","th"]).forEach((k,i)=>
    ss.appendChild(el("option",{value:String(i),text:wdName(k),selected:(S.settings.startIdx||0)===i})));
  fs.appendChild(ss); c1.appendChild(fs);

  const f5 = el("div",{class:"field"});
  f5.appendChild(el("label",{for:"mStud",text:t("studentList")}));
  const ta = el("textarea",{id:"mStud",autocapitalize:"words"});
  ta.value = S.students.map(s=>studentZeile(s)).join("\n");
  f5.appendChild(ta);
  f5.appendChild(el("span",{class:"muted",text:t("studentHint")}));
  c1.appendChild(f5);
  c1.appendChild(el("button",{class:"btn pri wide",text:t("apply"),onclick:()=>{
    const lines = ta.value.split("\n").map(x=>x.trim()).filter(Boolean);
    S.students = lines.map(line=>{
      const g = parseStudentZeile(line);
      if(!g) return null;
      const ex = S.students.find(s=>
        (s.nachname||"").trim().toLowerCase() === g.nachname.toLowerCase() &&
        (s.vorname ||"").trim().toLowerCase() === g.vorname.toLowerCase());
      const o = ex ? {...ex, ...g, nick:g.nick||ex.nick||"", mail:g.mail||ex.mail||"", lang:g.lang||ex.lang||"",
                      klasse:g.klasse||ex.klasse||"", gruppe:g.gruppe||ex.gruppe||""}
                   : {id:"m"+Math.random().toString(36).slice(2,8), ...g};
      o.name = anzeigeName(o);
      return o;
    }).filter(Boolean);
    persist(); toast(S.students.length + " " + t("students"));
    view = "day"; render();
  }}));
  root.appendChild(c1);

  /* Sicherung sichern */
  root.appendChild(el("h2",{class:"sec",text:t("saveBackup")}));
  const c2 = el("div",{class:"card pad"});
  c2.appendChild(el("div",{class:"row"},[
    el("button",{class:"btn",text:t("saveBtn"),
      onclick:()=>downloadBlob(jsonBlob(), fileStem()+".json")}),
    el("button",{class:"btn",text:"⇪ "+t("share"),onclick:shareDay})
  ]));
  c2.appendChild(el("p",{class:"muted",style:"margin:11px 0 0",text:fileStem()+".json"}));
  root.appendChild(c2);

  /* Selbsttest */
  root.appendChild(el("h2",{class:"sec",text:t("selfTest")}));
  const c3 = el("div",{class:"card pad"});
  c3.appendChild(el("p",{class:"muted",style:"margin:0 0 10px",text:t("selfTestHint")}));
  const tOut = el("div",{});
  c3.appendChild(el("button",{class:"btn wide",text:t("selfTestBtn"),onclick:()=>{
    const res = selfTest(), bad = res.filter(r=>!r.ok).length;
    tOut.innerHTML = "";
    tOut.appendChild(el("div",{style:"font-weight:700;margin:12px 0 6px;color:"
      + (bad ? "var(--minus)" : "var(--plus)"),
      text:(res.length-bad)+" / "+res.length+" "+t("selfTestOkN")}));
    res.forEach(r=>{
      const row = el("div",{style:"display:flex;gap:9px;align-items:flex-start;font-size:14px;"
        + "padding:7px 0;border-top:1px solid var(--line)"});
      row.appendChild(el("span",{style:"flex:0 0 15px;font-weight:700;color:"
        + (r.ok?"var(--plus)":"var(--minus)"), text:r.ok?"\u2713":"\u2717"}));
      row.appendChild(el("span",{style:"flex:1;line-height:1.35", text:r.name}));
      if(r.info) row.appendChild(el("span",{style:"color:var(--ink3);font-size:12.5px",text:r.info}));
      tOut.appendChild(row);
    });
    toast((res.length-bad)+" / "+res.length);
  }}));
  c3.appendChild(tOut);
  root.appendChild(c3);

  root.appendChild(el("p",{class:"muted",style:"margin:16px 2px 0",text:t("homeHint")}));
}
async function onLoadBackup(e){
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!f) return;
  try{
    const o = JSON.parse(await f.text());
    if(!o || !o.settings || !Array.isArray(o.students)) throw new Error("format");
    const other = o.variant && o.variant !== MVARIANT;
    S = {settings:{...DEF, ...o.settings, variant:MVARIANT},
         students:o.students||[],
         days: other ? {} : (o.days||{}),
         dayMeta: other ? {} : (o.dayMeta||{})};
    delete S.settings.isSample;
    L = (T[S.settings.uiLang] ? S.settings.uiLang : "de");
    persist();
    curSlot = slots()[0].id;
    view = "day"; render();
    toast(other ? t("loadPartial")
                : (t("loadDone") + ": " + S.students.length + " " + t("students")));
  }catch(err){ toast(t("loadBad")); }
}


/* ---------- Selbsttest ---------- */
function selfTest(){
  const out = []; const add = (n,c,i)=>out.push({name:n, ok:!!c, info:i==null?"":String(i)});
  const ids = CHIPS.map(c=>c.i);
  add(t("stChips"), ids.length === new Set(ids).size, CHIPS.length + " / " + CRITS.length);
  add(t("stCrit"), CHIPS.every(c=>CRITS.some(k=>k.k===c.c)));
  add(t("stAction"), CHIPS.filter(c=>c.d<0 && !c.ko).every(c=>c.a && c.a.de));
  const LG = ["de","en","th","zh"];
  add(t("stLang"), CHIPS.every(c=>LG.every(l=>c.t[l])) && CRITS.every(c=>LG.every(l=>c[l])));
  add(t("stLate"), !!CHIP["tea-lt"]);
  add(t("stSlots"), slots().every((s,i)=>s.id === "d"+String(i+1).padStart(2,"0")), slots().length + " " + t("days"));
  const wd = S.settings.weekdays || ["mo","tu","we","th"];
  const soll = wdName(wd[Math.max(0, Math.min(S.settings.startIdx||0, wd.length-1))]);
  add(t("stStart"), slotLabel(slots()[0]).indexOf(soll) === 0, soll);
  add(t("stQuick"), Object.keys(QUICK).every(k=>CRITS.some(c=>c.k===k))
      && Object.values(QUICK).every(a=>a.every(i=>!!CHIP[i])));
  add(t("stNames"), S.students.every(s => s.nachname || s.vorname), S.students.length);
  add(t("stClass"), !!(S.settings.group && S.settings.team),
      [S.settings.group, S.settings.team].filter(Boolean).join(" \u00b7 ") || "\u2013");
  add(t("stStore"), storeOK);
  return out;
}

/* ---------- Fussleiste ---------- */
function renderBar(){
  const bar = document.getElementById("bar"); bar.innerHTML = "";
  if(view === "set"){
    bar.appendChild(el("button",{class:"btn pri wide",text:t("done"),
      onclick:()=>{ view = "day"; render(); }}));
    return;
  }
  bar.appendChild(el("button",{class:"btn pri",text:"⇪ "+t("share"),onclick:shareDay}));
  bar.appendChild(el("button",{class:"btn",text:"✉ "+t("absMail"),onclick:absenceMail}));
}

/* ---------- Sprache ---------- */
function cycleLang(){
  const i = UI_LANGS.findIndex(x=>x.code === L);
  L = UI_LANGS[(i+1) % UI_LANGS.length].code;
  S.settings.uiLang = L; persist();
  document.documentElement.setAttribute("lang", L);
  render();
  toast(t("langTitle") + ": " + UI_LANGS.find(x=>x.code===L).name);
}

/* ---------- Start ---------- */
function render(){
  L = T[S.settings.uiLang] ? S.settings.uiLang : "de";
  document.documentElement.setAttribute("lang", L);
  renderHead(); renderSlots(); renderBar();
  if(view === "set") renderSet(); else renderDay();
}
document.getElementById("btnSet").addEventListener("click", ()=>{
  view = (view === "set") ? "day" : "set"; loadArmed = false; render();
});
document.getElementById("btnLang").addEventListener("click", cycleLang);
render();

</script>
